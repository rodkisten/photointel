# GitHub -> Cloud Build -> Artifact Registry, with the REPOSITORY ROOT context.
# Select /cloudbuild.yaml in a repository trigger. Creating/running that trigger
# is an operator action that can incur build/storage charges.
# This file only builds an image. Deploy with the guarded infra/gcp/manage.py
# workflow after migration/backup/auth checks; never update a live API on push.
# Provision the private Artifact Registry repository separately before building.
substitutions:
  _REGION: us-central1
  _REPOSITORY: cloud-run-source-deploy
  _IMAGE_NAME: photointel

steps:
  - id: validate-and-identify-source
    name: python:3.12-slim
    entrypoint: bash
    env:
      - SOURCE_GIT_SHA=$COMMIT_SHA
      - SOURCE_BRANCH=$BRANCH_NAME
      - SOURCE_BUILD_ID=$BUILD_ID
    args:
      - -c
      - |
        set -euo pipefail
        test -f pyproject.toml
        test -f uv.lock
        test -d packages/icloudpd-source
        test -d apps/api/src/photointel
        python infra/gcp/build_source_manifest.py
        python -m compileall -q apps/api/src infra/gcp
        # The offline Telegram transport tests execute jq, which is not present
        # in python:3.12-slim. Keep the test container dependency explicit.
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends jq
        python -m unittest discover -s infra/gcp/tests -v

  - id: verify-existing-repository
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: python3
    args:
      - infra/gcp/cloud_cli.py
      - --project=$PROJECT_ID
      - --
      - artifacts
      - repositories
      - describe
      - ${_REPOSITORY}
      - --location=${_REGION}

  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=infra/docker/api.Dockerfile
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID
      - .
    waitFor: [validate-and-identify-source, verify-existing-repository]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
