# Local-only development; unsafe Imagor is bound exclusively to loopback.
services:
  imagor:
    image: shumc/imagor:latest
    ports:
      - "127.0.0.1:8008:8000"
    environment:
      PORT: "8000"
      IMAGOR_UNSAFE: "1"
      IMAGOR_AUTO_WEBP: "1"
      IMAGOR_AUTO_AVIF: "1"
    restart: unless-stopped
  video:
    build: ./video
    profiles: ["video"]
    environment:
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT required}
      R2_BUCKET: ${R2_BUCKET:?R2_BUCKET required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY required}
      MEDIA_INPUT_KEY: ${MEDIA_INPUT_KEY:?MEDIA_INPUT_KEY required}
      MEDIA_OUTPUT_KEY: ${MEDIA_OUTPUT_KEY:?MEDIA_OUTPUT_KEY required}
      MEDIA_WATERMARK: ${MEDIA_WATERMARK:-}
