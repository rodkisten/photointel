
name: "📱 Notify"
description: "Track strategic stages, update Live Activities and send Telegram notifications."

inputs:
  action:
    description: "start, step or end"
    required: true

  device-id:
    description: "Repository secret NOTIFY_DEVICE_ID"
    required: false

  token:
    description: "Repository secret NOTIFY_TOKEN"
    required: false

  telegram-token:
    description: "Bearer token for xtelegram notifications"
    required: false

  workflow:
    description: "Display name for the workflow"
    required: false

  job:
    description: "Job name"
    required: false

  step:
    description: "Exact GitHub step name"
    required: false

  outcome:
    description: "running, success, failure, cancelled or skipped"
    required: false

  activity-id:
    description: "Unique Live Activity ID"
    required: false

  progress:
    description: "Legacy percentage fallback"
    required: false
    default: "0"

  step-index:
    description: "1-based workflow step position"
    required: false

  label:
    description: "Human-friendly stage label"
    required: false

  completed:
    description: "Number of completed strategic phases"
    default: "0"
    required: false

  total:
    description: "Total strategic phases"
    default: "1"
    required: false

  github-token:
    description: "GITHUB_TOKEN with actions:read"
    required: false

  project:
    description: "GCP project"
    required: false

  region:
    description: "GCP region"
    default: "us-central1"
    required: false

outputs:
  activity_id:
    description: "Unique Live Activity ID"
    value: ${{ steps.send.outputs.activity_id }}

runs:
  using: composite

  steps:
    - name: "📱 Atualizar atividade"
      id: send
      shell: bash

      env:
        NOTIFY_DEVICE_ID: ${{ inputs.device-id }}
        NOTIFY_TOKEN: ${{ inputs.token }}
        GITHUB_API_TOKEN: ${{ inputs.github-token }}
        NOTIFY_COMPLETED: ${{ inputs.completed }}
        NOTIFY_TOTAL: ${{ inputs.total }}
        NOTIFY_PROJECT: ${{ inputs.project }}
        NOTIFY_REGION: ${{ inputs.region }}
        ACTION: ${{ inputs.action }}
        WORKFLOW_LABEL: ${{ inputs.workflow }}
        JOB_LABEL: ${{ inputs.job }}
        STEP_LABEL: ${{ inputs.step }}
        PHASE_LABEL: ${{ inputs.label }}
        TARGET_STEP_INDEX: ${{ inputs.step-index }}
        STEP_OUTCOME: ${{ inputs.outcome }}
        LIVE_ID: ${{ inputs.activity-id }}
        LIVE_PROGRESS: ${{ inputs.progress }}

      run: >-
        python3 infra/notify/notify.py
        --action "$ACTION"
        --workflow "$WORKFLOW_LABEL"
        --job "$JOB_LABEL"
        --step "$STEP_LABEL"
        --label "$PHASE_LABEL"
        --step-index "$TARGET_STEP_INDEX"
        --outcome "$STEP_OUTCOME"
        --activity-id "$LIVE_ID"
        --progress "$LIVE_PROGRESS"
        --completed "$NOTIFY_COMPLETED"
        --total "$NOTIFY_TOTAL"
        --project "$NOTIFY_PROJECT"
        --region "$NOTIFY_REGION"

    - name: "📨 Notify Telegram"
      if: ${{ always() && inputs.telegram-token != '' }}
      continue-on-error: true
      shell: bash

      env:
        TELEGRAM_TOKEN: ${{ inputs.telegram-token }}
        ACTION: ${{ inputs.action }}
        WORKFLOW_LABEL: ${{ inputs.workflow }}
        JOB_LABEL: ${{ inputs.job }}
        STEP_LABEL: ${{ inputs.step }}
        PHASE_LABEL: ${{ inputs.label }}
        STEP_OUTCOME: ${{ inputs.outcome }}
        NOTIFY_COMPLETED: ${{ inputs.completed }}
        NOTIFY_TOTAL: ${{ inputs.total }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      run: |
        set -euo pipefail

        jq -n \
          --arg action "$ACTION" \
          --arg workflow "$WORKFLOW_LABEL" \
          --arg job "$JOB_LABEL" \
          --arg step "$STEP_LABEL" \
          --arg label "$PHASE_LABEL" \
          --arg outcome "$STEP_OUTCOME" \
          --arg completed "$NOTIFY_COMPLETED" \
          --arg total "$NOTIFY_TOTAL" \
          --arg url "$RUN_URL" \
          '
          def clean:
            gsub("^\\s+|\\s+$"; "");

          ($action | clean | ascii_downcase) as $action |
          ($outcome | clean | ascii_downcase) as $outcome |
          ($workflow | clean) as $workflow |
          ($job | clean) as $job |
          ($step | clean) as $step |
          ($label | clean) as $label |
          ($completed | tonumber? // 0) as $completed |
          ($total | tonumber? // 1) as $total |

          (
            if $action == "start" then
              "🚀 Execução iniciada"
            elif $action == "step" then
              if $outcome == "success" then
                "✅ Etapa concluída"
              elif $outcome == "failure" then
                "❌ Etapa falhou"
              elif $outcome == "cancelled" then
                "🚫 Etapa cancelada"
              elif $outcome == "skipped" then
                "⏭️ Etapa ignorada"
              else
                "⏳ Etapa em andamento"
              end
            elif $action == "end" then
              if $outcome == "success" then
                "✅ Execução concluída"
              elif $outcome == "failure" then
                "❌ Execução falhou"
              elif $outcome == "cancelled" then
                "🚫 Execução cancelada"
              else
                "🏁 Execução encerrada"
              end
            else
              "🔔 Atualização de execução"
            end
          ) as $title |

          (
            [
              $title,

              (
                if $workflow != "" then
                  "⚙️ " + $workflow
                else
                  empty
                end
              ),

              (
                if $job != "" and $job != $workflow then
                  "🧩 " + $job
                else
                  empty
                end
              ),

              (
                if $action == "step" then
                  if $label != "" then
                    "📍 " + $label
                  elif $step != "" then
                    "📍 " + $step
                  else
                    empty
                  end
                else
                  empty
                end
              ),

              (
                if $action == "step"
                   and $completed > 0
                   and $total > 1
                   and $completed <= $total then
                  "📊 Progresso: \($completed)/\($total)"
                else
                  empty
                end
              )
            ]
            | join("\n")
          ) as $body |

          {
            body: $body,
            buttons: [
              [
                {
                  text: "🔎 Abrir execução",
                  url: $url
                }
              ]
            ]
          }
          ' |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            -X POST \
            "https://xtelegram-cf.migos.club/notifications/send" \
            -H "Authorization: Bearer $TELEGRAM_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @-
