
name: "📱 Notify"
description: "Track strategic stages, update Live Activities and send Telegram notifications."

inputs:
  action:
    description: "start, step or end"
    required: true

  device-id:
    description: "Repository secret NOTIFY_DEVICE_ID"
    required: false

  token:
    description: "Repository secret NOTIFY_TOKEN"
    required: false

  telegram-token:
    description: "Bearer token for xtelegram notifications"
    required: false

  workflow:
    description: "Display name for the workflow"
    required: false

  job:
    description: "Job name"
    required: false

  step:
    description: "Exact GitHub step name"
    required: false

  outcome:
    description: "running, success, failure, cancelled or skipped"
    required: false

  activity-id:
    description: "Unique Live Activity ID"
    required: false

  progress:
    description: "Legacy percentage fallback"
    required: false
    default: "0"

  step-index:
    description: "1-based workflow step position"
    required: false

  label:
    description: "Human-friendly stage label"
    required: false

  completed:
    description: "Number of completed strategic phases"
    default: "0"
    required: false

  total:
    description: "Total strategic phases"
    default: "1"
    required: false

  github-token:
    description: "GITHUB_TOKEN with actions:read"
    required: false

  project:
    description: "GCP project"
    required: false

  region:
    description: "GCP region"
    default: "us-central1"
    required: false

outputs:
  activity_id:
    description: "Unique Live Activity ID"
    value: ${{ steps.send.outputs.activity_id }}

runs:
  using: composite

  steps:
    - name: "📱 Atualizar atividade"
      id: send
      shell: bash

      env:
        NOTIFY_DEVICE_ID: ${{ inputs.device-id }}
        NOTIFY_TOKEN: ${{ inputs.token }}
        GITHUB_API_TOKEN: ${{ inputs.github-token }}
        NOTIFY_COMPLETED: ${{ inputs.completed }}
        NOTIFY_TOTAL: ${{ inputs.total }}
        NOTIFY_PROJECT: ${{ inputs.project }}
        NOTIFY_REGION: ${{ inputs.region }}
        ACTION: ${{ inputs.action }}
        WORKFLOW_LABEL: ${{ inputs.workflow }}
        JOB_LABEL: ${{ inputs.job }}
        STEP_LABEL: ${{ inputs.step }}
        PHASE_LABEL: ${{ inputs.label }}
        TARGET_STEP_INDEX: ${{ inputs.step-index }}
        STEP_OUTCOME: ${{ inputs.outcome }}
        LIVE_ID: ${{ inputs.activity-id }}
        LIVE_PROGRESS: ${{ inputs.progress }}

      run: >-
        python3 infra/notify/notify.py
        --action "$ACTION"
        --workflow "$WORKFLOW_LABEL"
        --job "$JOB_LABEL"
        --step "$STEP_LABEL"
        --label "$PHASE_LABEL"
        --step-index "$TARGET_STEP_INDEX"
        --outcome "$STEP_OUTCOME"
        --activity-id "$LIVE_ID"
        --progress "$LIVE_PROGRESS"
        --completed "$NOTIFY_COMPLETED"
        --total "$NOTIFY_TOTAL"
        --project "$NOTIFY_PROJECT"
        --region "$NOTIFY_REGION"

    - name: "📨 Notify Telegram"
      # Explicit input, then inline GCP_CONFIG_ENV token, then optional
      # Secret Manager reference. No Google secret read when inline is present.
      if: ${{ always() }}
      continue-on-error: true
      shell: bash

      env:
        TELEGRAM_TOKEN: ${{ inputs.telegram-token }}
        ACTION: ${{ inputs.action }}
        WORKFLOW_LABEL: ${{ inputs.workflow }}
        JOB_LABEL: ${{ inputs.job }}
        STEP_LABEL: ${{ inputs.step }}
        PHASE_LABEL: ${{ inputs.label }}
        STEP_OUTCOME: ${{ inputs.outcome }}
        NOTIFY_COMPLETED: ${{ inputs.completed }}
        NOTIFY_TOTAL: ${{ inputs.total }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        REPOSITORY: ${{ github.repository }}

      run: |
        set -euo pipefail
        ENDPOINT="https://xtelegram-cf.migos.club/notifications/send"
        CHAT=""
        if [[ -f "${GCP_CONFIG_FILE:-infra/gcp/config.local.json}" ]]; then
          config="${GCP_CONFIG_FILE:-infra/gcp/config.local.json}"
          ENDPOINT="$(jq -r '.extra_environment.TELEGRAM_NOTIFICATION_URL // "https://xtelegram-cf.migos.club/notifications/send"' "$config")"
          CHAT="$(jq -r '.extra_environment.TELEGRAM_NOTIFICATION_CHAT_ID // ""' "$config")"
          if [[ -z "$TELEGRAM_TOKEN" ]]; then
            TELEGRAM_TOKEN="$(jq -r '.extra_environment.TELEGRAM_NOTIFICATION_API_TOKEN // empty' "$config")"
          fi
          if [[ -z "$TELEGRAM_TOKEN" ]] && command -v gcloud >/dev/null 2>&1; then
            secret="$(jq -r '.secrets.TELEGRAM_NOTIFICATION_API_TOKEN.name // empty' "$config")"
            version="$(jq -r '.secrets.TELEGRAM_NOTIFICATION_API_TOKEN.version // empty' "$config")"
            if [[ -n "$secret" && "$version" =~ ^[0-9]+$ ]]; then
              TELEGRAM_TOKEN="$(gcloud secrets versions access "$version" --secret="$secret" --project=photointel --quiet 2>/dev/null)" || TELEGRAM_TOKEN=""
            fi
          fi
        fi
        if [[ -z "$TELEGRAM_TOKEN" ]]; then
          echo "::notice::Telegram skipped: set TELEGRAM_NOTIFICATION_API_TOKEN in GCP_CONFIG_ENV or configure a Secret Manager reference."
          exit 0
        fi
        echo "::add-mask::$TELEGRAM_TOKEN"
        if [[ "$ENDPOINT" != "https://xtelegram-cf.migos.club/notifications/send" ]]; then
          echo "::error::Unexpected Telegram relay endpoint; refusing to send"
          exit 1
        fi
        if [[ -n "$CHAT" && ! "$CHAT" =~ ^(-?[0-9]+(:[1-9][0-9]*)?|@[A-Za-z0-9_]{1,64})$ ]]; then
          echo "::error::Invalid Telegram chat destination"
          exit 1
        fi

        jq -n \
          --arg action "$ACTION" \
          --arg workflow "$WORKFLOW_LABEL" \
          --arg job "$JOB_LABEL" \
          --arg step "$STEP_LABEL" \
          --arg label "$PHASE_LABEL" \
          --arg outcome "$STEP_OUTCOME" \
          --arg completed "$NOTIFY_COMPLETED" \
          --arg total "$NOTIFY_TOTAL" \
          --arg url "$RUN_URL" \
          --arg run_id "$RUN_ID" \
          --arg run_attempt "$RUN_ATTEMPT" \
          --arg repository "$REPOSITORY" \
          --arg chat "$CHAT" \
          '
          def clean:
            gsub("^\\s+|\\s+$"; "");

          ($action | clean | ascii_downcase) as $action |
          ($outcome | clean | ascii_downcase) as $outcome |
          ($workflow | clean) as $workflow |
          ($job | clean) as $job |
          ($step | clean) as $step |
          ($label | clean) as $label |
          ($completed | tonumber? // 0) as $completed |
          ($total | tonumber? // 1) as $total |

          (
            if $action == "start" then
              "🚀 Execução iniciada"
            elif $action == "step" then
              if $outcome == "success" then
                "✅ Etapa concluída"
              elif $outcome == "failure" then
                "❌ Etapa falhou"
              elif $outcome == "cancelled" then
                "🚫 Etapa cancelada"
              elif $outcome == "skipped" then
                "⏭️ Etapa ignorada"
              else
                "⏳ Etapa em andamento"
              end
            elif $action == "end" then
              if $outcome == "success" then
                "✅ Execução concluída"
              elif $outcome == "failure" then
                "❌ Execução falhou"
              elif $outcome == "cancelled" then
                "🚫 Execução cancelada"
              else
                "🏁 Execução encerrada"
              end
            else
              "🔔 Atualização de execução"
            end
          ) as $title |

          (
            [
              $title,

              (
                if $workflow != "" then
                  "⚙️ " + $workflow
                else
                  empty
                end
              ),

              (
                if $job != "" and $job != $workflow then
                  "🧩 " + $job
                else
                  empty
                end
              ),

              (
                if $action == "step" then
                  if $label != "" then
                    "📍 " + $label
                  elif $step != "" then
                    "📍 " + $step
                  else
                    empty
                  end
                else
                  empty
                end
              ),

              (
                if $action == "step"
                   and $completed > 0
                   and $total > 1
                   and $completed <= $total then
                  "📊 Progresso: \($completed)/\($total)"
                else
                  empty
                end
              )
            ]
            | join("\n")
          ) as $body |

          (
            ($run_attempt | tonumber? // 1) * 100000 +
            (if $action == "start" then 2
             elif $action == "end" then 99998
             else 100 + (if $completed > 0 then $completed else 0 end)
             end)
          ) as $sequence |

          ({
            body: $body,
            notification_key: ("workflow:" + $repository + ":" + $run_id),
            sequence: $sequence,
            buttons: [
              [
                {
                  text: "🔎 Abrir execução",
                  url: $url
                }
              ]
            ]
          } + (if $chat != "" then {chat_id: $chat} else {} end))
          ' |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            -X POST \
            "$ENDPOINT" \
            -H "Authorization: Bearer $TELEGRAM_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @-
