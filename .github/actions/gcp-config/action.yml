name: "🧩 [GCP CONFIG] Prepare / clean"
description: "Reuse the production Environment GCP_CONFIG_ENV parser and securely remove temporary deployment files."
inputs:
  target:
    description: "Configuration consumer: cloudflare or cloud-run"
    required: false
    default: cloud-run
  engine:
    description: "Configuration engine: legacy Python or TypeScript (opt-in during parity migration)"
    required: false
    default: python
  github-secrets-json:
    description: "Explicit allowlisted GitHub secrets JSON; never use for job outputs or logs"
    required: false
  github-vars-json:
    description: "Explicit allowlisted GitHub variables JSON"
    required: false
  mode:
    description: "prepare or cleanup"
    required: true
  config-env:
    description: "Non-secret JSON or dotenv configuration from vars.GCP_CONFIG_ENV in the selected GitHub Environment"
    required: false
  confirm-project:
    description: "Exact project ID approved by the caller"
    required: false
  release-sha:
    description: "Full SHA of the checked-out Git commit"
    required: false
outputs:
  workload_identity_provider:
    description: "Provider resource from the validated configuration (deployment identity)"
    value: ${{ steps.prepare_ts.outputs.workload_identity_provider || steps.prepare.outputs.workload_identity_provider }}
  service_account:
    description: "Service account from the validated configuration (deployment identity)"
    value: ${{ steps.prepare_ts.outputs.service_account || steps.prepare.outputs.service_account }}
  bootstrap_workload_identity_provider:
    description: "Separate administrative Workload Identity provider from GCP_CONFIG_ENV"
    value: ${{ steps.prepare_ts.outputs.bootstrap_workload_identity_provider || steps.prepare.outputs.bootstrap_workload_identity_provider }}
  bootstrap_service_account:
    description: "Separate administrative service account from GCP_CONFIG_ENV"
    value: ${{ steps.prepare_ts.outputs.bootstrap_service_account || steps.prepare.outputs.bootstrap_service_account }}
runs:
  using: composite
  steps:
    - name: "🛡️ [GUARD] Validate action mode"
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        ENGINE: ${{ inputs.engine }}
        TARGET: ${{ inputs.target }}
      run: |
        case "$TARGET" in
          cloudflare|cloud-run) ;;
          *) echo "::error::Unsupported configuration target" >&2; exit 2 ;;
        esac
        case "$ENGINE" in
          python|typescript) ;;
          *) echo "::error::Unsupported configuration engine" >&2; exit 2 ;;
        esac
        case "$MODE" in
          prepare|cleanup) ;;
          *) echo "::error::Unsupported gcp-config action mode: $MODE" >&2; exit 2 ;;
        esac
    - name: "🟣 [CONFIG] Node.js TypeScript runtime"
      if: inputs.mode == 'prepare'
      uses: actions/setup-node@v4
      with:
        node-version: "24"
    - name: "🧩 [CONFIG] Validate shared TypeScript contract"
      if: inputs.mode == 'prepare' && inputs.engine == 'typescript'
      shell: bash
      env:
        GCP_CONFIG_ENV: ${{ inputs.config-env }}
      run: |
        set -euo pipefail
        node --experimental-strip-types packages/env/src/deploy.ts diagnose > "$RUNNER_TEMP/photointel-env-diagnostic.json"
        {
          echo "### 🧩 ENV · Contract diagnostics"
          echo
          echo "| Check | Result |"
          echo "|:--|:--|"
          echo "| Engine | \`\${{ inputs.engine }}\` |"
          echo "| VM catalog | $(jq -r 'if .terminalPresent then "Present" else "Not configured" end' "$RUNNER_TEMP/photointel-env-diagnostic.json") |"
          echo "| VM validation | $(jq -r 'if .terminalValid then "✅ Valid" elif .terminalPresent then "❌ Invalid" else "➖ Not configured" end' "$RUNNER_TEMP/photointel-env-diagnostic.json") |"
          echo "| Terminal gateway | $(jq -r 'if .gatewayPresent then "Configured" else "Not configured" end' "$RUNNER_TEMP/photointel-env-diagnostic.json") |"
          echo "| Runtime keys | $(jq -r '.runtimeKeys | length' "$RUNNER_TEMP/photointel-env-diagnostic.json") |"
          echo
          echo "<details><summary>🔎 Runtime key names (no values)</summary>"
          echo
          jq -r '.runtimeKeys[] | "- \`" + . + "\`"' "$RUNNER_TEMP/photointel-env-diagnostic.json"
          echo
          echo "</details>"
          if jq -e '.terminalError != ""' "$RUNNER_TEMP/photointel-env-diagnostic.json" >/dev/null; then
            echo
            echo "#### ❌ Terminal validation error"
            jq -r '.terminalError' "$RUNNER_TEMP/photointel-env-diagnostic.json"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
    - name: "📦 [CONFIG] Install dotenv parser"
      if: inputs.mode == 'prepare' && inputs.engine == 'python'
      shell: bash
      run: python3 -m pip install --disable-pip-version-check python-dotenv==1.2.4
    - name: "🧩 [CONFIG] Prepare env vars and render deploy"
      id: prepare
      if: inputs.mode == 'prepare' && inputs.engine == 'python'
      shell: bash
      env:
        GCP_CONFIG_ENV: ${{ inputs.config-env }}
        CONFIRM_PROJECT: ${{ inputs.confirm-project }}
        RELEASE_SHA: ${{ inputs.release-sha }}
      run: |
        set -euo pipefail
        python3 -m infra.gcp.gcp_env
        python3 -m infra.gcp.manage render
    - name: "🟣 [CONFIG] Prepare with TypeScript (no legacy Python parser)"
      id: prepare_ts
      if: inputs.mode == 'prepare' && inputs.engine == 'typescript'
      shell: bash
      env:
        GCP_CONFIG_ENV: ${{ inputs.config-env }}
        CONFIRM_PROJECT: ${{ inputs.confirm-project }}
        RELEASE_SHA: ${{ inputs.release-sha }}
        CONFIG_TARGET: ${{ inputs.target }}
        PHOTOINTEL_GITHUB_SECRETS_JSON: ${{ inputs.github-secrets-json }}
        PHOTOINTEL_GITHUB_VARS_JSON: ${{ inputs.github-vars-json }}
      run: |
        set -euo pipefail
        umask 077
        node --experimental-strip-types packages/env/src/deploy.ts render-config infra/gcp/config.local.json
        # Cloudflare adapters consume config.local.json directly.
        if [[ "$CONFIG_TARGET" == cloud-run ]]; then
          python3 -m infra.gcp.manage render
        fi
        node --input-type=module -e '
          import {appendFileSync} from "node:fs";
          import {parseEnvironment} from "./packages/env/src/index.ts";
          import {validateWorkloadIdentity} from "./packages/env/src/deploy.ts";
          const raw = process.env.GCP_CONFIG_ENV;
          const entries = raw.trimStart().startsWith("{")
            ? JSON.parse(raw) : parseEnvironment(raw).entries;
          const identity = validateWorkloadIdentity(entries);
          const output = [
            ["workload_identity_provider", identity.provider],
            ["service_account", identity.serviceAccount],
            ["bootstrap_workload_identity_provider", identity.bootstrapProvider ?? ""],
            ["bootstrap_service_account", identity.bootstrapServiceAccount ?? ""],
          ].map(([key, value]) => key + "=" + value).join("\n") + "\n";
          appendFileSync(process.env.GITHUB_OUTPUT, output);
        '
        echo "### 🟣 TypeScript ENV engine" >> "$GITHUB_STEP_SUMMARY"
        echo "GitHub-first configuration rendered without running the Python ENV parser." >> "$GITHUB_STEP_SUMMARY"
    - name: "🔬 [CONFIG] Compare TypeScript and legacy rendered bindings"
      if: inputs.mode == 'prepare' && inputs.engine == 'python'
      continue-on-error: true
      shell: bash
      env:
        GCP_CONFIG_ENV: ${{ inputs.config-env }}
      run: |
        set -euo pipefail
        if [[ ! -f infra/gcp/config.local.json ]]; then
          echo "::warning::Rendered configuration unavailable for contract comparison"
          exit 0
        fi
        set +e
        node --experimental-strip-types packages/env/src/deploy.ts compare infra/gcp/config.local.json > "$RUNNER_TEMP/photointel-env-compare.json"
        compare_status=$?
        set -e
        {
          echo "### 🔬 TypeScript ↔ legacy runtime parity"
          echo "- Matching: $(jq -r '.matching' "$RUNNER_TEMP/photointel-env-compare.json")"
          echo "- Missing keys: $(jq -r '.missing | length' "$RUNNER_TEMP/photointel-env-compare.json")"
          echo "- Extra keys: $(jq -r '.extra | length' "$RUNNER_TEMP/photointel-env-compare.json")"
          echo "- Differing values: $(jq -r '.mismatched | length' "$RUNNER_TEMP/photointel-env-compare.json")"
        } >> "$GITHUB_STEP_SUMMARY"
        if [[ "$compare_status" -ne 0 ]]; then
          echo "::warning::TypeScript and legacy bindings differ; inspect the parity counts above."
        fi
    - name: "🧹 [CLEANUP] Remove config and generated"
      if: inputs.mode == 'cleanup'
      shell: bash
      run: |
        set -euo pipefail
        rm -f infra/gcp/config.local.json
        rm -rf infra/gcp/rendered
