name: "🔮 RV · Cloud Run renderer parity"
on:
  pull_request:
    paths:
      - 'scripts/ci/cloud-run/**'
      - 'infra/gcp/manage.py'
      - '.github/workflows/cloud-run-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Compare offline manifests
        run: PYTHONPATH=. python scripts/ci/cloud-run/parity.py
