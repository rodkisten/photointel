name: "🍎 iCloud Validation"
on:
  push:
    branches: [main]
    paths:
      - 'infra/scripts/icloud_terminal.py'
      - 'infra/gcp/icloud_preflight.py'
      - 'infra/gcp/tests/test_icloud_setup.py'
      - 'apps/api/src/photointel/services/icloud_admin.py'
      - 'apps/api/src/photointel/services/runtime_settings.py'
      - '.github/workflows/icloud-validation.yml'
      - 'infra/terminal/**'
      - 'infra/gcp/icloud_*'
      - 'apps/api/src/photointel/services/icloud_*'
      - '.github/workflows/icloud-setup.yml'
  pull_request:
    paths:
      - 'infra/scripts/icloud_terminal.py'
      - 'infra/gcp/icloud_preflight.py'
      - 'infra/gcp/tests/test_icloud_setup.py'
      - 'apps/api/src/photointel/services/icloud_admin.py'
      - 'apps/api/src/photointel/services/runtime_settings.py'
      - '.github/workflows/icloud-validation.yml'
      - 'infra/terminal/**'
      - 'infra/gcp/icloud_*'
      - 'apps/api/src/photointel/services/icloud_*'
      - '.github/workflows/icloud-setup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "Unit contracts without credentials"
        run: python3 -m unittest discover -s infra/gcp/tests -p test_icloud_setup.py -v
      # The legacy terminal-only installer downloads a mutable, unversioned
      # upstream archive; its pinned hash can change without any code change.
      # Test that network installation only when explicitly dispatched, not
      # during browser-based Apple authentication pull requests.
      - name: "Verify official gcloud archive and isolated Linux installation"
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PY'
          import importlib.util
          import subprocess
          import tempfile
          from pathlib import Path
          from unittest.mock import patch
          spec = importlib.util.spec_from_file_location("icloud_terminal", "infra/scripts/icloud_terminal.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with tempfile.TemporaryDirectory() as temporary:
              with patch.object(module.shutil, "which", return_value=None), patch.object(
                  module.Path, "home", return_value=Path(temporary)
              ), patch.object(module, "_known_sdk_binaries", return_value=()):

                  executable = module.ensure_gcloud()
              result = subprocess.run([executable, "--version"], capture_output=True, text=True, check=True)
              assert module.SDK_VERSION in result.stdout
          print("Official SDK checksum, safe extraction and executable verified; no credentials used.")
          PY
