name: "🔮 RV · 🎞️ Media · CI"
on:
  pull_request:
    paths:
      - "apps/media/**"
      - ".github/workflows/media-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/media/**"
      - ".github/workflows/media-ci.yml"
permissions:
  contents: read
concurrency:
  group: media-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: rodkisten/github/setup-node@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          node-version: '26'
          install: 'false'
          cache: 'false'
      - name: Run all checks and summarize failures
        shell: bash
        run: bash apps/media/ci/check-all.sh
