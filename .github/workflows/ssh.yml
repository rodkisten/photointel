name: "🖥️ SSH"
run-name: "🖥️ SSH · ${{ inputs.command || 'offline-check' }}${{ inputs.command == 'ssh' && format(' · {0} min', inputs.session_minutes) || '' }}"

on:
  push:
    branches: [main]
    paths:
      - 'scripts/commit-session.sh'
      - 'infra/scripts/prepare_workflow_env.py'
      - 'Makefile'
      - '.github/actions/gcp-config/**'
      - '.github/workflows/ssh.yml'
  workflow_dispatch:
    inputs:
      command:
        description: "Make target to run, or ssh for an interactive session"
        required: true
        type: choice
        default: ssh
        options:
          - ssh
          - help
          - setup
          - info
          - check
          - dev
          - stop
          - migrate
          - seed
          - lint
          - typecheck
          - test
          - test-integration
          - test-e2e
          - build
          - doctor
          - ingest-test
          - gpu-test
          - backup
          - restore-test
          - benchmark
          - export
          - cleanup
      session_minutes:
        description: "Maximum SSH session duration (only for ssh)"
        required: true
        type: choice
        default: "60"
        options:
          - "30"
          - "60"
          - "120"
          - "180"

# Required by the Auto Commit & Push step.
permissions:
  contents: write

concurrency:
  group: photointel-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push-check:
    name: "🧪 SSH scripts (offline)"
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          bash -n scripts/commit-session.sh
          make -n help > /dev/null
  development:
    name: "🖥️ Session"
    # Interactive SSH has access to production WIF; restrict to trusted main.
    if: github.event_name == 'workflow_dispatch' && (inputs.command != 'ssh' || github.ref == 'refs/heads/main')
    environment: ${{ inputs.command == 'ssh' && 'production' || 'development' }}
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    # Longest interactive session is 180 min; reserve time for setup and push.
    timeout-minutes: 240

    defaults:
      run:
        shell: bash

    steps:
      - name: "📥 Código"
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: "⚙ GCP Config"
        id: config
        if: ${{ inputs.command == 'ssh' }}
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: photointel
          release-sha: ${{ github.sha }}

      - name: "🔐 GCP Login"
        if: ${{ inputs.command == 'ssh' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.service_account }}

      - name: "🧰 Gcloud"
        if: ${{ inputs.command == 'ssh' }}
        uses: google-github-actions/setup-gcloud@v3

      - name: "⚙ Env"
        id: ssh_env
        if: ${{ inputs.command == 'ssh' }}
        env:
          CONFIRM_PROJECT: photointel
        run: python3 -m infra.scripts.prepare_workflow_env ssh

      - name: "🧰 Setup"
        id: notify_observed_001
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: "🧰 Setup"
        id: notify_observed_002
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-local-path: /tmp/photointel-uv-cache
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
          ignore-nothing-to-cache: true

      - name: "🧰 Setup"
        id: notify_observed_003
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # Its automatic cache looks for a root lockfile. Our lockfile is in apps/web.
          package-manager-cache: false

      - name: "🧰 Setup"
        id: notify_observed_004
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        uses: actions/cache@v4
        with:
          path: /tmp/photointel-npm-cache
          key: ${{ runner.os }}-node24-photointel-npm-${{ hashFiles('apps/web/package-lock.json', 'apps/web/npm-shrinkwrap.json', 'apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-photointel-npm-

      - name: "🧰 Setup"
        id: notify_observed_005
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            make git curl jq wget unzip tmux htop ripgrep

          # SSH login does not inherit the PATH created by setup-uv/setup-node.
          # Publish the installed toolchain to a common interactive-shell PATH.
          for executable in uv python python3 node npm npx; do
            installed_path="$(command -v "$executable")"
            if [[ -n "$installed_path" && "$installed_path" != "/usr/local/bin/$executable" ]]; then
              sudo ln -sfn "$installed_path" "/usr/local/bin/$executable"
            fi
          done
          make --version | head -n 1
          uv --version
          node --version
          npm --version

      - name: "⚙ ️  Initialize session marker"
        id: notify_observed_006
        if: ${{ inputs.command == 'ssh' }}
        run: rm -f -- "$(git rev-parse --git-path dev-ssh-finish)"

      - name: "🧰 Setup"
        id: notify_observed_007
        if: ${{ inputs.command != 'setup' && inputs.command != 'help' && inputs.command != 'info' && inputs.command != 'stop' && inputs.command != 'cleanup' }}
        # SSH is a recovery shell too: allow login even if project installation fails.
        # Non-interactive Make commands continue to fail fast when setup fails.
        continue-on-error: ${{ inputs.command == 'ssh' }}
        run: make setup

      - name: "⚙ ️  Run Make command"
        id: notify_observed_008
        if: ${{ inputs.command != 'ssh' }}
        env:
          MAKE_TARGET: ${{ inputs.command }}
        run: make "$MAKE_TARGET"

      - name: "🔐 Login"
        id: notify_observed_010
        if: ${{ inputs.command == 'ssh' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ steps.ssh_env.outputs.ts_client_id }}
          oauth-secret: ${{ steps.ssh_env.outputs.ts_oauth_secret }}
          tags: tag:ci

      - name: "🔐 Login"
        if: ${{ inputs.command == 'ssh' }}
        id: ssh
        run: |
          sudo tailscale set --ssh
          ip="$(tailscale ip -4 | head -n 1)"
          if [[ -z "$ip" ]]; then
            echo '::error::Tailscale did not provide an IPv4 address'
            exit 1
          fi
          echo ''
          echo '========================================='
          echo 'CONNECT FROM IPHONE WITH TAILSCALE ENABLED:'
          echo "ssh runner@$ip"
          echo '========================================='
          echo ''
          echo "Repository: $GITHUB_WORKSPACE"
          echo 'Quick start: cd ~/photointel && make help'
          echo 'To save and finish: make finish'
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/photointel"

      - name: "🔐 Login"
        id: notify_observed_011
        if: ${{ inputs.command == 'ssh' }}
        env:
          SESSION_MINUTES: ${{ inputs.session_minutes }}
        run: make keepalive

      # IMPORTANT: immediately after SSH. Preserve it in this position.
      - name: "🚀 Deploy"
        id: notify_observed_012
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.ssh.outcome == 'success' }}
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash scripts/commit-session.sh

      - name: "🧹 GCP Config"
        if: ${{ always() && steps.checkout.outcome == 'success' && inputs.command == 'ssh' }}
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup

