name: "📦 iCloud Web Login · Dispatch Production API Release"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-icloud-web-login-release.yml"
permissions:
  contents: read
  actions: write
jobs:
  dispatch-release:
    if: github.event.head_commit.message == 'ci: trigger production API release for browser Apple login'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: "🚀 Dispatch existing audited GCP production release workflow"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api -X POST "repos/$GH_REPO/actions/workflows/gcp-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[action]=release' \
            -f 'inputs[migration_mode]=plan' \
            -f 'inputs[migration_database]=unselected'
          echo "Dispatched the existing GCP release. No migrations were applied."
