name: "TF · Production"
run-name: "TF · ${{ inputs.action }} · ${{ inputs.scope || 'gcp' }} · ${{ inputs.request_id || 'manual' }}"
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Inspect the live state or apply a reviewed plan"
        type: choice
        required: true
        default: plan
        options: [plan, import, apply]
      scope:
        description: "Infrastructure state to plan/apply"
        type: choice
        options: [gcp, cloudflare]
        default: gcp
      runtime_targets:
        description: "Runtime env subset; images and unselected settings are preserved"
        type: string
        default: api,jobs
      api_sha:
        description: "Optional published API source SHA; blank keeps each current image"
        type: string
        default: ''
      image_sha:
        description: "Published media source SHA; blank preserves the release in Terraform state"
        type: string
        default: ''
      request_id:
        description: "Optional correlation ID from the media workflow"
        type: string
        default: ''
      expected_sha:
        description: "Optional caller commit; refuse a concurrent main change"
        type: string
        default: ''
      plan_run_id:
        description: "Required for apply: run ID of the reviewed plan"
        type: string
        default: ''
      authorize_apply:
        description: "Authorize infrastructure changes after reviewing the plan"
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: photointel-terraform-production
  cancel-in-progress: false
jobs:
  terraform:
    if: github.ref == 'refs/heads/main' && (inputs.scope == 'gcp' || inputs.scope == '')
    runs-on: ubuntu-latest
    environment: production
    env:
      # Shared confirmation guard for scripts that read config.local.json.
      CONFIRM_PROJECT: photointel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "TF · Check caller revision"
        env:
          EXPECTED: ${{ inputs.expected_sha }}
          CURRENT: ${{ github.sha }}
        run: |
          if [[ -n "$EXPECTED" && "$EXPECTED" != "$CURRENT" ]]; then
            echo '::error::main changed after the media workflow started; start a new run.'
            exit 1
          fi
      - name: "TF · Prepare production configuration"
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: photointel
          release-sha: ${{ github.sha }}
      - name: "TF · Authenticate dedicated Terraform identity"
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/799387180206/locations/global/workloadIdentityPools/github-bootstrap/providers/photo-intelligence-bootstrap
          service_account: photointel-terraform@photointel.iam.gserviceaccount.com
          project_id: photointel
      - uses: google-github-actions/setup-gcloud@v3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - name: "TF · Init"
        working-directory: infra/terraform/environments/production
        env:
          BUCKET: ${{ vars.TF_STATE_BUCKET || 'photointel-terraform-state' }}
          PREFIX: ${{ vars.TF_STATE_PREFIX || 'photointel/production' }}
        run: terraform init -input=false -backend-config="bucket=$BUCKET" -backend-config="prefix=$PREFIX"
      - name: "TF · Inventory and prepare media adoption"
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          set -euo pipefail
          bucket="$(python3 -c 'import json; print(json.load(open("infra/gcp/config.local.json"))["storage_bucket"])')"
          python3 -m infra.terraform.media_release prepare --image-sha "$IMAGE_SHA" --bucket "$bucket"
      - name: "TF · Inventory API and processing Jobs"
        env:
          API_SHA: ${{ inputs.api_sha }}
          RUNTIME_TARGETS: ${{ inputs.runtime_targets || 'api,jobs' }}
        run: |
          python3 -m infra.scripts.cloudflare_setup sync
          python3 -m infra.terraform.api_release prepare --image-sha "$API_SHA" --targets "$RUNTIME_TARGETS"
      - name: "TF · Import existing resources"
        if: inputs.action == 'import'
        working-directory: infra/terraform/environments/production
        shell: bash
        run: bash ../../import-existing.sh
      - name: "TF · Verify required imports before apply"
        if: inputs.action == 'apply'
        working-directory: infra/terraform/environments/production
        shell: bash
        run: |
          set -euo pipefail
          for address in 'google_artifact_registry_repository.docker' 'google_storage_bucket.build_source'; do
            terraform state show "$address" >/dev/null 2>&1 || {
              echo "::error::Missing $address in remote state. Run TF · Production with action=import first."
              exit 1
            }
          done
      - name: "TF · Require apply confirmation"
        if: inputs.action == 'apply'
        env:
          APPROVED: ${{ inputs.authorize_apply }}
        run: test "$APPROVED" = true || { echo '::error::Apply checkbox required'; exit 1; }
      - name: "TF · Plan"
        if: inputs.action == 'plan'
        working-directory: infra/terraform/environments/production
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan -no-color
      - name: "TF · Restore reviewed plan"
        if: inputs.action == 'apply'
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          TF_SCOPE: gcp
          TF_PLAN_BUCKET: ${{ vars.TF_STATE_BUCKET || 'photointel-terraform-state' }}
          TF_RUNTIME_TARGETS: ${{ inputs.runtime_targets || 'api,jobs' }}
          TF_API_SHA: ${{ inputs.api_sha }}
          TF_IMAGE_SHA: ${{ inputs.image_sha }}
        run: python3 -m infra.terraform.saved_plan restore
      - name: "TF · Review plan and block destruction or replacement"
        if: inputs.action != 'import'
        run: python3 -m infra.terraform.media_release review
      - name: "TF · Save reviewed plan"
        if: inputs.action == 'plan'
        env:
          TF_SCOPE: gcp
          TF_PLAN_BUCKET: ${{ vars.TF_STATE_BUCKET || 'photointel-terraform-state' }}
          TF_RUNTIME_TARGETS: ${{ inputs.runtime_targets || 'api,jobs' }}
          TF_API_SHA: ${{ inputs.api_sha }}
          TF_IMAGE_SHA: ${{ inputs.image_sha }}
        run: python3 -m infra.terraform.saved_plan save
      - name: "TF · Apply"
        if: inputs.action == 'apply' && inputs.authorize_apply
        working-directory: infra/terraform/environments/production
        run: terraform apply -input=false tfplan
      - name: "TF · Verify both media Jobs"
        if: inputs.action == 'apply' && inputs.authorize_apply
        run: python3 -m infra.terraform.media_release verify
      - name: "TF · Verify API and processing Jobs"
        if: inputs.action == 'apply' && inputs.authorize_apply
        run: python3 -m infra.terraform.api_release verify
      - name: "TF · Clean temporary configuration"
        if: always()
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup

  cloudflare:
    if: github.ref == 'refs/heads/main' && inputs.scope == 'cloudflare'
    runs-on: ubuntu-latest
    environment: production
    env:
      # Shared confirmation guard for scripts that read config.local.json.
      CONFIRM_PROJECT: photointel
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: "TF · Check caller revision"
        env:
          EXPECTED: ${{ inputs.expected_sha }}
          CURRENT: ${{ github.sha }}
        run: |
          if [[ -n "$EXPECTED" && "$EXPECTED" != "$CURRENT" ]]; then
            echo '::error::main changed after dispatch; start a new run.'
            exit 1
          fi
      - name: "TF · Prepare production configuration"
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: photointel
          release-sha: ${{ github.sha }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/799387180206/locations/global/workloadIdentityPools/github-bootstrap/providers/photo-intelligence-bootstrap
          service_account: photointel-terraform@photointel.iam.gserviceaccount.com
          project_id: photointel
      - uses: google-github-actions/setup-gcloud@v3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - name: "TF · Init isolated Cloudflare state"
        working-directory: infra/terraform/environments/cloudflare
        env:
          BUCKET: ${{ vars.TF_STATE_BUCKET || 'photointel-terraform-state' }}
          PREFIX: ${{ vars.TF_CF_STATE_PREFIX || 'photointel/cloudflare' }}
        run: terraform init -input=false -backend-config="bucket=$BUCKET" -backend-config="prefix=$PREFIX"
      - name: "TF · Inventory and prepare Cloudflare adoption"
        run: python3 -m infra.terraform.cloudflare_release prepare
      - name: "TF · Require apply confirmation"
        if: inputs.action == 'apply'
        env:
          APPROVED: ${{ inputs.authorize_apply }}
        run: test "$APPROVED" = true || { echo '::error::Apply checkbox required'; exit 1; }
      - name: "TF · Plan Cloudflare metadata only"
        if: inputs.action == 'plan'
        working-directory: infra/terraform/environments/cloudflare
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan -no-color
      - name: "TF · Restore reviewed Cloudflare plan"
        if: inputs.action == 'apply'
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          TF_SCOPE: cloudflare
          TF_PLAN_BUCKET: ${{ vars.TF_STATE_BUCKET || 'photointel-terraform-state' }}
        run: python3 -m infra.terraform.saved_plan restore
      - name: "TF · Review and block destruction/replacement"
        run: python3 -m infra.terraform.media_release review --root infra/terraform/environments/cloudflare
      - name: "TF · Save reviewed Cloudflare plan"
        if: inputs.action == 'plan'
        env:
          TF_SCOPE: cloudflare
          TF_PLAN_BUCKET: ${{ vars.TF_STATE_BUCKET || 'photointel-terraform-state' }}
        run: python3 -m infra.terraform.saved_plan save
      - name: "TF · Apply adopted Cloudflare infrastructure"
        if: inputs.action == 'apply' && inputs.authorize_apply
        working-directory: infra/terraform/environments/cloudflare
        run: terraform apply -input=false tfplan
      - name: "TF · Verify preserved domains, Access, D1 and R2"
        if: inputs.action == 'apply' && inputs.authorize_apply
        run: python3 -m infra.terraform.cloudflare_release verify
      - name: "TF · Clean temporary configuration"
        if: always()
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup
