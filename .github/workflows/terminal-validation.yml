name: "🧪 Terminal validation"
on:
  workflow_dispatch:
  pull_request:
    paths: ['infra/terminal/**', '.github/workflows/gcp-terminal.yml', '.github/workflows/terminal-validation.yml', '.github/actions/gcp-config/**']
  push:
    branches: [main]
    paths: ['infra/terminal/**', '.github/workflows/gcp-terminal.yml', '.github/workflows/terminal-validation.yml', '.github/actions/gcp-config/**']
permissions:
  contents: read
concurrency:
  # Cancel obsolete checks for the same PR/branch; manual dispatches are independent.
  group: terminal-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "🧪 Offline lifecycle and configuration tests"
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: |
            bash -n infra/terminal/startup.sh
            python3 -m unittest discover -s infra/terminal -p 'test_*.py' -v
      - name: "🐳 Build and verify CLI tools without production credentials"
        run: |
          docker build -t photointel-terminal-test infra/terminal
          docker run --rm --entrypoint bash photointel-terminal-test -ec '
            test "$(id -un)" = rod
            test "$(id -u)" = 1000
            test "$(id -g)" = 1000
            test -w /home/rod
            for tool in gcloud jq awk ssh sshd git tmux rsync python3 psql sqlite3 rg fzf; do
              command -v "$tool"
            done
            gcloud version
          '
