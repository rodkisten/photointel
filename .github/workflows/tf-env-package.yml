name: "TF · ENV package"
run-name: "TF · ENV parser · ${{ github.ref_name }}"
on:
  pull_request:
    paths:
      - "packages/env/**"
      - "apps/manage/src/env-preview.ts"
      - ".github/workflows/tf-env-package.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: "TF · Test shared ENV parser"
        run: node --experimental-strip-types --test packages/env/tests/*.test.mts
