name: "📱 [WEBKIT] Validate iPhone viewport"

on:
  push:
    branches: [validation/webkit]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webkit-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit:
    name: "📱 [WEBKIT] Browser validation"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: photointel
          POSTGRES_PASSWORD: ci-webkit-only
          POSTGRES_DB: photointel
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U photointel -d photointel"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      AUTH_MODE: local
      DATABASE_URL: postgresql+asyncpg://photointel:ci-webkit-only@127.0.0.1:5432/photointel
      STORAGE_BACKEND: s3
      STORAGE_ENDPOINT: http://127.0.0.1:9000
      STORAGE_BUCKET: photointel-webkit-private
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: ci-access
      STORAGE_SECRET_KEY: ci-only-not-a-production-secret
      TEMP_DIRECTORY: /tmp/photointel-webkit-processing
      ICLOUD_ENABLED: 'false'
      INFERENCE_BACKEND: test
      GPU_ENABLED: 'false'
      UV_CACHE_DIR: /tmp/photointel-webkit-uv-cache
      npm_config_cache: /tmp/photointel-webkit-npm-cache
      PHOTOINTEL_TEST_WEBKIT: '1'
    steps:
      - name: "⚙️ [SETUP] actions/checkout"
        id: notify_observed_001
        uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: "🔔 [NOTIFY] ⚙️ [SETUP] actions/checkout"
        if: ${{ always() && (steps.notify_observed_001.outcome == 'success' || steps.notify_observed_001.outcome == 'failure' || steps.notify_observed_001.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "⚙️ [SETUP] actions/checkout"
          outcome: ${{ steps.notify_observed_001.outcome }}
      - name: "⚙️ [SETUP] astral-sh/setup-uv"
        id: notify_observed_002
        uses: astral-sh/setup-uv@v6
        with: {version: '0.12.23', enable-cache: true}
      - name: "🔔 [NOTIFY] ⚙️ [SETUP] astral-sh/setup-uv"
        if: ${{ always() && (steps.notify_observed_002.outcome == 'success' || steps.notify_observed_002.outcome == 'failure' || steps.notify_observed_002.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "⚙️ [SETUP] astral-sh/setup-uv"
          outcome: ${{ steps.notify_observed_002.outcome }}
      - name: "⚙️ [SETUP] actions/setup-node"
        id: notify_observed_003
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: "🔔 [NOTIFY] ⚙️ [SETUP] actions/setup-node"
        if: ${{ always() && (steps.notify_observed_003.outcome == 'success' || steps.notify_observed_003.outcome == 'failure' || steps.notify_observed_003.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "⚙️ [SETUP] actions/setup-node"
          outcome: ${{ steps.notify_observed_003.outcome }}
      - name: "🧰 [SETUP] Install locked application dependencies without GPU dependencies"
        id: notify_observed_004
        run: |
          uv python install 3.12
          uv sync --frozen --group ingest
          npm --prefix apps/web ci
          mkdir -p reports
      - name: "🔔 [NOTIFY] 🧰 [SETUP] Install locked application dependencies without GPU dependencies"
        if: ${{ always() && (steps.notify_observed_004.outcome == 'success' || steps.notify_observed_004.outcome == 'failure' || steps.notify_observed_004.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧰 [SETUP] Install locked application dependencies without GPU dependencies"
          outcome: ${{ steps.notify_observed_004.outcome }}
      - name: "⚙️ [SETUP] docker/setup-buildx-action"
        id: notify_observed_005
        uses: docker/setup-buildx-action@v3
      - name: "🔔 [NOTIFY] ⚙️ [SETUP] docker/setup-buildx-action"
        if: ${{ always() && (steps.notify_observed_005.outcome == 'success' || steps.notify_observed_005.outcome == 'failure' || steps.notify_observed_005.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "⚙️ [SETUP] docker/setup-buildx-action"
          outcome: ${{ steps.notify_observed_005.outcome }}
      - name: "🧰 [SETUP] Build private test storage from pinned source using shared CI cache"
        id: notify_observed_006
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/minio.Dockerfile
          tags: photointel-minio:webkit
          load: true
          push: false
          cache-from: type=gha,scope=photointel-minio
          cache-to: type=gha,mode=max,scope=photointel-minio,ignore-error=true
      - name: "🔔 [NOTIFY] 🧰 [SETUP] Build private test storage from pinned source using shared CI cache"
        if: ${{ always() && (steps.notify_observed_006.outcome == 'success' || steps.notify_observed_006.outcome == 'failure' || steps.notify_observed_006.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧰 [SETUP] Build private test storage from pinned source using shared CI cache"
          outcome: ${{ steps.notify_observed_006.outcome }}
      - name: "⚙️ [RUN] Start private storage and initialize its bucket"
        id: notify_observed_007
        run: |
          docker run -d --name photointel-webkit-minio -p 127.0.0.1:9000:9000 -e MINIO_ROOT_USER=ci-access -e MINIO_ROOT_PASSWORD=ci-only-not-a-production-secret photointel-minio:webkit server /data
          uv run --no-sync python infra/scripts/init-private-bucket.py
      - name: "🔔 [NOTIFY] ⚙️ [RUN] Start private storage and initialize its bucket"
        if: ${{ always() && (steps.notify_observed_007.outcome == 'success' || steps.notify_observed_007.outcome == 'failure' || steps.notify_observed_007.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "⚙️ [RUN] Start private storage and initialize its bucket"
          outcome: ${{ steps.notify_observed_007.outcome }}
      - name: "⚙️ [RUN] Apply migrations and provision the limited runtime role"
        id: notify_observed_008
        run: |
          uv run --no-sync alembic -c infra/migrations/alembic.ini upgrade head
          docker exec -i "${{ job.services.postgres.id }}" psql --username=photointel --dbname=photointel --set=app_role=photointel_app --set=app_password=ci-webkit-app-only --set=database_name=photointel --set=ON_ERROR_STOP=1 < infra/oracle/provision-app-role.sql
      - name: "🔔 [NOTIFY] ⚙️ [RUN] Apply migrations and provision the limited runtime role"
        if: ${{ always() && (steps.notify_observed_008.outcome == 'success' || steps.notify_observed_008.outcome == 'failure' || steps.notify_observed_008.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "⚙️ [RUN] Apply migrations and provision the limited runtime role"
          outcome: ${{ steps.notify_observed_008.outcome }}
      - name: "🧰 [SETUP] Install pinned Chromium and WebKit browser builds"
        id: notify_observed_009
        run: npm exec --prefix apps/web -- playwright install --with-deps chromium webkit
      - name: "🔔 [NOTIFY] 🧰 [SETUP] Install pinned Chromium and WebKit browser builds"
        if: ${{ always() && (steps.notify_observed_009.outcome == 'success' || steps.notify_observed_009.outcome == 'failure' || steps.notify_observed_009.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧰 [SETUP] Install pinned Chromium and WebKit browser builds"
          outcome: ${{ steps.notify_observed_009.outcome }}
      - name: "⚙️ [RUN] Exercise all browser projects, including Linux WebKit with iPhone dimensions"
        id: notify_observed_010
        run: bash infra/scripts/run-e2e.sh
        env:
          DATABASE_URL: postgresql+asyncpg://photointel_app:ci-webkit-app-only@127.0.0.1:5432/photointel
          GPU_ENABLED: 'true'
          JOYTAG_MODEL_REVISION: '1111111111111111111111111111111111111111'
          SIGLIP_MODEL_REVISION: '2222222222222222222222222222222222222222'
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ../../reports/browser-webkit.xml
      - name: "🔔 [NOTIFY] ⚙️ [RUN] Exercise all browser projects, including Linux WebKit with iPhone dimensions"
        if: ${{ always() && (steps.notify_observed_010.outcome == 'success' || steps.notify_observed_010.outcome == 'failure' || steps.notify_observed_010.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "⚙️ [RUN] Exercise all browser projects, including Linux WebKit with iPhone dimensions"
          outcome: ${{ steps.notify_observed_010.outcome }}
      - name: "🧪 [TEST] Capture private test storage diagnostics"
        id: notify_observed_011
        if: failure()
        run: |
          mkdir -p reports
          docker logs photointel-webkit-minio > reports/minio-webkit.log 2>&1 || true
      - name: "🔔 [NOTIFY] 🧪 [TEST] Capture private test storage diagnostics"
        if: ${{ always() && (steps.notify_observed_011.outcome == 'success' || steps.notify_observed_011.outcome == 'failure' || steps.notify_observed_011.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧪 [TEST] Capture private test storage diagnostics"
          outcome: ${{ steps.notify_observed_011.outcome }}
      - name: "📦 [EVIDENCE] Upload controlled browser evidence"
        id: notify_observed_012
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-webkit-validation
          path: |
            reports/
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: warn
          retention-days: 7
      - name: "🔔 [NOTIFY] 📦 [EVIDENCE] Upload controlled browser evidence"
        if: ${{ always() && (steps.notify_observed_012.outcome == 'success' || steps.notify_observed_012.outcome == 'failure' || steps.notify_observed_012.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "📦 [EVIDENCE] Upload controlled browser evidence"
          outcome: ${{ steps.notify_observed_012.outcome }}
      - name: "🧪 [TEST] Record the scope of browser validation"
        id: notify_observed_013
        if: always()
        run: |
          printf '%s\n' 'This workflow runs Playwright WebKit on Linux with an iPhone 13 viewport and synthetic photos. It does not test Safari on an actual iPhone, PhotoKit, or PWA installation on iOS. Inference uses explicit test fixtures; no GPU provider is called.' >> "$GITHUB_STEP_SUMMARY"

      - name: "🔔 [NOTIFY] 🧪 [TEST] Record the scope of browser validation"
        if: ${{ always() && (steps.notify_observed_013.outcome == 'success' || steps.notify_observed_013.outcome == 'failure' || steps.notify_observed_013.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧪 [TEST] Record the scope of browser validation"
          outcome: ${{ steps.notify_observed_013.outcome }}