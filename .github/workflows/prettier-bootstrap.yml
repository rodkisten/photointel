name: "🎨 Prettier · First pass"
run-name: "🎨 Format web + manage + Workers · ${{ github.sha }}"
on:
  push:
    branches:
      - feat/shared-prettier-frontends
    paths:
      - package.json
      - .prettierrc.json
      - .prettierignore
      - .github/workflows/prettier-bootstrap.yml
permissions:
  contents: write
concurrency:
  group: prettier-bootstrap-frontends
  cancel-in-progress: false
jobs:
  format:
    name: "🎨 Install Prettier, format sources, commit result"
    if: github.repository == 'rodkisten/photointel'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "📥 Checkout formatting branch"
        uses: actions/checkout@v4
        with:
          ref: feat/shared-prettier-frontends
          persist-credentials: true
      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "📦 Install shared Prettier and lock version"
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: "🎨 Format frontends, CSS and Workers"
        run: npm run format
      - name: "🧪 Formatting is idempotent"
        run: npm run format:check
      - name: "💾 Commit only formatted source + shared dependency lockfile"
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json apps/web apps/manage infra/cloudflare/cloud-run-proxy
          if ! git diff --cached --quiet; then
            git commit -m "style: apply shared Prettier to both frontends, Workers and CSS"
            git push origin HEAD:refs/heads/feat/shared-prettier-frontends
          else
            echo "Already formatted"
          fi
