name: "🧱 Setup GCP"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan only or reconcile infrastructure using gcloud"
        type: choice
        required: true
        default: plan
        options: [plan, apply]
      authorize_charges:
        description: "I approve Google Cloud resource changes and potential charges"
        type: boolean
        required: true
        default: false
      confirm_project:
        description: "Type the exact GCP project ID"
        type: string
        required: true
        default: photointel

permissions:
  contents: read

concurrency:
  group: photointel-gcp-production
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'plan' || inputs.authorize_charges == true)
    name: "🧱 ${{ inputs.mode }}"
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: "📥 Código"
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "📱 Live · Início"
        id: notify_live_start
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: start
          total: "1"
          github-token: ${{ github.token }}
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
      - name: "⚙ Env"
        id: config
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: ${{ inputs.confirm_project }}
          release-sha: ${{ github.sha }}

      - name: "📱 ! ⚙ Env"
        if: ${{ always() && (steps.config.outcome == 'failure' || steps.config.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "⚙ Env"
          step-index: "3"
          label: "⚙ Env"
          outcome: ${{ steps.config.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: "1"
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "🧪 Bootstrap"
        id: notify_observed_001
        run: bash -n infra/gcp/bootstrap.sh

      - name: "🧪 Login"
        id: notify_observed_002
        if: inputs.mode == 'apply'
        env:
          WIF: ${{ steps.config.outputs.bootstrap_workload_identity_provider }}
          BOOTSTRAP_ACCOUNT: ${{ steps.config.outputs.bootstrap_service_account }}
          PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          test "$PROJECT" = photointel || { echo "::error::Unexpected target project"; exit 1; }
          test "$BOOTSTRAP_ACCOUNT" = "photointel-bootstrap@$PROJECT.iam.gserviceaccount.com" || { echo "::error::Dedicated bootstrap account is not configured"; exit 1; }
          test "$WIF" = "projects/799387180206/locations/global/workloadIdentityPools/github-bootstrap/providers/photo-intelligence-bootstrap" || { echo "::error::Bootstrap provider must be separate from deploy provider"; exit 1; }

      - name: "📱 ! 🧪 Login"
        if: ${{ always() && (steps.notify_observed_002.outcome == 'failure' || steps.notify_observed_002.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧪 Login"
          step-index: "6"
          label: "🧪 Login"
          outcome: ${{ steps.notify_observed_002.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: "1"
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "🔐 Login"
        id: notify_observed_003
        if: inputs.mode == 'apply'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ inputs.confirm_project }}
          workload_identity_provider: ${{ steps.config.outputs.bootstrap_workload_identity_provider }}
          service_account: ${{ steps.config.outputs.bootstrap_service_account }}

      - name: "📱 ! 🔐 Login"
        if: ${{ always() && (steps.notify_observed_003.outcome == 'failure' || steps.notify_observed_003.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🔐 Login"
          step-index: "8"
          label: "🔐 Login"
          outcome: ${{ steps.notify_observed_003.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: "1"
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "🧰 Gcloud"
        id: notify_observed_004
        if: inputs.mode == 'apply'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ inputs.confirm_project }}
          version: '>= 500.0.0'

      - name: "📱 ! 🧰 Gcloud"
        if: ${{ always() && (steps.notify_observed_004.outcome == 'failure' || steps.notify_observed_004.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧰 Gcloud"
          step-index: "10"
          label: "🧰 Gcloud"
          outcome: ${{ steps.notify_observed_004.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: "1"
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "📱 ▶ Setup"
        if: ${{ always() && steps.notify_observed_004.outcome != 'failure' && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧱 Provisionar"
          step-index: "13"
          label: "🧱 Setup"
          outcome: running
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: "1"
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "🧱 Provisionar"
        id: notify_observed_005
        env:
          BOOTSTRAP_MODE: ${{ inputs.mode }}
          AUTHORIZE_CHARGES: ${{ inputs.authorize_charges }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          bash infra/gcp/bootstrap.sh

      - name: "📱 ✓ Setup"
        if: ${{ always() && (steps.notify_observed_005.outcome == 'success' || steps.notify_observed_005.outcome == 'failure' || steps.notify_observed_005.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧱 Provisionar"
          step-index: "13"
          label: "🧱 Setup"
          outcome: ${{ steps.notify_observed_005.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "1"
          total: "1"
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "🧹 API"
        id: notify_observed_006
        if: always() && steps.checkout.outcome == 'success'
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup

      - name: "📱 Live · Fim"
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: end
          total: "1"
          github-token: ${{ github.token }}
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          outcome: ${{ job.status }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}