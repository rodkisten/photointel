name: "🧱 [GCP BOOTSTRAP] Provision Google Cloud"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan only or reconcile infrastructure using gcloud"
        type: choice
        required: true
        default: plan
        options: [plan, apply]
      authorize_charges:
        description: "I approve Google Cloud resource changes and potential charges"
        type: boolean
        required: true
        default: false
      confirm_project:
        description: "Type the exact GCP project ID"
        type: string
        required: true
        default: photointel

permissions:
  contents: read

concurrency:
  group: photointel-gcp-production
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'plan' || inputs.authorize_charges == true)
    name: "🧱 [GCP BOOTSTRAP] ${{ inputs.mode }} · ${{ inputs.confirm_project }}"
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - name: "📥 Código"
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "📱 Live · Início"
        id: notify_live_start
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: start
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
      - name: "🔔 [NOTIFY] 📥 Código"
        if: ${{ always() && (steps.checkout.outcome == 'success' || steps.checkout.outcome == 'failure' || steps.checkout.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "📥 Código"
          outcome: ${{ steps.checkout.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "11"
      - name: "⚙ Config"
        id: config
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: ${{ inputs.confirm_project }}
          release-sha: ${{ github.sha }}

      - name: "🔔 [NOTIFY] ⚙ Config"
        if: ${{ always() && (steps.config.outcome == 'success' || steps.config.outcome == 'failure' || steps.config.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "⚙ Config"
          outcome: ${{ steps.config.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "23"
      - name: "🧪 Bootstrap"
        id: notify_observed_001
        run: bash -n infra/gcp/bootstrap.sh

      - name: "🔔 [NOTIFY] 🧪 Bootstrap"
        if: ${{ always() && (steps.notify_observed_001.outcome == 'success' || steps.notify_observed_001.outcome == 'failure' || steps.notify_observed_001.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧪 Bootstrap"
          outcome: ${{ steps.notify_observed_001.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "35"
      - name: "🧪 Login"
        id: notify_observed_002
        if: inputs.mode == 'apply'
        env:
          WIF: ${{ vars.GCP_BOOTSTRAP_WORKLOAD_IDENTITY_PROVIDER }}
          BOOTSTRAP_ACCOUNT: ${{ vars.GCP_BOOTSTRAP_SERVICE_ACCOUNT }}
          PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          test "$PROJECT" = photointel || { echo "::error::Unexpected target project"; exit 1; }
          test "$BOOTSTRAP_ACCOUNT" = "photointel-bootstrap@$PROJECT.iam.gserviceaccount.com" || { echo "::error::Dedicated bootstrap account is not configured"; exit 1; }
          test "$WIF" = "projects/799387180206/locations/global/workloadIdentityPools/github-bootstrap/providers/photo-intelligence-bootstrap" || { echo "::error::Bootstrap provider must be separate from deploy provider"; exit 1; }

      - name: "🔔 [NOTIFY] 🧪 Login"
        if: ${{ always() && (steps.notify_observed_002.outcome == 'success' || steps.notify_observed_002.outcome == 'failure' || steps.notify_observed_002.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧪 Login"
          outcome: ${{ steps.notify_observed_002.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "47"
      - name: "🔐 Login"
        id: notify_observed_003
        if: inputs.mode == 'apply'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ inputs.confirm_project }}
          workload_identity_provider: ${{ vars.GCP_BOOTSTRAP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BOOTSTRAP_SERVICE_ACCOUNT }}

      - name: "🔔 [NOTIFY] 🔐 Login"
        if: ${{ always() && (steps.notify_observed_003.outcome == 'success' || steps.notify_observed_003.outcome == 'failure' || steps.notify_observed_003.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🔐 Login"
          outcome: ${{ steps.notify_observed_003.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "59"
      - name: "🧰 Gcloud"
        id: notify_observed_004
        if: inputs.mode == 'apply'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ inputs.confirm_project }}
          version: '>= 500.0.0'

      - name: "🔔 [NOTIFY] 🧰 Gcloud"
        if: ${{ always() && (steps.notify_observed_004.outcome == 'success' || steps.notify_observed_004.outcome == 'failure' || steps.notify_observed_004.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧰 Gcloud"
          outcome: ${{ steps.notify_observed_004.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "71"
      - name: "⚙ Código"
        id: notify_observed_005
        env:
          BOOTSTRAP_MODE: ${{ inputs.mode }}
          AUTHORIZE_CHARGES: ${{ inputs.authorize_charges }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          bash infra/gcp/bootstrap.sh

      - name: "🔔 [NOTIFY] ⚙ Código"
        if: ${{ always() && (steps.notify_observed_005.outcome == 'success' || steps.notify_observed_005.outcome == 'failure' || steps.notify_observed_005.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "⚙ Código"
          outcome: ${{ steps.notify_observed_005.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "83"
      - name: "🧹 API"
        id: notify_observed_006
        if: always() && steps.checkout.outcome == 'success'
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup

      - name: "🔔 [NOTIFY] 🧹 API"
        if: ${{ always() && (steps.notify_observed_006.outcome == 'success' || steps.notify_observed_006.outcome == 'failure' || steps.notify_observed_006.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧹 API"
          outcome: ${{ steps.notify_observed_006.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "95"
      - name: "📱 Live · Fim"
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: end
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          outcome: ${{ job.status }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}