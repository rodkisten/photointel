name: "🔮 RV · Release"

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('🌐 Cloudflare · {0} · {1} · {2}', inputs.action, inputs.app, inputs.request_id || 'manual') || github.event_name == 'pull_request' && format('🌐 Cloudflare · PR #{0}', github.event.pull_request.number) || format('🌐 Cloudflare · Push · {0}', github.ref_name) }}

on:
  push:
    branches: [main]
    paths:
      - 'apps/manage/**'
      - 'apps/web/**'
      - '.prettierrc.json'
      - '.prettierignore'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/contracts/**'
      - 'packages/env/**'
      - 'infra/cloudflare/**'
      - 'scripts/ci/**'
      - 'rodverse.config.ts'
      - 'infra/scripts/prepare_workflow_env.py'
      - 'infra/scripts/cloudflare_setup.py'
      - 'infra/scripts/diagnose_access.py'
      - 'infra/scripts/deploy_manage.py'
      - '.github/actions/notify/**'
      - '.github/actions/gcp-config/**'
      - '.github/actions/frontend-source/**'
      - '.github/actions/frontend-build/**'
      - '.github/workflows/frontend-release.yml'
      - '.github/workflows/_build.yml'
      - '.github/workflows/_deploy.yml'
      - '.github/workflows/_report.yml'


  workflow_dispatch:
    inputs:
      action:
        description: "Ação"
        type: choice
        options: [build, build-and-deploy]
        default: build-and-deploy
      app:
        description: "App"
        type: choice
        options: [all, web, manage]
        default: all
      sha:
        description: "SHA opcional"
        type: string
        default: ''
      request_id:
        description: "ID"
        type: string
        default: ''
  workflow_call:
    inputs:
      action:
        type: string
        default: build-and-deploy
      app:
        type: string
        default: all
      sha:
        type: string
        default: ''
      request_id:
        type: string
        default: ''

permissions:
  contents: read

env:
  BASH_ENV: ${{ github.workspace }}/scripts/ci/pretty-logs.sh

defaults:
  run:
    shell: bash -eo pipefail {0}

concurrency:
  # PR previews são descartáveis; deploys de produção devem concluir com segurança.
  group: ${{ github.event_name == 'pull_request' && format('photointel-frontends-pr-{0}', github.event.pull_request.number) || 'photointel-frontends-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================================
  # 1. Detecção de Alterações & Seleção de Apps
  # ============================================================================
  detect-changes:
    name: "🔍 Detectar alterações"
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.actor != 'renovate[bot]' &&
           github.actor != 'dependabot[bot]' &&
           github.event.pull_request.user.login != 'renovate[bot]' &&
           github.event.pull_request.user.login != 'dependabot[bot]' &&
           github.event.head_commit.author.username != 'renovate[bot]' &&
           github.event.head_commit.author.username != 'dependabot[bot]' &&
           !contains(github.event.head_commit.message, 'dependabot[bot]') &&
           !contains(github.event.head_commit.message, 'renovate[bot]')) }}
    outputs:
      apps: ${{ steps.set-matrix.outputs.apps }}
    steps:
      - name: "📥 Baixar histórico completo do repositório"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: "🗳️ Planejar aplicações afetadas"
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_APP: ${{ inputs.app || 'all' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/ci/plan.ts

  # ============================================================================
  # 2. Validação & Build (Preflight por App)
  # ============================================================================
  preflight:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.apps != '[]' }}
    uses: ./.github/workflows/_build.yml
    with:
      apps: ${{ needs.detect-changes.outputs.apps }}
      production: true
      action: ${{ inputs.action || 'build-and-deploy' }}
      sha: ${{ inputs.sha || '' }}
    secrets: inherit

  # ============================================================================
  # 3. Deploy em Produção · Photos Web Worker (apps/web)
  # ============================================================================
  deploy:
    needs: [detect-changes, preflight]
    if: ${{ github.ref == 'refs/heads/main' && inputs.action != 'build' && needs.preflight.result == 'success' && (github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.detect-changes.outputs.apps), 'web')) }}
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_deploy.yml
    with:
      apps: ${{ github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.apps || '["web"]' }}
      sha: ${{ inputs.sha || '' }}
    secrets: inherit

  report:
    needs: [detect-changes, preflight, deploy]
    if: always()
    uses: ./.github/workflows/_report.yml
    with:
      apps: ${{ needs.detect-changes.outputs.apps || '[]' }}
      plan: ${{ needs.detect-changes.result }}
      build: ${{ needs.preflight.result }}
      deploy: ${{ needs.deploy.result }}
      notify: ${{ github.ref == 'refs/heads/main' && needs.deploy.result != 'skipped' }}
    secrets: inherit
