name: "🚀 [GCP DEPLOY] Controlled release"

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Run a single stage or all in sequence; migration remains manual'
        type: choice
        default: all
        options:
          - all
          - build
          - jobs-deploy
          - deploy
          - scheduler
          - cleanup
        required: true

      database_ready:
        description: 'For deploy/all: I verified Neon migration, secret versions and Cloudflare Access readiness'
        type: boolean
        default: false
        required: true

      authorize_charges:
        description: 'I authorize Google Cloud resources and applicable charges'
        type: boolean
        default: false
        required: true

      confirm_project:
        description: 'Exact Google Cloud project ID configured in production environment'
        type: string
        default: photointel
        required: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"       # Works for Node.js (Chalk), Python, and many modern CLIs
  CLICOLOR_FORCE: "1"    # Works for many C/C++ tools and Unix utilities

concurrency:
  group: photointel-gcp-production
  cancel-in-progress: false

jobs:
  deploy:
    name: "🚀 [GCP DEPLOY] ${{ inputs.action }} · ${{ inputs.confirm_project }}"
    if: github.ref == 'refs/heads/main' && inputs.authorize_charges == true
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - name: "📥 [SOURCE] Checkout repository"
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "🛡️ [GATE] Confirm database and Access readiness before publishing API"
        id: database_gate
        if: inputs.action == 'all' || inputs.action == 'deploy'
        env:
          DATABASE_READY: ${{ inputs.database_ready }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash infra/gcp/release.sh gate

      - name: "⚙️ [RUN] Prepare production vars using the shared action"
        id: config
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: ${{ inputs.confirm_project }}
          release-sha: ${{ github.sha }}

      - name: "🔐 [AUTH] Authenticate to Google Cloud"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.service_account }}

      - name: "🧰 [SETUP] Set up Google Cloud CLI"
        uses: google-github-actions/setup-gcloud@v2

      # Bootstrap creates infrastructure; its resources may not exist yet.
      - name: "🏗️ [BUILD] Diagnose build prerequisites (read-only)"
        id: preflight
        if: inputs.action == 'build' || inputs.action == 'all'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash infra/gcp/release.sh preflight

      - name: "🏗️ [BUILD] Skip build if commit image already exists"
        id: image_cache
        if: inputs.action == 'build' || inputs.action == 'all'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash infra/gcp/release.sh cache

      - name: "🏗️ [BUILD] Compile, publish and verify Docker image"
        id: build_image
        if: (inputs.action == 'build' || inputs.action == 'all') && steps.image_cache.outputs.skip != 'true'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash infra/gcp/release.sh build

      - name: "🏗️ [BUILD] Verify commit image exists before release (read-only)"
        id: verify_image
        if: inputs.action == 'jobs-deploy' || inputs.action == 'deploy' || inputs.action == 'all'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash infra/gcp/release.sh verify

      - name: "📦 [JOBS] Publish five Cloud Run Jobs"
        id: deploy_jobs
        if: inputs.action == 'jobs-deploy' || inputs.action == 'all'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash infra/gcp/release.sh jobs-deploy

      - name: "🚀 [API] Publish Cloud Run service"
        id: deploy_api
        if: inputs.action == 'deploy' || inputs.action == 'all'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          DATABASE_READY: ${{ inputs.database_ready }}
        run: bash infra/gcp/release.sh deploy

      - name: "⏰ [SCHEDULER] Create or update schedules (paused)"
        id: deploy_scheduler
        if: inputs.action == 'scheduler' || inputs.action == 'all'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash infra/gcp/release.sh scheduler

      - name: "🧹 [SCHEDULER] Pause schedules without deleting resources"
        id: pause_scheduler
        if: inputs.action == 'cleanup'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash infra/gcp/release.sh cleanup

      - name: "🧹 [CLEANUP] Remove local deployment metadata (always)"
        if: always() && steps.checkout.outcome == 'success'
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup
