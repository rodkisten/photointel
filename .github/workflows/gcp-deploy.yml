name: 🚀 Google Cloud controlled deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Operation (migration remains a separate backed-up operator command)'
        type: choice
        options:
          - bootstrap
          - build
          - jobs-deploy
          - deploy
          - scheduler
          - cleanup
        required: true

      authorize_charges:
        description: 'I authorize Google Cloud resources and applicable charges'
        type: boolean
        default: false
        required: true

      confirm_project:
        description: 'Exact Google Cloud project ID configured in production environment'
        type: string
        default: photointel
        required: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"       # Works for Node.js (Chalk), Python, and many modern CLIs
  CLICOLOR_FORCE: "1"    # Works for many C/C++ tools and Unix utilities

concurrency:
  group: photointel-gcp-production
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.action }} · ${{ inputs.confirm_project }}
    if: github.ref == 'refs/heads/main' && inputs.authorize_charges == true
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .env parser
        run: |
          python -m pip install --disable-pip-version-check python-dotenv==1.2.4

      - name: Convert production .env and validate configuration
        id: config
        env:
          # Environment Variable (not a GitHub Secret): references/config only.
          GCP_CONFIG_ENV: ${{ vars.GCP_CONFIG_ENV }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python infra/gcp/gcp-env.py
          python infra/gcp/manage.py render

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.service_account }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # Bootstrap creates infrastructure; its resources may not exist yet.
      - name: Diagnose build prerequisites (read-only)
        if: inputs.action == 'build'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          PROJECT="$CONFIRM_PROJECT"
          BUCKET="gs://$PROJECT-photointel-build-source"
          BUILDER="photointel-builder@$PROJECT.iam.gserviceaccount.com"
          REGION="$(python3 -c 'import json; print(json.load(open("infra/gcp/config.local.json"))["region"])')"
          REPOSITORY="$(python3 -c 'import json; print(json.load(open("infra/gcp/config.local.json"))["repository"])')"

          echo 'Checking authenticated identity...'
          gcloud auth list --filter='status:ACTIVE' --format='value(account)'

          echo 'Checking Cloud Build API...'
          API="$(gcloud services list --project="$PROJECT" --enabled \
            --filter='config.name=cloudbuild.googleapis.com' \
            --format='value(config.name)')"
          if [[ "$API" != "cloudbuild.googleapis.com" ]]; then
            echo '::error::Cloud Build API is not enabled. Run bootstrap with an authorized operator.'
            exit 1
          fi

          echo "Checking staging bucket $BUCKET..."
          if ! gcloud storage buckets describe "$BUCKET" --project="$PROJECT" \
            --format='value(name,location)'; then
            echo "::error::Staging bucket missing or inaccessible: $BUCKET. Inspect Storage IAM."
            exit 1
          fi

          echo "Checking builder service account $BUILDER..."
          if ! gcloud iam service-accounts describe "$BUILDER" --project="$PROJECT" \
            --format='value(email)'; then
            echo "::error::Builder service account missing or inaccessible. Run administrative bootstrap."
            exit 1
          fi

          echo "Checking Docker registry $REPOSITORY in $REGION..."
          if ! gcloud artifacts repositories describe "$REPOSITORY" \
            --project="$PROJECT" --location="$REGION" \
            --format='value(name,format)'; then
            echo "::error::Artifact Registry repository missing or inaccessible in $REGION."
            exit 1
          fi

          echo 'Read-only preflight passed. Object write, actAs and Docker push IAM are checked by the real build.'

      - name: Verify commit image exists before release (read-only)
        if: inputs.action == 'jobs-deploy' || inputs.action == 'deploy'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REGION="$(python3 -c 'import json; print(json.load(open("infra/gcp/config.local.json"))["region"])')"
          REPOSITORY="$(python3 -c 'import json; print(json.load(open("infra/gcp/config.local.json"))["repository"])')"
          IMAGE="$REGION-docker.pkg.dev/$CONFIRM_PROJECT/$REPOSITORY/api"
          echo "Checking Artifact Registry image tag $RELEASE_SHA ..."
          gcloud artifacts docker images list "$IMAGE" \
            --project="$CONFIRM_PROJECT" --include-tags --format=json |
          python3 -c '
          import json, os, sys
          try:
              rows = json.load(sys.stdin)
          except (ValueError, TypeError) as exc:
              sys.exit(f"::error::Cannot read Artifact Registry images: {exc}")
          sha = os.environ["RELEASE_SHA"]
          matches = [row for row in rows if isinstance(row, dict)
                     and sha in row.get("tags", [])]
          if len(matches) != 1:
              sys.exit(f"::error::Expected exactly one image tagged {sha}; found {len(matches)}. Run build for this commit first.")
          print(f"Found immutable release tag {sha}; deploy may proceed.")
          '

      - name: Execute selected operation
        env:
          OPERATION: ${{ inputs.action }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          python infra/gcp/manage.py "$OPERATION" \
            --apply \
            --authorize-charges \
            --confirm-project "$CONFIRM_PROJECT"

      - name: Remove local deployment metadata
        if: always()
        run: |
          rm -f infra/gcp/config.local.json
          rm -rf infra/gcp/rendered
