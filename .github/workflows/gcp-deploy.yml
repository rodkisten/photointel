name: 🚀 Google Cloud controlled deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Operation (migration remains a separate backed-up operator command)'
        type: choice
        options: [build, jobs-deploy, deploy, scheduler, cleanup]
        required: true
      authorize_charges:
        description: 'I authorize Google Cloud resources and applicable charges'
        type: boolean
        default: true
        required: true
      confirm_project:
        description: 'Exact Google Cloud project ID configured in production environment'
        type: string
        required: true
        default: 'photointel'

permissions:
  contents: read

concurrency:
  group: photointel-gcp-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.authorize_charges == true
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .env parser
        run: python -m pip install --disable-pip-version-check python-dotenv==1.2.4

      - name: Convert production .env and validate configuration
        id: config
        env:
          GCP_CONFIG_ENV: ${{ vars.GCP_CONFIG_ENV }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python infra/gcp/gcp-env.py
          python infra/gcp/manage.py render

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.service_account }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Execute only the explicitly selected operation
        env:
          OPERATION: ${{ inputs.action }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          python infra/gcp/manage.py "$OPERATION" --apply --authorize-charges --confirm-project "$CONFIRM_PROJECT"

      - name: Remove local deployment metadata
        if: always()
        run: |
          rm -f infra/gcp/config.local.json
          rm -rf infra/gcp/rendered
