name: "🚀 Deploy"
run-name: "🚀 Deploy · ${{ inputs.action || 'release' }}${{ inputs.action == 'migrate' && format(' · {0}', inputs.migration_mode || 'plan') || '' }}"

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select a stage or run the release'
        type: choice
        default: release
        options:
          - release
          - build
          - jobs-deploy
          - migrate
          - deploy
          - scheduler
          - cleanup
        required: true

      migration_mode:
        description: 'Neon: inspect, apply, or diagnose'
        type: choice
        options:
          - plan
          - apply
          - diagnose
        default: plan
        required: true

      migration_database:
        description: 'Migrate apply: initial-empty if empty'
        type: choice
        options:
          - unselected
          - initial-empty
          - existing-with-backup
        default: unselected
        required: true

      migration_backup_prefix:
        description: 'Optional: private backup prefix'
        type: string
        default: ''
        required: false

      database_ready:
        description: 'For deploy/release: I verified everything'
        type: boolean
        default: false
        required: true

      authorize_charges:
        description: 'I authorize Google Cloud charges'
        type: boolean
        default: false
        required: true

      confirm_project:
        description: 'Google Cloud project ID'
        type: string
        default: photointel
        required: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"       # Works for Node.js (Chalk), Python, and many modern CLIs
  CLICOLOR_FORCE: "1"    # Works for many C/C++ tools and Unix utilities

concurrency:
  group: photointel-gcp-production
  cancel-in-progress: false

jobs:
  deploy:
    name: "🚀 ${{ inputs.action }}"
    if: github.ref == 'refs/heads/main' && (inputs.authorize_charges == true || (inputs.action == 'migrate' && (inputs.migration_mode == 'plan' || inputs.migration_mode == 'diagnose')))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90

    permissions:
      contents: read
      id-token: write
      actions: read

    defaults:
      run:
        shell: bash

    steps:
      - name: "📥 Código"
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "📱 Live · Início"
        id: notify_live_start
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: start
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          github-token: ${{ github.token }}
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
      - name: "🛡 Validação DB"
        id: database_gate
        if: inputs.action == 'release' || inputs.action == 'deploy'
        env:
          DATABASE_READY: ${{ inputs.database_ready }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash infra/gcp/release.sh gate

      - name: "📱 ! 🛡 Validação DB"
        if: ${{ always() && (steps.database_gate.outcome == 'failure' || steps.database_gate.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🛡 Validação DB"
          step-index: "3"
          label: "🛡 Validação DB"
          outcome: ${{ steps.database_gate.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "⚙ Env"
        id: config
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: ${{ inputs.confirm_project }}
          release-sha: ${{ github.sha }}

      - name: "📱 ! ⚙ Env"
        if: ${{ always() && (steps.config.outcome == 'failure' || steps.config.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "⚙ Env"
          step-index: "5"
          label: "⚙ Env"
          outcome: ${{ steps.config.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "🔐 Login"
        id: notify_observed_001
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.service_account }}

      - name: "📱 ! 🔐 Login"
        if: ${{ always() && (steps.notify_observed_001.outcome == 'failure' || steps.notify_observed_001.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🔐 Login"
          step-index: "7"
          label: "🔐 Login"
          outcome: ${{ steps.notify_observed_001.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "🧰 Gcloud"
        id: notify_observed_002
        uses: google-github-actions/setup-gcloud@v2

      # Bootstrap creates infrastructure; its resources may not exist yet.
      - name: "📱 ! 🧰 Gcloud"
        if: ${{ always() && (steps.notify_observed_002.outcome == 'failure' || steps.notify_observed_002.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧰 Gcloud"
          step-index: "9"
          label: "🧰 Gcloud"
          outcome: ${{ steps.notify_observed_002.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "📱 ▶ Build"
        if: ${{ inputs.action == 'release' || inputs.action == 'build' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🏗 Pré-check"
          step-index: "12"
          label: "🏗 Build"
          outcome: running
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "🏗 Pré-check"
        id: preflight
        if: inputs.action == 'build' || inputs.action == 'release'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash infra/gcp/release.sh preflight

      - name: "📱 ! Build"
        if: ${{ always() && (steps.preflight.outcome == 'failure' || steps.preflight.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🏗 Pré-check"
          step-index: "12"
          label: "🏗 Build"
          outcome: ${{ steps.preflight.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "📱 ▶ Cache"
        if: ${{ inputs.action == 'release' || inputs.action == 'build' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🏗 Cache"
          step-index: "15"
          label: "🏗 Cache"
          outcome: running
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "🏗 Cache"
        id: image_cache
        if: inputs.action == 'build' || inputs.action == 'release'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash infra/gcp/release.sh cache

      - name: "📱 ! Build"
        if: ${{ always() && (steps.image_cache.outcome == 'failure' || steps.image_cache.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🏗 Cache"
          step-index: "15"
          label: "🏗 Build"
          outcome: ${{ steps.image_cache.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "📱 ▶ Build"
        if: ${{ (inputs.action == 'release' || inputs.action == 'build') && steps.image_cache.outputs.skip != 'true' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🏗 Build"
          step-index: "18"
          label: "🏗 Build"
          outcome: running
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "🏗 Build"
        id: build_image
        if: (inputs.action == 'build' || inputs.action == 'release') && steps.image_cache.outputs.skip != 'true'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash infra/gcp/release.sh build

      - name: "📱 ! Build"
        if: ${{ always() && (steps.build_image.outcome == 'failure' || steps.build_image.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🏗 Build"
          step-index: "18"
          label: "🏗 Build"
          outcome: ${{ steps.build_image.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "📱 ▶ Imagem"
        if: ${{ inputs.action == 'release' || inputs.action == 'build' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🏗 Imagem"
          step-index: "21"
          label: "🏗 Imagem"
          outcome: running
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "🏗 Imagem"
        id: verify_image
        if: inputs.action == 'build' || inputs.action == 'jobs-deploy' || inputs.action == 'deploy' || inputs.action == 'release'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash infra/gcp/release.sh verify

      - name: "📱 ✓ Build"
        if: ${{ always() && ((inputs.action == 'release' || inputs.action == 'build') && (steps.verify_image.outcome == 'success' || steps.verify_image.outcome == 'failure' || steps.verify_image.outcome == 'cancelled')) }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🏗 Imagem"
          step-index: "21"
          label: "🏗 Build"
          outcome: ${{ steps.verify_image.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "1"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "📱 ! Imagem"
        if: ${{ always() && inputs.action != 'release' && inputs.action != 'build' && (steps.verify_image.outcome == 'failure' || steps.verify_image.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🏗 Imagem"
          step-index: "21"
          label: "🏗 Imagem"
          outcome: ${{ steps.verify_image.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "📱 ▶ Jobs"
        if: ${{ inputs.action == 'release' || inputs.action == 'jobs-deploy' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "📦 Jobs"
          step-index: "25"
          label: "📦 Jobs"
          outcome: running
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "${{ inputs.action == 'release' && '1' || '0' }}"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "📦 Jobs"
        id: deploy_jobs
        if: inputs.action == 'jobs-deploy' || inputs.action == 'release'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash infra/gcp/release.sh jobs-deploy

      - name: "📱 ✓ Jobs"
        if: ${{ always() && ((steps.deploy_jobs.outcome == 'success' || steps.deploy_jobs.outcome == 'failure' || steps.deploy_jobs.outcome == 'cancelled')) }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "📦 Jobs"
          step-index: "25"
          label: "📦 Jobs"
          outcome: ${{ steps.deploy_jobs.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "${{ inputs.action == 'release' && '2' || '1' }}"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "📱 ▶ Neon"
        if: ${{ inputs.action == 'migrate' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🗃 Neon"
          step-index: "28"
          label: "🗃 Neon"
          outcome: running
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "🗃 Neon"
        id: migrate_database
        if: inputs.action == 'migrate'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          RELEASE_SHA: ${{ github.sha }}
          MIGRATION_MODE: ${{ inputs.migration_mode }}
          MIGRATION_DATABASE: ${{ inputs.migration_database }}
          MIGRATION_BACKUP_PREFIX: ${{ inputs.migration_backup_prefix }}
        run: bash infra/gcp/release.sh migrate

      - name: "📱 ✓ Neon"
        if: ${{ always() && ((steps.migrate_database.outcome == 'success' || steps.migrate_database.outcome == 'failure' || steps.migrate_database.outcome == 'cancelled')) }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🗃 Neon"
          step-index: "28"
          label: "🗃 Neon"
          outcome: ${{ steps.migrate_database.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "1"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "📱 ▶ API"
        if: ${{ inputs.action == 'release' || inputs.action == 'deploy' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🚀 API"
          step-index: "31"
          label: "🚀 API"
          outcome: running
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "${{ inputs.action == 'release' && '2' || '0' }}"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "🚀 API"
        id: deploy_api
        if: inputs.action == 'deploy' || inputs.action == 'release'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          DATABASE_READY: ${{ inputs.database_ready }}
        run: bash infra/gcp/release.sh deploy

      - name: "📱 ✓ API"
        if: ${{ always() && ((steps.deploy_api.outcome == 'success' || steps.deploy_api.outcome == 'failure' || steps.deploy_api.outcome == 'cancelled')) }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🚀 API"
          step-index: "31"
          label: "🚀 API"
          outcome: ${{ steps.deploy_api.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "${{ inputs.action == 'release' && '3' || '1' }}"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "📱 ▶ Agenda"
        if: ${{ inputs.action == 'scheduler' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "⏰ Agenda"
          step-index: "34"
          label: "⏰ Agenda"
          outcome: running
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: 1
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "⏰ Agenda"
        id: deploy_scheduler
        if: inputs.action == 'scheduler'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash infra/gcp/release.sh scheduler

      - name: "📱 ✓ Agenda"
        if: ${{ always() && ((steps.deploy_scheduler.outcome == 'success' || steps.deploy_scheduler.outcome == 'failure' || steps.deploy_scheduler.outcome == 'cancelled')) }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "⏰ Agenda"
          step-index: "34"
          label: "⏰ Agenda"
          outcome: ${{ steps.deploy_scheduler.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "1"
          total: 1
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "📱 ▶ Limpeza"
        if: ${{ inputs.action == 'cleanup' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          github-token: ${{ github.token }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧹 Código"
          step-index: "37"
          label: "🧹 Limpeza"
          outcome: running
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "0"
          total: ${{ inputs.action == 'release' && '3' || '1' }}
          project: ${{ inputs.confirm_project }}
          region: "us-central1"
      - name: "🧹 Código"
        id: pause_scheduler
        if: inputs.action == 'cleanup'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash infra/gcp/release.sh cleanup

      - name: "📱 ✓ Limpeza"
        if: ${{ always() && ((steps.pause_scheduler.outcome == 'success' || steps.pause_scheduler.outcome == 'failure' || steps.pause_scheduler.outcome == 'cancelled')) }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
