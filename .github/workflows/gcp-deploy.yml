name: 🚀 Google Cloud controlled deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Operation (migration remains a separate backed-up operator command)'
        type: choice
        options:
          - bootstrap
          - build
          - jobs-deploy
          - deploy
          - scheduler
          - cleanup
        required: true

      authorize_charges:
        description: 'I authorize Google Cloud resources and applicable charges'
        type: boolean
        default: false
        required: true

      confirm_project:
        description: 'Exact Google Cloud project ID configured in production environment'
        type: string
        default: photointel
        required: true

permissions:
  contents: read

concurrency:
  group: photointel-gcp-production
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.action }} · ${{ inputs.confirm_project }}
    if: github.ref == 'refs/heads/main' && inputs.authorize_charges == true
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .env parser
        run: |
          python -m pip install --disable-pip-version-check python-dotenv==1.2.4

      - name: Convert production .env and validate configuration
        id: config
        env:
          # Environment Variable (not a GitHub Secret): references/config only.
          GCP_CONFIG_ENV: ${{ vars.GCP_CONFIG_ENV }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python infra/gcp/gcp-env.py
          python infra/gcp/manage.py render

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.service_account }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # The bootstrap operation creates the staging bucket and builder service account.
      # Never require either of those resources to exist before bootstrap runs.
      - name: Diagnose Cloud Build prerequisites
        if: inputs.action == 'build'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail

          BUCKET="gs://${CONFIRM_PROJECT}-photointel-build-source"
          BUILDER="photointel-builder@${CONFIRM_PROJECT}.iam.gserviceaccount.com"

          echo 'Checking authenticated Google Cloud identity...'
          gcloud auth list --filter='status:ACTIVE' --format='value(account)'

          echo 'Checking Cloud Build API...'
          gcloud services list \
            --project="$CONFIRM_PROJECT" \
            --enabled \
            --filter='config.name=cloudbuild.googleapis.com' \
            --format='value(config.name)'

          echo "Checking staging bucket: ${BUCKET}"
          if ! gcloud storage buckets describe "$BUCKET" \
            --project="$CONFIRM_PROJECT" \
            --format='value(name,location)'; then
            echo "::error::Staging bucket is missing or inaccessible: ${BUCKET}. Run bootstrap with an authorized operator, or fix the deployer's bucket IAM permissions."
            exit 1
          fi

          echo "Checking Cloud Build service account: ${BUILDER}"
          gcloud iam service-accounts describe "$BUILDER" \
            --project="$CONFIRM_PROJECT" \
            --format='value(email)'

          echo 'Preflight checks completed. Storage write and build permissions are not guaranteed by these read checks.'

      - name: Execute selected operation
        env:
          OPERATION: ${{ inputs.action }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          python infra/gcp/manage.py "$OPERATION" \
            --apply \
            --authorize-charges \
            --confirm-project "$CONFIRM_PROJECT"

      - name: Remove local deployment metadata
        if: always()
        run: |
          rm -f infra/gcp/config.local.json
          rm -rf infra/gcp/rendered
