name: "🚀 Deploy"

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select a stage or run the release'
        type: choice
        default: all
        options:
          - all
          - build
          - jobs-deploy
          - migrate
          - deploy
          - scheduler
          - cleanup
        required: true

      migration_mode:
        description: 'Neon: inspect, apply migrations, or diagnose connection'
        type: choice
        options:
          - plan
          - apply
          - diagnose
        default: plan
        required: true

      migration_database:
        description: 'For migrate apply: selecting initial-empty affirms database is confirmed empty'
        type: choice
        options:
          - unselected
          - initial-empty
          - existing-with-backup
        default: unselected
        required: true

      migration_backup_prefix:
        description: 'Optional: private backup prefix, automatically resolved when uniquely identifiable'
        type: string
        default: ''
        required: false

      database_ready:
        description: 'For deploy/all: I verified Neon migration, secret versions and Cloudflare Access readiness'
        type: boolean
        default: false
        required: true

      authorize_charges:
        description: 'I authorize Google Cloud resources and applicable charges'
        type: boolean
        default: false
        required: true

      confirm_project:
        description: 'Exact Google Cloud project ID configured in production environment'
        type: string
        default: photointel
        required: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"       # Works for Node.js (Chalk), Python, and many modern CLIs
  CLICOLOR_FORCE: "1"    # Works for many C/C++ tools and Unix utilities

concurrency:
  group: photointel-gcp-production
  cancel-in-progress: false

jobs:
  deploy:
    name: "🚀 ${{ inputs.action }}"
    if: github.ref == 'refs/heads/main' && (inputs.authorize_charges == true || (inputs.action == 'migrate' && (inputs.migration_mode == 'plan' || inputs.migration_mode == 'diagnose')))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - name: "📥 Código"
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "📱 Live · Início"
        id: notify_live_start
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: start
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
      - name: "🔔 [NOTIFY] 📥 Código"
        if: ${{ always() && (steps.checkout.outcome == 'success' || steps.checkout.outcome == 'failure' || steps.checkout.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "📥 Código"
          outcome: ${{ steps.checkout.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "6"
      - name: "🛡 Validação DB"
        id: database_gate
        if: inputs.action == 'all' || inputs.action == 'deploy'
        env:
          DATABASE_READY: ${{ inputs.database_ready }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash infra/gcp/release.sh gate

      - name: "🔔 [NOTIFY] 🛡 Validação DB"
        if: ${{ always() && (steps.database_gate.outcome == 'success' || steps.database_gate.outcome == 'failure' || steps.database_gate.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🛡 Validação DB"
          outcome: ${{ steps.database_gate.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "13"
      - name: "⚙ Config"
        id: config
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: ${{ inputs.confirm_project }}
          release-sha: ${{ github.sha }}

      - name: "🔔 [NOTIFY] ⚙ Config"
        if: ${{ always() && (steps.config.outcome == 'success' || steps.config.outcome == 'failure' || steps.config.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "⚙ Config"
          outcome: ${{ steps.config.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "20"
      - name: "🔐 Login"
        id: notify_observed_001
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.service_account }}

      - name: "🔔 [NOTIFY] 🔐 Login"
        if: ${{ always() && (steps.notify_observed_001.outcome == 'success' || steps.notify_observed_001.outcome == 'failure' || steps.notify_observed_001.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🔐 Login"
          outcome: ${{ steps.notify_observed_001.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "27"
      - name: "🧰 Gcloud"
        id: notify_observed_002
        uses: google-github-actions/setup-gcloud@v2

      # Bootstrap creates infrastructure; its resources may not exist yet.
      - name: "🔔 [NOTIFY] 🧰 Gcloud"
        if: ${{ always() && (steps.notify_observed_002.outcome == 'success' || steps.notify_observed_002.outcome == 'failure' || steps.notify_observed_002.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧰 Gcloud"
          outcome: ${{ steps.notify_observed_002.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "33"
      - name: "🏗 Pré-check"
        id: preflight
        if: inputs.action == 'build' || inputs.action == 'all'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash infra/gcp/release.sh preflight

      - name: "🔔 [NOTIFY] 🏗 Pré-check"
        if: ${{ always() && (steps.preflight.outcome == 'success' || steps.preflight.outcome == 'failure' || steps.preflight.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🏗 Pré-check"
          outcome: ${{ steps.preflight.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "40"
      - name: "🏗 Cache"
        id: image_cache
        if: inputs.action == 'build' || inputs.action == 'all'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash infra/gcp/release.sh cache

      - name: "🔔 [NOTIFY] 🏗 Cache"
        if: ${{ always() && (steps.image_cache.outcome == 'success' || steps.image_cache.outcome == 'failure' || steps.image_cache.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🏗 Cache"
          outcome: ${{ steps.image_cache.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "47"
      - name: "🏗 Build"
        id: build_image
        if: (inputs.action == 'build' || inputs.action == 'all') && steps.image_cache.outputs.skip != 'true'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash infra/gcp/release.sh build

      - name: "🔔 [NOTIFY] 🏗 Build"
        if: ${{ always() && (steps.build_image.outcome == 'success' || steps.build_image.outcome == 'failure' || steps.build_image.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🏗 Build"
          outcome: ${{ steps.build_image.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "54"
      - name: "🏗 Imagem"
        id: verify_image
        if: inputs.action == 'jobs-deploy' || inputs.action == 'deploy' || inputs.action == 'all'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash infra/gcp/release.sh verify

      - name: "🔔 [NOTIFY] 🏗 Imagem"
        if: ${{ always() && (steps.verify_image.outcome == 'success' || steps.verify_image.outcome == 'failure' || steps.verify_image.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🏗 Imagem"
          outcome: ${{ steps.verify_image.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "61"
      - name: "📦 Jobs"
        id: deploy_jobs
        if: inputs.action == 'jobs-deploy' || inputs.action == 'all'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash infra/gcp/release.sh jobs-deploy

      - name: "🔔 [NOTIFY] Jobs"
        if: ${{ always() && (steps.deploy_jobs.outcome == 'success' || steps.deploy_jobs.outcome == 'failure' || steps.deploy_jobs.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "📦 Jobs"
          outcome: ${{ steps.deploy_jobs.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "67"
      - name: "🗃 Neon"
        id: migrate_database
        if: inputs.action == 'migrate'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          RELEASE_SHA: ${{ github.sha }}
          MIGRATION_MODE: ${{ inputs.migration_mode }}
          MIGRATION_DATABASE: ${{ inputs.migration_database }}
          MIGRATION_BACKUP_PREFIX: ${{ inputs.migration_backup_prefix }}
        run: bash infra/gcp/release.sh migrate

      - name: "🔔 [NOTIFY] Neon"
        if: ${{ always() && (steps.migrate_database.outcome == 'success' || steps.migrate_database.outcome == 'failure' || steps.migrate_database.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🗃 Neon"
          outcome: ${{ steps.migrate_database.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "71"
      - name: "🚀 API"
        id: deploy_api
        if: inputs.action == 'deploy' || inputs.action == 'all'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          DATABASE_READY: ${{ inputs.database_ready }}
        run: bash infra/gcp/release.sh deploy

      - name: "🔔 [NOTIFY] 🚀 API"
        if: ${{ always() && (steps.deploy_api.outcome == 'success' || steps.deploy_api.outcome == 'failure' || steps.deploy_api.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🚀 API"
          outcome: ${{ steps.deploy_api.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "74"
      - name: "⏰ Agenda"
        id: deploy_scheduler
        if: inputs.action == 'scheduler' || inputs.action == 'all'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash infra/gcp/release.sh scheduler

      - name: "🔔 [NOTIFY] ⏰ Agenda"
        if: ${{ always() && (steps.deploy_scheduler.outcome == 'success' || steps.deploy_scheduler.outcome == 'failure' || steps.deploy_scheduler.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "⏰ Agenda"
          outcome: ${{ steps.deploy_scheduler.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "81"
      - name: "🧹 Código"
        id: pause_scheduler
        if: inputs.action == 'cleanup'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash infra/gcp/release.sh cleanup

      - name: "🔔 [NOTIFY] 🧹 Código"
        if: ${{ always() && (steps.pause_scheduler.outcome == 'success' || steps.pause_scheduler.outcome == 'failure' || steps.pause_scheduler.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧹 Código"
          outcome: ${{ steps.pause_scheduler.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "88"
      - name: "🧹 API"
        id: notify_observed_003
        if: always() && steps.checkout.outcome == 'success'
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup

      - name: "🔔 [NOTIFY] 🧹 API"
        if: ${{ always() && (steps.notify_observed_003.outcome == 'success' || steps.notify_observed_003.outcome == 'failure' || steps.notify_observed_003.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧹 API"
          outcome: ${{ steps.notify_observed_003.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          progress: "95"
      - name: "📱 Live · Fim"
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: end
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          outcome: ${{ job.status }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
