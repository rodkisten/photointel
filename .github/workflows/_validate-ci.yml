name: "🧪 Validate Suite"

on:
  workflow_call:
    inputs:
      event_name:
        type: string
        required: true
      scope:
        type: string
        default: 'auto'
      upload_artifacts:
        type: boolean
        default: false
      base_sha:
        type: string
        default: ''
      head_sha:
        type: string
        required: true
      python:
        type: string
        default: 'false'
      integration:
        type: string
        default: 'false'
      containers:
        type: string
        default: 'false'
      security:
        type: string
        default: 'false'
      py_api:
        type: string
        default: 'false'
      py_manage:
        type: string
        default: 'false'
      py_gpu:
        type: string
        default: 'false'
      py_bridges:
        type: string
        default: 'false'
      front_web:
        type: string
        default: 'false'
      front_manage:
        type: string
        default: 'false'
      frontend_matrix:
        type: string
        default: '[]'

permissions:
  contents: read
  pull-requests: read

jobs:
  # ============================================================================
  # 1. Formatação Cirúrgica (Prettier apenas nas linhas alteradas do diff)
  # ============================================================================
  prettier:
    name: "✨ Prettier · diff check"
    if: inputs.event_name == 'pull_request' || inputs.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: "🧰 Setup Node.js 26"
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: "🧭 Resolver range do diff"
        id: range
        env:
          RAW_BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: node scripts/ci/resolve-diff-range.mts

      - name: "📦 Instalar dependências (Prettier)"
        if: steps.range.outputs.skip != 'true'
        run: npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund

      - name: "✨ Verificar formatação no diff modificado"
        if: steps.range.outputs.skip != 'true'
        env:
          NODE_PATH: ${{ github.workspace }}/apps/web/node_modules
        run: node scripts/ci/prettier-diff.mts "${{ steps.range.outputs.base_sha }}" "${{ steps.range.outputs.head_sha }}"

  # ============================================================================
  # 2. Backend & Workers (Python)
  # ============================================================================
  python:
    name: "🐍 Python · lint, types, unit"
    if: inputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Baixar código"
        id: notify_observed_002
        continue-on-error: true
        uses: actions/checkout@v7

      - name: "🧰 Configurar uv"
        id: notify_observed_003
        continue-on-error: true
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.23'
          enable-cache: true

      - name: "🐍 Instalar Python 3.15"
        id: notify_observed_004
        continue-on-error: true
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv python install 3.15" uv python install 3.15

      - name: "🔒 Verificar consistência do lockfile"
        id: python_lock_check
        continue-on-error: true
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv lock --check" uv lock --check

      - name: "📦 Sincronizar dependências (uv)"
        id: notify_observed_005
        continue-on-error: true
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv sync --frozen --group ingest" uv sync --frozen --group ingest

      - name: "🧹 [api] Lint e formatação (Ruff)"
        id: ruff_api
        if: inputs.py_api == 'true'
        continue-on-error: true
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv run ruff check apps/api" uv run --no-sync ruff check apps/api

      - name: "🧹 [manage] Lint e formatação (Ruff)"
        id: ruff_manage
        if: inputs.py_manage == 'true'
        continue-on-error: true
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv run ruff check apps/manage" uv run --no-sync ruff check apps/manage

      - name: "🧹 [gpu & bridges] Lint e formatação (Ruff)"
        id: ruff_workers
        if: inputs.py_gpu == 'true' || inputs.py_bridges == 'true'
        continue-on-error: true
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv run ruff check gpu bridges packages" uv run --no-sync ruff check gpu bridges packages

      - name: "🔎 [api] Tipagem estática (Mypy)"
        id: mypy_api
        if: inputs.py_api == 'true'
        continue-on-error: true
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv run mypy apps/api/src" uv run --no-sync mypy apps/api/src

      - name: "🔎 [manage] Tipagem estática (Mypy)"
        id: mypy_manage
        if: inputs.py_manage == 'true'
        continue-on-error: true
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv run mypy tests/test_manage_queue.py" uv run --no-sync mypy tests/test_manage_queue.py

      - name: "🔎 [gpu & bridges] Tipagem estática (Mypy)"
        id: mypy_workers
        if: inputs.py_gpu == 'true' || inputs.py_bridges == 'true'
        continue-on-error: true
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv run mypy gpu bridges" uv run --no-sync mypy gpu bridges

      - name: "🧪 [api] Testes unitários (Pytest)"
        id: pytest_api
        if: inputs.py_api == 'true'
        continue-on-error: true
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv run pytest API contract tests" uv run --no-sync pytest tests/test_search_contract.py tests/test_icloud_web_auth.py tests/test_import_authorization_v11.py -m 'not integration and not gpu and not e2e' --junitxml=reports/unit-api.xml

      - name: "🧪 [manage] Testes unitários (Pytest)"
        id: pytest_manage
        if: inputs.py_manage == 'true'
        continue-on-error: true
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv run pytest Manage tests" uv run --no-sync pytest tests/test_manage_queue.py tests/test_settings_environment.py tests/test_cloud_logs.py -m 'not integration and not gpu and not e2e' --junitxml=reports/unit-manage.xml

      - name: "🧪 [gpu & bridges] Testes unitários (Pytest)"
        id: pytest_workers
        if: inputs.py_gpu == 'true' || inputs.py_bridges == 'true'
        continue-on-error: true
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv run pytest tests --ignore=tests/api --ignore=tests/manage" uv run --no-sync pytest tests --ignore=tests/api --ignore=tests/manage -m 'not integration and not gpu and not e2e' --junitxml=reports/unit-workers.xml

      - name: "📤 Publicar relatórios JUnit"
        id: notify_observed_009
        continue-on-error: true
        if: ${{ always() && (inputs.event_name == 'workflow_dispatch' || steps.pytest_api.outcome == 'failure' || steps.pytest_manage.outcome == 'failure' || steps.pytest_workers.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-results
          path: reports/unit-*.xml
          if-no-files-found: ignore
          retention-days: 3

      - name: "🧰 Setup Node.js 26"
        if: ${{ always() }}
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: "📋 Consolidar falhas · python"
        if: ${{ always() }}
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/ci/consolidate-steps.mts

  # ============================================================================
  # 3. Frontend: Web & Manage
  # ============================================================================
  frontend:
    if: inputs.front_web == 'true' || inputs.front_manage == 'true'
    uses: ./.github/workflows/_build.yml
    with:
      apps: ${{ inputs.event_name == 'pull_request' && '["web","manage"]' || inputs.frontend_matrix }}
      production: false
      preview: ${{ inputs.event_name == 'pull_request' }}

  # ============================================================================
  # 4. Testes de Integração & E2E (Temporarily disabled - PR #240)
  # ============================================================================
  integration:
    name: "⏸️ Integration · PostgreSQL indisponível (PR #240)"
    if: ${{ false && inputs.integration == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.23'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: "📋 Consolidar falhas · integration"
        if: ${{ always() }}
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/ci/consolidate-steps.mts

  # ============================================================================
  # 5. Imagens Docker Multi-Arquitetura
  # ============================================================================
  containers:
    name: "🐳 Containers · architectures"
    if: inputs.containers == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Baixar código"
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v7

      - name: "⚙️ Configurar emulação QEMU"
        id: qemu
        continue-on-error: true
        uses: docker/setup-qemu-action@v4

      - name: "🐳 Configurar Docker Buildx"
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v4

      - name: "🏗️ Validar build multi-arch · API"
        id: api_multiarch
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

      - name: "🏗️ Validar build multi-arch · Web"
        id: web_multiarch
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

      - uses: actions/setup-node@v7
        if: ${{ always() }}
        with:
          node-version: '26'

      - name: "📋 Consolidar falhas · containers"
        if: ${{ always() }}
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/ci/consolidate-steps.mts

  # ============================================================================
  # 6. Auditoria de Segurança & Segredos
  # ============================================================================
  security:
    name: "🔐 Security · dependency and secret audit"
    if: inputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Baixar histórico completo"
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "🧰 Configurar uv"
        id: setup_uv
        continue-on-error: true
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.23'

      - name: "📄 Exportar dependências de runtime"
        id: export_deps
        continue-on-error: true
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: uv export --frozen --no-dev --group ingest --no-emit-project --no-emit-package photointel-icloudpd-source > /tmp/runtime-requirements.txt

      - name: "🔍 Audit runtime Python dependencies"
        id: runtime_dependency_audit
        if: steps.export_deps.outcome == 'success'
        continue-on-error: true
        run: uvx pip-audit --requirement /tmp/runtime-requirements.txt

      - name: "🕵️ Varrer vazamento de segredos (Gitleaks)"
        id: gitleaks
        continue-on-error: true
        run: |
          report_dir=$(mktemp -d)
          trap 'rm -rf "$report_dir"' EXIT
          status=0
          docker run --rm -v "$PWD:/repo:ro" -v "$report_dir:/report" ghcr.io/gitleaks/gitleaks:v8.24.3 git --redact=100 --no-banner --report-format json --report-path /report/findings.json /repo || status=$?
          if [ -f "$report_dir/findings.json" ]; then
            jq -r '.[] | [.RuleID, .File, (.StartLine|tostring), .Commit] | @tsv' "$report_dir/findings.json"
            {
              echo "### Secret scan · findings by rule"
              echo
              echo '| Rule | Findings |'
              echo '| --- | ---: |'
              jq -r 'group_by(.RuleID)[] | "| " + .[0].RuleID + " | " + (length|tostring) + " |"' "$report_dir/findings.json"
              echo
              echo "Historical findings remain blocking until verified or remediated."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - uses: actions/setup-node@v7
        if: ${{ always() }}
        with:
          node-version: '26'

      - name: "📋 Consolidar falhas · security"
        if: ${{ always() }}
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/ci/consolidate-steps.mts

  # ============================================================================
  # 7. Contratos, Smoke & Diagnósticos
  # ============================================================================
  terminal:
    if: inputs.security == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "🧪 Offline lifecycle and configuration tests"
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: |
            bash -n infra/terminal/startup.sh
            python3 -m unittest discover -s infra/terminal -p 'test_*.py' -v
      - name: "🐳 Build and verify CLI tools without production credentials"
        run: |
          docker build -t photointel-terminal-test infra/terminal
          docker run --rm --entrypoint bash photointel-terminal-test -ec '
            test "$(id -un)" = rod
            test "$(id -u)" = 1000
            test "$(id -g)" = 1000
            test -w /home/rod
            for tool in gcloud jq awk ssh sshd git tmux rsync python3 psql sqlite3 rg fzf; do
              command -v "$tool"
            done
            gcloud version
          '

  notify-tests:
    if: inputs.python == 'true' || inputs.security == 'true'
    name: "📱 API + Actions tests"
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      AUTH_MODE: local
      NOTIFY_JOB_EVENTS_ENABLED: 'false'
      NOTIFY_DEVICE_ID: ''
      NOTIFY_TOKEN: ''
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "🐍 UV"
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.23'
          enable-cache: true
      - name: "🐍 Python"
        run: uv python install 3.12
      - name: "📦 Dependencies"
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: uv sync --frozen --group ingest
      - name: "🧪 Notify! API and Actions"
        run: |
          uv run --no-sync pytest -q tests/test_job_notify.py tests/test_sentry_observability.py tests/test_job_observability.py
          python3 -m unittest discover -s infra/gcp/tests -p test_notify.py -v
          python3 -m unittest discover -s infra/gcp/tests -p test_telegram_action.py -v
      - name: "🔍 Lint"
        run: >-
          uv run --no-sync ruff check
          apps/api/src/photointel/services/job_notify.py
          apps/api/src/photointel/services/worker.py
          apps/api/src/photointel/services/task_runner.py
          apps/api/src/photointel/routers/operations.py
          tests/test_job_notify.py
          tests/test_sentry_observability.py
          apps/api/src/photointel/sentry_observability.py
          apps/api/src/photointel/routers/observability.py
      - name: "🧬 Typecheck Sentry"
        run: >-
          uv run --no-sync mypy
          apps/api/src/photointel/sentry_observability.py
          apps/api/src/photointel/routers/observability.py
          apps/api/src/photointel/services/worker.py

  env-contract:
    if: inputs.frontend_matrix != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: "26"}
      - name: "TF · Test shared ENV parser"
        run: node --experimental-strip-types --test packages/env/tests/*.test.mts

  sdk-contract:
    if: inputs.frontend_matrix != '[]'
    name: "🧬 Generate · ${{ matrix.app }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [web, manage]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: "📦 Install locked dependencies"
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: "🧬 Generate Hey API SDK"
        run: npm run generate:api
      - name: "🧪 Typecheck generated SDK consumers"
        run: npm run typecheck
      - name: "🔍 Verify generated SDK"
        run: node ../../scripts/ci/verify-sdk.mts "${{ matrix.app }}"

  backend-smoke:
    if: inputs.py_api == 'true' || inputs.integration == 'true'
    name: "🐍 Unit + iCloud integration"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: photointel
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: photointel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U photointel -d photointel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://photointel:ci-only@127.0.0.1:5432/photointel
      STORAGE_BACKEND: local
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "🧰 Python and uv"
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.23'
          enable-cache: true
      - name: "🐍 Python 3.12"
        run: uv python install 3.12
      - name: "📦 Sync locked dependencies"
        run: uv sync --frozen --group ingest
      - name: "🧪 Worker, sessions and correlation"
        run: >
          uv run --no-sync pytest -q
          tests/test_backend_contention.py
          tests/test_session_store.py
          tests/test_icloud_web_auth.py
          tests/test_job_observability.py
          tests/test_telegram_notify.py
          tests/test_responsive_media.py
          tests/test_private_media_streaming.py
          tests/test_media_url_versions.py
          tests/test_foundation_storage.py
          tests/test_download_integrity_v11.py
          tests/test_auto_preview_repair.py
      - name: "🗄️ Enable PostgreSQL extensions"
        run: >
          PGPASSWORD=ci-only psql -h 127.0.0.1 -U photointel
          -d photointel
          -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'
      - name: "🧪 iCloud lease integration"
        run: >
          uv run --no-sync pytest -q tests/integration/test_discovery_pipeline_v11.py
          -k 'contention_does_not_consume_manifest_attempts or catalog_preview_audit or expired_icloud_media_url_is_refreshed_once or refresh_refuses_changed_icloud_representation'
      - name: "🗃 Prepare isolated integration schema"
        run: uv run --no-sync alembic -c infra/migrations/alembic.ini upgrade head
      - name: "🛠 Automatic preview repair integration"
        run: uv run --no-sync pytest -q tests/integration/test_api.py -k automatic_preview_repair

  preview-audit:
    if: inputs.py_api == 'true' || inputs.front_web == 'true'
    name: "🌐 Preview audit UI"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "🧪 Install and validate preview UI"
        uses: rodkisten/github/execute@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          working-directory: apps/web
          node-version: '26'
          package-manager: npm
          script: |
            npm run typecheck
            npm test -- src/test/operations.test.tsx

  icloud-contract:
    if: (inputs.event_name == 'workflow_dispatch' && inputs.scope == 'icloud') || (inputs.event_name != 'workflow_dispatch' && inputs.security == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: "Unit contracts without credentials"
        run: python3 -m unittest discover -s infra/gcp/tests -p test_icloud_setup.py -v
      - name: "Verify official gcloud archive and isolated Linux installation"
        if: inputs.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PY'
          import importlib.util
          import subprocess
          import tempfile
          from pathlib import Path
          from unittest.mock import patch
          spec = importlib.util.spec_from_file_location("icloud_terminal", "infra/scripts/icloud_terminal.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with tempfile.TemporaryDirectory() as temporary:
              with patch.object(module.shutil, "which", return_value=None), patch.object(
                  module.Path, "home", return_value=Path(temporary)
              ), patch.object(module, "_known_sdk_binaries", return_value=()):

                  executable = module.ensure_gcloud()
              result = subprocess.run([executable, "--version"], capture_output=True, text=True, check=True)
              assert module.SDK_VERSION in result.stdout
          print("Official SDK checksum, safe extraction and executable verified; no credentials used.")
          PY

  log-diagnostics:
    if: (inputs.event_name == 'workflow_dispatch' && inputs.scope == 'diagnostics') || (inputs.event_name != 'workflow_dispatch' && inputs.security == 'true')
    name: "🧪 Validate log diagnostics and gcloud CLI"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Shell syntax"
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: bash -n scripts/ci/pretty-logs.sh scripts/ci/test-pretty-logs.sh
      - name: "Diagnostics and exit code tests"
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: bash scripts/ci/test-pretty-logs.sh
      - name: "Python and Node.js syntax highlighting"
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: python3 -m unittest scripts.ci.test_highlight_output -v
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: "Context selection regression tests"
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: node scripts/ci/select-context.test.ts
      - name: "Shared diagnostic catalog contract"
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: python3 -m unittest scripts.ci.test_diagnostic_catalog -v
      - name: "Python diagnostic syntax"
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: python3 -m py_compile scripts/ci/gcloud_diagnostics.py
      - name: "Python cloud_cli contract tests"
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: python3 -m unittest discover -s infra/gcp/tests -p 'test_cloud_cli.py' -v
      - name: "Install Google Cloud CLI"
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: 'beta'
      - name: "Validate real gcloud CLI output (no credentials)"
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/pretty-logs.sh
          ci_run "gcloud CLI version" gcloud --version
          ci_run "gcloud CLI command discovery" gcloud help run
          ci_run "gcloud CLI diagnostics" gcloud help iam
          ci_run "PhotoIntel Python CLI bridge" python3 -m infra.gcp.cloud_cli --project photointel -- run services list --help
          echo "GCloud CLI validated without authentication or deployment."

  compose-check:
    if: inputs.event_name == 'workflow_dispatch' && inputs.scope == 'compose'
    name: "🐳 Check"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: photointel-compose-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_PARALLEL_LIMIT: '1'
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@v10.3.3
        with: {version: '0.12.23', enable-cache: true}
      - run: uv python install 3.12
      - uses: actions/setup-node@v7
        with: {node-version: '26', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: |
          make setup
          git diff --exit-code -- uv.lock apps/web/package-lock.json
          python3 infra/scripts/validate-compose.py --phase configuration
      - id: builder
        uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/minio.Dockerfile
          tags: photointel-minio:local
          load: true
          push: false
          cache-from: type=gha,scope=photointel-minio
          cache-to: type=gha,mode=max,scope=photointel-minio,ignore-error=true
      - env:
          BUILDX_BUILDER: ${{ steps.builder.outputs.name }}
        run: |
          make dev
          uv run python infra/scripts/validate-compose.py --phase startup --expected-assets 0
      - run: |
          make migrate
          make seed ASSETS=16
          uv run python infra/scripts/validate-compose.py --phase seeded --expected-assets 16
      - run: |
          make seed ASSETS=16
          uv run python infra/scripts/validate-compose.py --phase repeated --expected-assets 16 --compare seeded
      - env:
          BUILDX_BUILDER: ${{ steps.builder.outputs.name }}
        run: |
          make stop
          make dev
          uv run python infra/scripts/validate-compose.py --phase restarted --expected-assets 16 --compare seeded
      - if: always()
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: python3 infra/scripts/validate-compose.py --phase final-health
      - if: always()
        run: |
          if test -f .env; then
            bash infra/scripts/compose.sh down --remove-orphans
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: developer-compose-validation
          path: reports/compose-validation/
          if-no-files-found: warn
          retention-days: 14

  bootstrap-check:
    if: inputs.event_name == 'workflow_dispatch' && inputs.scope == 'bootstrap'
    name: "🧰 Check"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: photointel
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: photointel
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U photointel -d photointel"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      AUTH_MODE: local
      DATABASE_URL: postgresql+asyncpg://photointel:ci-only@127.0.0.1:5432/photointel
      STORAGE_BACKEND: s3
      STORAGE_ENDPOINT: http://127.0.0.1:9000
      STORAGE_BUCKET: photointel-ci-private
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: ci-access
      STORAGE_SECRET_KEY: ci-only-not-a-production-secret
      TEMP_DIRECTORY: /tmp/photointel-ci-processing
      ICLOUD_ENABLED: 'false'
      GPU_ENABLED: 'false'
      INFERENCE_BACKEND: test
      UV_CACHE_DIR: /tmp/photointel-uv-cache
      npm_config_cache: /tmp/photointel-npm-cache
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@v10.3.3
        with: {version: '0.12.23'}
      - uses: actions/setup-node@v7
        with: {node-version: '26'}
      - run: mkdir -p reports packages/contracts
      - id: python_install
        continue-on-error: true
        run: |
          uv python install 3.12
          if test -s uv.lock; then
            uv sync --frozen --group ingest
          else
            uv sync --group ingest
          fi
      - id: node_install
        continue-on-error: true
        run: |
          if ! node scripts/ci/check-lock-sync.mts apps/web; then
            npm --prefix apps/web install --package-lock-only --ignore-scripts
          fi
          npm --prefix apps/web ci
      - id: python_lint
        if: steps.python_install.outcome == 'success'
        continue-on-error: true
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: uv run --no-sync ruff check . --output-format=github
      - id: python_types
        if: steps.python_install.outcome == 'success'
        continue-on-error: true
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: uv run --no-sync mypy apps/api/src gpu bridges
      - id: python_tests
        if: steps.python_install.outcome == 'success'
        continue-on-error: true
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: uv run --no-sync pytest -m 'not integration and not gpu and not e2e' --junitxml=reports/unit.xml
      - id: web_lint
        if: steps.node_install.outcome == 'success'
        continue-on-error: true
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: npm --prefix apps/web run lint
      - id: web_types
        if: steps.node_install.outcome == 'success'
        continue-on-error: true
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: npm --prefix apps/web run typecheck
      - id: web_tests
        if: steps.node_install.outcome == 'success'
        continue-on-error: true
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: npm --prefix apps/web test -- --reporter=default --reporter=junit --outputFile=../../reports/frontend-unit.xml
      - id: web_build
        if: steps.node_install.outcome == 'success'
        continue-on-error: true
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: npm --prefix apps/web run build
