name: "🚀 Manage · Publish"
run-name: "🚀 Manage · ${{ inputs.mode || 'apply' }} · ${{ github.ref_name }}"
on:
  push:
    branches: [main]
    paths:
      - "apps/manage/**"
      - "infra/scripts/deploy_manage.py"
      - ".github/workflows/manage-deploy.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan Access and Worker or publish the management panel"
        type: choice
        options: [plan, apply]
        default: plan
        required: true
permissions:
  contents: read
concurrency:
  group: photointel-manage-production
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.MANAGE_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CONFIRM_PROJECT: photointel
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/manage/package-lock.json
      - name: "⚙️ Prepare production configuration"
        id: config
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: photointel
          release-sha: ${{ github.sha }}
      - name: "🔐 Authenticate GCP WIF"
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.service_account }}
      - name: "🧰 Setup gcloud"
        uses: google-github-actions/setup-gcloud@v3
      - name: "📦 Install management app"
        run: npm --prefix apps/manage ci
      - name: "🧪 Typecheck and security tests"
        run: |
          npm --prefix apps/manage run typecheck
          npm --prefix apps/manage test
      - name: "🏗 Build management assets"
        if: ${{ inputs.mode != 'plan' }}
        run: npm --prefix apps/manage run build
      - name: "☁️ Reconcile Access, domain and Worker"
        run: python3 infra/scripts/deploy_manage.py "${{ inputs.mode || 'apply' }}"
      - name: "🧹 Remove temporary production config"
        if: always()
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup
