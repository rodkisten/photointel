name: "🔮 RV · 🧹 Frontends · ESLint + Prettier Fix"
run-name: "🧹 Fix · ${{ inputs.target }} · ${{ inputs.mode }} · ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which target should be fixed?"
        type: choice
        required: true
        default: all
        options:
          - all
          - web
          - manage
          - packages
      mode:
        description: "Only changed files, or every tracked frontend file?"
        type: choice
        required: true
        default: changed
        options:
          - changed
          - all
      base_ref:
        description: "Optional base commit/ref (default: last 10 commits)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: photointel-frontend-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    name: "🧹 Fix selected frontend files"
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: "📥 Checkout branch and history"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            apps/manage/package-lock.json
            packages/**/package-lock.json

      - name: "📦 Install shared Prettier"
        uses: rodkisten/github/console-run@main
        with:
          command: npm ci --ignore-scripts --no-audit --no-fund

      - name: "📦 Install Web ESLint"
        if: inputs.target == 'web' || inputs.target == 'all'
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund

      - name: "📦 Install Manage ESLint"
        if: inputs.target == 'manage' || inputs.target == 'all'
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: npm --prefix apps/manage ci --ignore-scripts --no-audit --no-fund

      - name: "📦 Install Packages dependencies"
        if: inputs.target == 'packages' || inputs.target == 'all'
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: |
            for lockfile in packages/*/package-lock.json; do
              if [ -f "$lockfile" ]; then
                npm --prefix "$(dirname "$lockfile")" ci --ignore-scripts --no-audit --no-fund
              fi
            done

      - name: "🧹 ESLint --fix + Prettier --write"
        id: format
        env:
          TARGET: ${{ inputs.target }}
          MODE: ${{ inputs.mode }}
          BASE_REF: ${{ inputs.base_ref }}
        run: bash scripts/format-changed-frontends.sh

      - name: "🎨 Validate universal formatting"
        uses: rodkisten/github/actions/format@main
        with:
          mode: check
          scope: ${{ inputs.mode }}
          base: ${{ inputs.base_ref || 'origin/main' }}
          lint: 'false'
          results-file: ${{ runner.temp }}/rod-format-results.json

      - name: "💾 Commit and push fixes"
        if: steps.format.outputs.has_files == 'true'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add --pathspec-from-file="$RUNNER_TEMP/photointel-format-paths.nul" --pathspec-file-nul
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git config user.name "ploocky[bot]"
          git config user.email "5784353+github-actions[bot]@users.noreply.github.com"
          git diff --cached --stat
          git commit -m "style(frontend): auto-fix selected files with ESLint and Prettier"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"

      - name: "🔍 Report non-fixable issues"
        if: steps.format.outputs.validation_ok != 'true'
        run: |
          echo "::error::ESLint or Prettier reported remaining issues. Applied fixes were committed where possible."
          exit 1
