name: "Temporary PhotoIntel PWA formatter"
on:
  push:
    branches: [feat/offline-pwa-brand-ios]
    paths:
      - apps/web/public/sw.js
      - .github/workflows/tmp-format-pwa.yml

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write apps/web/public/sw.js
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(pwa): format CDN cache with Prettier"
          git push
