name: "TF · Media Imagor Plan"
run-name: "TF · Imagor plan · ${{ github.ref_name }}"
on:
  workflow_dispatch:
    inputs:
      imagor_image:
        description: "Immutable media-imagor Artifact Registry image digest"
        type: string
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: photointel-terraform-production
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Verify exact immutable image"
        env:
          IMAGE: ${{ inputs.imagor_image }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^us-central1-docker\.pkg\.dev/photointel/photointel/media-imagor@sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::Expected immutable photointel media-imagor digest"; exit 1;
          }
      - name: "Prepare production configuration"
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: photointel
          release-sha: ${{ github.sha }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/799387180206/locations/global/workloadIdentityPools/github-bootstrap/providers/photo-intelligence-bootstrap
          service_account: photointel-terraform@photointel.iam.gserviceaccount.com
          project_id: photointel
      - uses: google-github-actions/setup-gcloud@v3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - name: "Initialize remote state"
        working-directory: infra/terraform/environments/production
        env:
          BUCKET: ${{ vars.TF_STATE_BUCKET || 'photointel-terraform-state' }}
          PREFIX: ${{ vars.TF_STATE_PREFIX || 'photointel/production' }}
        run: terraform init -input=false -backend-config="bucket=$BUCKET" -backend-config="prefix=$PREFIX"
      - name: "Prepare current media and API release"
        run: |
          set -euo pipefail
          bucket="$(python3 -c 'import json; print(json.load(open("infra/gcp/config.local.json"))["storage_bucket"])')"
          python3 -m infra.terraform.media_release prepare --image-sha "" --bucket "$bucket"
          python3 -m infra.scripts.cloudflare_setup sync
          python3 -m infra.terraform.api_release prepare --image-sha "" --targets api,jobs
      - name: "Plan Imagor without applying"
        working-directory: infra/terraform/environments/production
        env:
          TF_VAR_enable_media_imagor: "true"
          TF_VAR_media_imagor_image: ${{ inputs.imagor_image }}
        run: |
          set -euo pipefail
          terraform plan -input=false -lock-timeout=5m -out=tfplan -no-color
          terraform show -json tfplan > tfplan.json
      - name: "Reject deletion, replacement, and unexpected mutations"
        working-directory: infra/terraform/environments/production
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path("tfplan.json").read_text())
          allowed = {
              "google_cloud_run_v2_service.media_imagor[0]",
              "google_secret_manager_secret_iam_member.media_imagor[0]",
          }
          changes = []
          for resource in plan.get("resource_changes", []):
              actions = resource["change"]["actions"]
              if actions == ["no-op"]:
                  continue
              changes.append((resource["address"], actions))
              if resource["address"] not in allowed or actions != ["create"]:
                  raise SystemExit(f"::error::Unexpected change: {resource['address']}: {actions}")
          if not changes:
              raise SystemExit("::error::Imagor opt-in plan unexpectedly creates nothing")
          summary = "## Imagor Terraform plan (no apply)\n\n" + "\n".join(
              f"- `{address}`: {', '.join(actions)}" for address, actions in changes
          ) + "\n\nOnly the new Imagor service and its scoped secret binding may be created.\n"
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          print(summary)
          PY
      - name: "Clean temporary configuration"
        if: always()
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup
