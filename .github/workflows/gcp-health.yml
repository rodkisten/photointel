name: "🩺 Diagnose Cloud Run"

on:
  push:
    branches: [main]
    paths: ['.github/workflows/gcp-health.yml']
  workflow_dispatch:

permissions: {contents: read}

jobs:
  diagnose:
    name: "🩺 API + Neon + R2"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "📥 Código"
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "⚙ Env"
        id: config
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: photointel
          release-sha: ${{ github.sha }}

      - name: "🔐 GCP Login"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.service_account }}

      - name: "🧰 Gcloud"
        uses: google-github-actions/setup-gcloud@v2

      - name: "🔧 Configure verified PostgreSQL CA bundle"
        run: |
          python3 - <<'PY'
          import json,subprocess
          def call(args):
              r=subprocess.run(['gcloud',*args,'--project','photointel','--quiet'],capture_output=True,text=True)
              if r.returncode: raise RuntimeError('Cloud Run TLS configuration update failed')
              return r.stdout
          value='DATABASE_TLS_CA_FILE=/etc/ssl/certs/ca-certificates.crt'
          call(['run','services','update','photointel-api','--region','us-central1','--update-env-vars',value])
          print('API TLS CA bundle configured.')
          for j in json.loads(call(['run','jobs','list','--region','us-central1','--format=json'])):
              name=j.get('metadata',{}).get('name','').rsplit('/',1)[-1]
              if name.startswith('photointel-') and name!='photointel-diagnose-db':
                  call(['run','jobs','update',name,'--region','us-central1','--update-env-vars',value])
                  print('Job TLS configuration updated:',name)
          PY

      - name: "🩺 Cloud Run status + HTTP health"
        run: python3 infra/gcp/diagnose_api_connectivity.py --project photointel

      - name: "🔍 Startup errors (sanitized)"
        if: ${{ always() && steps.config.outcome == 'success' }}
        run: python3 infra/gcp/diagnose_startup.py --project photointel

      - name: "🧹 Config"
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup
