name: "🩺 Diagnose Cloud Run"

on:
  push:
    branches: [main]
    paths: ['.github/workflows/gcp-health.yml']
  workflow_dispatch:

permissions: {contents: read}

jobs:
  diagnose:
    name: "🩺 API + Neon + R2"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "📥 Código"
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "⚙ Env"
        id: config
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: photointel
          release-sha: ${{ github.sha }}

      - name: "🔐 GCP Login"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.service_account }}

      - name: "🧰 Gcloud"
        uses: google-github-actions/setup-gcloud@v2

      - name: "🔍 Correlated API failure"
        run: |
          python3 - <<'PY'
          import json, subprocess
          flt = 'resource.type="cloud_run_revision" AND resource.labels.service_name="photointel-api"'
          r = subprocess.run(['gcloud','logging','read',flt,'--project','photointel','--freshness=1h','--limit=250','--format=json'], capture_output=True,text=True,check=True)
          for e in json.loads(r.stdout):
              p = e.get('jsonPayload', {})
              if not p:
                  try: p=json.loads(e.get('textPayload','{}'))
                  except ValueError: continue
              if not isinstance(p,dict): continue
              if p.get('correlation_id') == '9cb9c931-f117-4b65-9fc1-e453781b4dbc' or p.get('level') in ('error','critical'):
                  print(json.dumps({k:p[k] for k in ('event','exception_type','correlation_id','error_code','path','status_code') if k in p}))
          PY

      - name: "🔍 Runtime dependency selection"
        run: |
          python3 - <<'PY'
          import json,subprocess
          d=json.loads(subprocess.run(['gcloud','run','services','describe','photointel-api','--region','us-central1','--project','photointel','--format=json'],capture_output=True,text=True,check=True).stdout)
          for c in d.get('spec',{}).get('template',{}).get('spec',{}).get('containers',[]):
              print(json.dumps({'runtime_image': c.get('image')}))
              for e in c.get('env',[]):
                  if e.get('name') in ('DATABASE_URL','APP_ENV','EXECUTION_PLATFORM','STORAGE_BACKEND','DATABASE_TLS_REQUIRED'):
                      v=e.get('value','')
                      print(json.dumps({'name':e['name'],'secret_ref':e.get('valueFrom',{}).get('secretKeyRef'),'scheme':v.split(':')[0] if e['name']=='DATABASE_URL' else v}))
          PY

      - name: "🔍 Neon connection diagnosis"
        env:
          CONFIRM_PROJECT: photointel
          MIGRATION_MODE: diagnose
        run: bash infra/gcp/release.sh migrate

      - name: "🔍 Runtime PostgreSQL connection"
        run: |
          python3 -m venv /tmp/photointel-runtime-probe
          /tmp/photointel-runtime-probe/bin/pip install --quiet -r infra/gcp/migration-requirements.txt asyncpg
          /tmp/photointel-runtime-probe/bin/python - <<'PY'
          import asyncio,json,subprocess,sys
          from types import SimpleNamespace
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text
          sys.path.insert(0,'apps/api/src')
          from photointel.db_connection import database_connection_options
          d=json.loads(subprocess.run(['gcloud','run','services','describe','photointel-api','--region','us-central1','--project','photointel','--format=json'],capture_output=True,text=True,check=True).stdout)
          env={x['name']:x for x in d['spec']['template']['spec']['containers'][0]['env']}
          ref=env['DATABASE_URL']['valueFrom']['secretKeyRef']
          url=subprocess.run(['gcloud','secrets','versions','access',ref['key'],'--secret',ref['name'],'--project','photointel'],capture_output=True,text=True,check=True).stdout.strip()
          opts=SimpleNamespace(database_url=url,migration_database_url=None,database_pool_mode='transaction',database_require_tls=True,database_tls_ca_file=None)
          async def probe():
              engine=None
              try:
                  u,args=database_connection_options(opts)
                  engine=create_async_engine(u,connect_args=args)
                  async with engine.connect() as conn:
                      await conn.execute(text('SELECT 1'))
                  print('RUNTIME_DATABASE_SECRET_CONNECTION=passed')
              except Exception as e:
                  markers=['password authentication failed','root certificate','certificate verify failed','connection refused','timeout','channel_binding','could not translate']
                  print(json.dumps({'runtime_connection':'failed','exception_type':type(e).__name__,'signals':[m for m in markers if m in str(e).lower()]}))
              finally:
                  if engine: await engine.dispose()
          asyncio.run(probe())
          PY

      - name: "🩺 Cloud Run status + HTTP health"
        run: python3 infra/gcp/diagnose_api_connectivity.py --project photointel

      - name: "🔍 Startup errors (sanitized)"
        if: ${{ always() && steps.config.outcome == 'success' }}
        run: python3 infra/gcp/diagnose_startup.py --project photointel

      - name: "🧹 Config"
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup
