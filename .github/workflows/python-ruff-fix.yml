name: "🧹 Ruff autofix · security PR"
on:
  push:
    branches: [fix/python-security-dependencies-20261115]
    paths:
      - ".github/workflows/python-ruff-fix.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Apply safe Ruff fixes
        run: |
          uv run ruff check . --fix
          uv run ruff format .
          uv run ruff check .
      - name: Commit all Ruff changes together
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'style(python): apply Ruff fixes as one block [skip ci]'
          git push
