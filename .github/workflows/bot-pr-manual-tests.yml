name: "🤖 Dependency PR · Manual tests"
run-name: "🤖 Manual tests · PR #${{ github.event.pull_request.number }}"
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  pull-requests: write
jobs:
  comment:
    name: "🔗 Publish manual workflow links"
    if: >-
      ${{ github.event.pull_request.user.login == 'dependabot[bot]' ||
          github.event.pull_request.user.login == 'renovate[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: "📌 Comment with branch-specific instructions"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // pull_request_target: API only. Never check out or execute PR code.
            const pr = context.payload.pull_request;
            const marker = '<!-- photointel-dependency-manual-tests -->';
            const { owner, repo } = context.repo;
            const changed = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const paths = changed.map(file => file.filename);
            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {
              owner, repo, per_page: 100,
            });
            const wanted = new Set(['ci.yml']);
            for (const path of paths) {
              if (path.startsWith('infra/terraform/')) wanted.add('tf-validate.yml');
              if (path.startsWith('apps/web/') || path.startsWith('apps/manage/') ||
                  path.startsWith('infra/cloudflare/')) wanted.add('deploy-worker.yml');
              if (path.startsWith('apps/api/') || path.startsWith('tests/')) wanted.add('backend-smoke.yml');
              if (path.startsWith('infra/gcp/')) wanted.add('gcp-validation.yml');
              if (path.startsWith('packages/env/')) wanted.add('tf-env-package.yml');
              if (path.startsWith('apps/api/') || path.startsWith('infra/migrations/'))
                wanted.add('gcp-migrate.yml');
              if (path.startsWith('infra/gcp/')) wanted.add('gcp-bootstrap.yml');
              if (path.startsWith('gpu/')) wanted.add('modal-gpu-deploy.yml');
              if (path.startsWith('scripts/ci/')) wanted.add('ci-pretty-logs.yml');
              if (path.startsWith('.github/workflows/'))
                wanted.add(path.split('/').pop());
            }
            const available = workflows.filter(w =>
              wanted.has(w.path.split('/').pop()) && w.state === 'active'
            );
            const links = available.map(w => {
              const url = `https://github.com/${owner}/${repo}/actions/workflows/${encodeURIComponent(w.path.split('/').pop())}`;
              return `- [▶ ${w.name}](${url})`;
            });
            const branch = pr.head.ref;
            const body = [
              marker,
              '### 🧪 Testes manuais de dependências',
              '',
              'Este PR do Renovate/Dependabot **não executa CI automaticamente**.',
              '',
              '**Como testar esta branch:**',
              '1. Abra um workflow abaixo e clique em **Run workflow**.',
              `2. No seletor **Use workflow from**, escolha a branch \`${branch}\`.`,
              '3. Selecione o contexto desejado. No **CI · Validate**, o padrão é `all`.',
              '4. Execute e confira o resultado antes de fazer merge.',
              '',
              ...links,
              '',
              '> O GitHub só permite execução manual em workflows com `workflow_dispatch` disponíveis na branch escolhida. Workflows de produção podem exigir confirmação e restringir a branch `main`.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.find(c =>
              c.user?.type === 'Bot' && c.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body,
              });
            }
