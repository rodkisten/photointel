name: "🎛 SPA Validation"
run-name: "🎛 SPA · ${{ github.event_name }}"

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'infra/cloudflare/cloud-run-proxy/**'
      - 'infra/scripts/prepare_workflow_env.py'
      - 'apps/api/src/photointel/routers/operations.py'
      - '.github/workflows/spa-validation.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'infra/cloudflare/cloud-run-proxy/**'
      - 'infra/scripts/prepare_workflow_env.py'
      - 'apps/api/src/photointel/routers/operations.py'
      - '.github/workflows/spa-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spa-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: "🎛 SPA · lint, types, tests, build"
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: "📦 Install"
        run: npm --prefix apps/web ci
      - name: "🧹 Lint"
        run: npm --prefix apps/web run lint
      - name: "📐 TypeScript"
        run: npm --prefix apps/web run typecheck
      - name: "🧪 UI tests"
        run: npm --prefix apps/web test
      - name: "🧪 Offline service worker tests"
        run: npm --prefix apps/web run test:pwa
      - name: "🧪 Cloudflare Worker tests"
        run: node --test infra/cloudflare/cloud-run-proxy/worker.test.mjs
      - name: "📦 Vite production build"
        run: npm --prefix apps/web run build
