name: "🔮 RV · 🚀 Release · Console"
run-name: "🚀 Release · ${{ inputs.action || 'check' }} · ${{ inputs.target || 'all' }} · ${{ inputs.source || 'main' }}"
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Ação"
        type: choice
        options: [plan, build, deploy, build-and-deploy]
        default: build-and-deploy
      target:
        description: "Destino"
        type: choice
        options: [api, media, web, manage, all]
        default: manage
      source:
        description: "Origem"
        type: choice
        options: [main, last]
        default: main
      sha:
        description: "SHA opcional"
        type: string
        default: ''
      engine:
        description: "Motor do console"
        type: choice
        options: [legacy, preview]
        default: legacy
      confirm:
        description: "Confirmar"
        type: boolean
        default: true
        
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: photointel-release-console
  cancel-in-progress: false
  
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ inputs.target == 'all' && fromJSON('["api","media","web","manage"]') || fromJSON(format('["{0}"]', inputs.target)) }}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v7
        with: {node-version: '26'}

      - name: Native offline preview
        if: inputs.engine == 'preview'
        env:
          TARGET: ${{ matrix.target }}
          ACTION: ${{ inputs.action }}
          SOURCE: ${{ inputs.source }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          if [[ "$SOURCE" != main ]]; then echo 'Preview requires main or explicit SHA'; exit 1; fi
          args=(--target "$TARGET" --action "$ACTION")
          if [[ -n "$REQUESTED_SHA" ]]; then args+=(--sha "$REQUESTED_SHA"); fi
          node scripts/ci/cloud-run/release-preview.ts "${args[@]}"
      - name: "🔐 Authenticate Ploocky GitHub App"
        if: inputs.engine != 'preview'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID || vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-actions: write
        
      - if: inputs.engine != 'preview'
        id: config
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: photointel
          release-sha: ${{ github.sha }}
      - uses: google-github-actions/auth@v3
        if: inputs.engine != 'preview'
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.service_account }}
      - uses: google-github-actions/setup-gcloud@v3
        if: inputs.engine != 'preview'
      - name: "🚀 Executar"
        if: inputs.engine != 'preview'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTION: ${{ inputs.action }}
          TARGET: ${{ matrix.target }}
          SOURCE: ${{ inputs.source }}
          REQUESTED_SHA: ${{ inputs.sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          source scripts/ci/pretty-logs.sh

          export BOT_TOKEN="${{ steps.app-token.outputs.token }}"
          
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
      
          ci_run "Release console" python3 -m infra.terraform.release_console
      - if: always() && inputs.engine != 'preview'
        uses: ./.github/actions/gcp-config
        with: {mode: cleanup}
