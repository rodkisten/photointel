name: 🔮 RV · Security lock refresh
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Update and validate lockfile
        run: |
          uv lock --upgrade-package certifi --upgrade-package filelock --upgrade-package opentelemetry-api --upgrade-package pillow --upgrade-package pyasn1 --upgrade-package setuptools
          uv lock --check
          uv export --frozen --no-dev --no-emit-project > /tmp/runtime.txt
          uvx pip-audit -r /tmp/runtime.txt --disable-pip
          uv export --frozen --no-dev --group gpu --no-emit-project > /tmp/gpu.txt
          uvx pip-audit -r /tmp/gpu.txt --disable-pip
      - name: Commit audited lockfile
        run: |
          if git diff --quiet -- uv.lock; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'fix(security): regenerate audited Python lockfile'
          git push origin HEAD:main
