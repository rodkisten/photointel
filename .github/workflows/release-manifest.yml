name: "🧾 [RELEASE] Generate provenance"
on:
  workflow_dispatch:
    inputs:
      container_digest:
        description: Optional immutable container digest (sha256:...), not an image tag
        required: false
        type: string
      modal_deployment_id:
        description: Optional already-deployed Modal ID; no deployment is performed
        required: false
        type: string
permissions:
  contents: read
jobs:
  manifest:
    name: "🧾 [RELEASE] manifest"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Código"
        id: notify_observed_001
        uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: "🔔 [NOTIFY] 📥 Código"
        if: ${{ always() && (steps.notify_observed_001.outcome == 'success' || steps.notify_observed_001.outcome == 'failure' || steps.notify_observed_001.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "📥 Código"
          outcome: ${{ steps.notify_observed_001.outcome }}
      - name: "🧪 Testes"
        id: notify_observed_002
        env:
          CONTAINER_DIGEST: ${{ inputs.container_digest }}
          MODAL_DEPLOYMENT_ID: ${{ inputs.modal_deployment_id }}
        run: |
          arguments=(--ci-run-id "$GITHUB_RUN_ID")
          if [ -n "$CONTAINER_DIGEST" ]; then
            arguments+=(--container-digest "$CONTAINER_DIGEST")
          fi
          if [ -n "$MODAL_DEPLOYMENT_ID" ]; then
            arguments+=(--modal-deployment-id "$MODAL_DEPLOYMENT_ID")
          fi
          python3 infra/scripts/release-manifest.py "${arguments[@]}"
      - name: "🔔 [NOTIFY] 🧪 Testes"
        if: ${{ always() && (steps.notify_observed_002.outcome == 'success' || steps.notify_observed_002.outcome == 'failure' || steps.notify_observed_002.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧪 Testes"
          outcome: ${{ steps.notify_observed_002.outcome }}
      - name: "📦 Testes"
        id: notify_observed_003
        uses: actions/upload-artifact@v4
        with:
          name: release-provenance-${{ github.sha }}
          path: reports/release-manifest.json
          retention-days: 90

      - name: "🔔 [NOTIFY] 📦 Testes"
        if: ${{ always() && (steps.notify_observed_003.outcome == 'success' || steps.notify_observed_003.outcome == 'failure' || steps.notify_observed_003.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "📦 Testes"
          outcome: ${{ steps.notify_observed_003.outcome }}