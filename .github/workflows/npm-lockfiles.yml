name: "📦 npm · Sync lockfiles"
run-name: "📦 Lockfiles · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "package.json"
      - "**/package.json"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "**/package.json"
  workflow_dispatch:
    inputs:
      package_path:
        description: "Package directory for manual run (default: apps/web)"
        required: false
        type: choice
        options:
          - "apps/web"
          - "apps/manage"
        default: "apps/manage"
      target_branch:
        description: "Branch to synchronize (leave empty for selected branch)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-lockfiles-${{ github.event.pull_request.head.ref || inputs.target_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    name: "📦 Regenerate and verify npm lockfiles"
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: "🔎 Validate private key format"
        shell: bash
        env:
          BOT_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess, sys
          key = os.environ["BOT_KEY"].strip().replace("\\n", "\n")
          if not key.startswith("-----BEGIN ") or "PRIVATE KEY-----" not in key:
              print("::error title=Invalid BOT_PRIVATE_KEY::Expected the complete PEM private key, not a token, path, or Base64 blob")
              sys.exit(1)
          result = subprocess.run(["openssl", "pkey", "-noout"], input=key, text=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          if result.returncode:
              print("::error title=Invalid BOT_PRIVATE_KEY::OpenSSL cannot parse the supplied PEM key; re-export the private key from the GitHub App settings")
              sys.exit(1)
          print("Private key format validated; key contents withheld")
          PY
      - name: "🔐 Authenticate Ploocky GitHub App"
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID || vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: "📥 Checkout writable branch"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || inputs.target_branch || github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0
      - name: "🧰 Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "📦 Synchronize tracked npm manifests"
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target="${{ inputs.package_path }}"
            [[ -n "$target" ]] || target="apps/web"
            manifests=("$target/package.json")
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base="${{ github.event.pull_request.base.sha }}"
            else
              base="${{ github.event.before }}"
            fi
            mapfile -d '' manifests < <(git diff --name-only -z "$base" HEAD -- 'package.json' '**/package.json')
          fi
          if (( ${#manifests[@]} == 0 )); then
            echo "### 📦 No package manifests changed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for manifest in "${manifests[@]}"; do
            [[ -f "$manifest" ]] || continue
            dir="$(dirname "$manifest")"
            echo "::group::📦 $manifest"
            (
              cd "$dir"
              npm install --force --package-lock-only --ignore-scripts --no-audit --no-fund
              npm ci --force --dry-run --ignore-scripts --no-audit --no-fund --loglevel=error
            )
            echo "::endgroup::"
          done
      - name: "🔎 Stage only lockfiles"
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git add -- 'package-lock.json' '**/package-lock.json'
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "### 📦 Lockfiles already synchronized" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "### 📦 Lockfiles updated" >> "$GITHUB_STEP_SUMMARY"
            git diff --cached --name-only | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: "💾 Commit lockfile changes"
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git commit -m "chore(deps): sync npm lockfiles"
          branch="${{ github.event.pull_request.head.ref || inputs.target_branch || github.ref_name }}"
          git fetch origin "$branch"
          if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse "origin/$branch")" ]]; then
            echo "::error::Branch advanced during lockfile generation; rerun on latest commit."
            exit 1
          fi
          git push origin "HEAD:$branch"
