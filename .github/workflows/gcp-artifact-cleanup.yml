name: "🔮 RV · 🧹 Artifact cleanup"
run-name: "🧹 Artifact cleanup · ${{ inputs.apply && 'delete' || 'preview' }}"
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [github, gcp]
        default: github
      apply:
        description: "Delete eligible artifacts (false = preview only)"
        type: boolean
        default: false
        required: true
      confirm_project:
        description: "For deletion type photointel (GCP) or rodverse/rodverse (GitHub)"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: photointel-artifact-cleanup
  cancel-in-progress: false
jobs:
  prune:
    if: github.repository == 'rodverse/rodverse' && github.ref == 'refs/heads/main' && inputs.target == 'gcp'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Authenticate GCP"
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/799387180206/locations/global/workloadIdentityPools/github-bootstrap/providers/photo-intelligence-bootstrap
          service_account: photointel-terraform@photointel.iam.gserviceaccount.com
          project_id: photointel
      - uses: google-github-actions/setup-gcloud@v3
      - name: "Verify confirmation"
        env:
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm_project }}
        run: |
          if [[ "$APPLY" == "true" && "$CONFIRM" != "photointel" ]]; then
            echo "::error::Type photointel to authorize deletion"
            exit 1
          fi
      - name: "Inventory and prune (fail closed)"
        env:
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm_project }}
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: |
            args=()
            if [[ "$APPLY" == "true" ]]; then
              args+=(--apply --confirm-project="$CONFIRM")
            fi
            python3 infra/gcp/prune_artifacts.py "${args[@]}"
      - name: "Storage cleanup note"
        run: |
          echo "Cloud Build source archives are expired by the Terraform-managed GCS lifecycle." >> "$GITHUB_STEP_SUMMARY"
          echo "Cloud Build build records are retained: deleting history does not save build compute costs." >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact Registry Terraform cleanup remains in dry-run; do not activate competing policies without a review." >> "$GITHUB_STEP_SUMMARY"

  github-cleanup:
    permissions:
      contents: read
      actions: write
    if: github.repository == 'rodverse/rodverse' && github.ref == 'refs/heads/main' && inputs.target == 'github'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: "🧹 Plan or prune eligible artifacts"
        env:
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm_project }}
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            if (owner !== 'rodverse' || repo !== 'rodverse' || context.ref !== 'refs/heads/main') {
              throw new Error('Cleanup is restricted to rodverse/rodverse main');
            }
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, per_page: 100,
            });
            const runs = new Map();
            for (const artifact of artifacts) {
              const id = artifact.workflow_run?.id;
              if (!id) throw new Error('Artifact has no originating run; refusing ambiguous cleanup');
              if (!runs.has(id)) {
                const {data} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: id});
                runs.set(id, data);
              }
            }
            const rank = artifact => {
              const run = runs.get(artifact.workflow_run.id);
              if (run.status !== 'completed') return 0;
              if (run.conclusion === 'success' && /release.*provenance|release.*manifest/i.test(artifact.name)) return 1;
              if (run.conclusion === 'success') return 2;
              return 3;
            };
            const candidates = artifacts.filter(a => !a.expired).sort((a,b) =>
              rank(a) - rank(b) || Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id);
            const kept = [];
            const names = new Set();
            for (const artifact of candidates) {
              if (kept.length === 3) break;
              if (!names.has(artifact.name)) {
                kept.push(artifact);
                names.add(artifact.name);
              }
            }
            for (const artifact of candidates) {
              if (kept.length === 3) break;
              if (!kept.some(x => x.id === artifact.id)) kept.push(artifact);
            }
            const keepIds = new Set(kept.map(a => a.id));
            const targets = artifacts.filter(a => !keepIds.has(a.id) && runs.get(a.workflow_run.id).status === 'completed' && !/release.*provenance|release.*manifest/i.test(a.name) && Date.parse(a.created_at) < Date.now() - 7 * 86400000).sort((a,b) =>
              Date.parse(a.created_at) - Date.parse(b.created_at));
            core.info(JSON.stringify({
              action: 'cleanup-plan', total: artifacts.length,
              keep: kept.map(a => ({id:a.id,name:a.name,run:a.workflow_run.id,bytes:a.size_in_bytes})),
              deleteCount: targets.length,
            }));
            // On push, check the retention plan without deleting any artifacts.
            if (process.env.APPLY !== 'true') {
              core.info('Read-only push validation: no artifacts will be deleted.');
              return;
            }
            if (process.env.CONFIRM !== 'rodverse/rodverse') throw new Error('Explicit repository confirmation required');
            let deleted = 0, bytes = 0;
            const failures = [];
            for (const artifact of targets) {
              try {
                await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
                deleted++;
                bytes += artifact.size_in_bytes;
                core.info('Deleted ' + artifact.id + ' ' + artifact.name);
              } catch (error) {
                if (error.status === 404) continue; // Already expired/deleted elsewhere.
                failures.push({id:artifact.id,status:error.status ?? 'unknown'});
              }
            }
            const remaining = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, per_page: 100,
            });
            const result = {
              initialCount:artifacts.length, deletedCount:deleted, deletedBytes:bytes,
              remainingCount:remaining.length,
              kept:remaining.map(a => ({id:a.id,name:a.name,run:a.workflow_run?.id,bytes:a.size_in_bytes})),
              failures,
            };
            core.info('CLEANUP_RESULT=' + JSON.stringify(result));
            await core.summary.addHeading('Artifact cleanup')
              .addRaw('Deleted: ' + deleted + '; removed size: ' + (bytes / 1024 / 1024).toFixed(2) + ' MiB.\n\n')
              .addTable([['Kept artifact','ID','Run'], ...result.kept.map(a => [a.name,String(a.id),String(a.run)])])
              .addRaw('\nGitHub storage accounting can take 6–12 hours to refresh.\n')
              .write();
            if (failures.length) throw new Error('Some artifact deletions failed; see cleanup result.');
