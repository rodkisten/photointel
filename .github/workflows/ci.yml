      - name: "🔔 [NOTIFY] ▶️ [RUN] Execute command"
        if: ${{ always() && (steps.notify_observed_008.outcome == 'success' || steps.notify_observed_008.outcome == 'failure' || steps.notify_observed_008.outcome == 'cancelled') }}
        continue-on-error: true
