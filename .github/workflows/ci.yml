name: "🧪 CI · Validate"
run-name: "🧪 CI · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }} · ${{ github.event_name }}"
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'bridges/**'
      - 'gpu/**'
      - 'packages/**'
      - 'tests/**'
      - 'infra/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.env.example'
      - 'cloudbuild.yaml'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      scope:
        description: "Contexto a executar"
        type: choice
        required: true
        default: all
        options: [all, auto, python, frontend, integration, containers, security]
permissions: {contents: read}
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: "🧭 Detectar contexto"
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.scope.outputs.python }}
      frontend: ${{ steps.scope.outputs.frontend }}
      integration: ${{ steps.scope.outputs.integration }}
      containers: ${{ steps.scope.outputs.containers }}
      security: ${{ steps.scope.outputs.security }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "🧭 Selecionar jobs"
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope || 'auto' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          names = ("python", "frontend", "integration", "containers", "security")
          scope = os.environ["SCOPE"]
          if scope == "all":
              selected = set(names)
          elif scope in names:
              selected = {scope}
          else:
              base = os.environ.get("BASE_SHA", "")
              head = os.environ["HEAD_SHA"]
              if not base or set(base) == {"0"}:
                  files = ["*"]
              else:
                  try:
                      result = subprocess.run(
                          ["git", "diff", "--name-only", "-z", f"{base}...{head}"],
                          capture_output=True, check=True,
                      )
                      files = [p.decode() for p in result.stdout.split(b"\\0") if p]
                  except subprocess.CalledProcessError:
                      files = ["*"]
              selected = set()
              for path in files:
                  if path == "*" or path.startswith((".github/workflows/ci.yml", ".github/actions/", "scripts/ci/")):
                      selected.update(names)
                  if path.startswith(("apps/api/", "gpu/", "bridges/", "packages/python/", "tests/")) or path in ("pyproject.toml", "uv.lock"):
                      selected.add("python")
                  if path.startswith(("apps/web/", "packages/ui/", "packages/frontend/")):
                      selected.add("frontend")
                  if path.startswith(("infra/migrations/", "infra/scripts/", "tests/integration/", "apps/api/", "infra/docker/minio.")):
                      selected.add("integration")
                  if path.startswith(("infra/docker/", "cloudbuild.yaml", "apps/api/", "apps/web/")):
                      selected.add("containers")
                  if path.startswith(("pyproject.toml", "uv.lock", "apps/", "gpu/", "bridges/", "packages/", "infra/docker/")):
                      selected.add("security")
              print("Changed files:", *files, sep="\\n  ")
          print("Selected jobs:", ", ".join(sorted(selected)) or "(none)")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              for name in names:
                  output.write(f"{name}={'true' if name in selected else 'false'}\\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("### 🧭 Contexto da CI\\n\\n")
              summary.write(f"Modo: \\x60{scope}\\x60\\n\\n")
              summary.write("Jobs: " + (", ".join(sorted(selected)) or "nenhum") + "\\n")
          PY
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: "🐍 Python · lint, types, unit"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Código"
        continue-on-error: true
        id: notify_observed_002
        uses: actions/checkout@v4
      - name: "🧰 Config"
        continue-on-error: true
        id: notify_observed_003
        uses: astral-sh/setup-uv@v6
        with: {version: '0.12.23', enable-cache: true}
      - name: "▶ ️  Execute command"
        continue-on-error: true
        id: notify_observed_004
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv python install 3.12" uv python install 3.12
      - name: "▶ ️  Execute command"
        continue-on-error: true
        id: notify_observed_005
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv sync --frozen --group ingest" uv sync --frozen --group ingest
      - name: "▶ ️  Execute command"
        continue-on-error: true
        id: notify_observed_006
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv run ruff check ." uv run ruff check .
      - name: "▶ ️  Execute command"
        continue-on-error: true
        id: notify_observed_007
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv run mypy apps/api/src gpu bridges" uv run mypy apps/api/src gpu bridges
      - name: "▶ ️  Execute command"
        continue-on-error: true
        id: notify_observed_008
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv run pytest -m not integration and not gpu and not e2e --junitxml=" uv run pytest -m 'not integration and not gpu and not e2e' --junitxml=reports/unit.xml
      - name: "📦 Testes"
        continue-on-error: true
        id: notify_observed_009
        uses: actions/upload-artifact@v4
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || steps.notify_observed_008.outcome == 'failure') }}
        with:
          name: unit-results
          path: reports/unit.xml
          if-no-files-found: ignore
          retention-days: 3
      - name: "📋 Consolidar falhas · python"
        if: ${{ always() }}
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          printf '%s' "$STEP_RESULTS" | jq -r '
            to_entries[]
            | select(.value.outcome == "failure")
            | "::error title=Etapa falhou::" + .key
          '
          count=$(printf '%s' "$STEP_RESULTS" | jq '[.[] | select(.outcome == "failure")] | length')
          echo "### Resultado das verificações" >> "$GITHUB_STEP_SUMMARY"
          echo "Etapas com falha: $count" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            printf '%s' "$STEP_RESULTS" | jq -r 'to_entries[] | select(.value.outcome == "failure") | "- ❌ " + .key' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Nenhuma falha registrada." >> "$GITHUB_STEP_SUMMARY"
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: "🌐 Frontend · lint, types, tests, build"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Código"
        continue-on-error: true
        id: notify_observed_010
        uses: actions/checkout@v4
      - name: "🧰 Config"
        continue-on-error: true
        id: notify_observed_011
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - name: "▶ ️  Execute command"
        continue-on-error: true
        id: notify_observed_012
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "npm --prefix apps/web ci" npm --prefix apps/web ci
      - name: "▶ ️  Execute command"
        continue-on-error: true
        id: notify_observed_013
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "npm --prefix apps/web run lint" npm --prefix apps/web run lint
      - name: "▶ ️  Execute command"
        continue-on-error: true
        id: notify_observed_014
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "npm --prefix apps/web run typecheck" npm --prefix apps/web run typecheck
      - name: "▶ ️  Execute command"
        continue-on-error: true
        id: notify_observed_015
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "npm --prefix apps/web test" npm --prefix apps/web test
      - name: "▶ ️  Execute command"
        continue-on-error: true
        id: notify_observed_016
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "npm --prefix apps/web run build" npm --prefix apps/web run build
      - name: "▶ ️  Execute command"
        continue-on-error: true
        id: notify_observed_017
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "npm --prefix apps/web audit --audit-level=high" npm --prefix apps/web audit --audit-level=high
      - name: "📋 Consolidar falhas · frontend"
        if: ${{ always() }}
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          printf '%s' "$STEP_RESULTS" | jq -r '
            to_entries[]
            | select(.value.outcome == "failure")
            | "::error title=Etapa falhou::" + .key
          '
          count=$(printf '%s' "$STEP_RESULTS" | jq '[.[] | select(.outcome == "failure")] | length')
          echo "### Resultado das verificações" >> "$GITHUB_STEP_SUMMARY"
          echo "Etapas com falha: $count" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            printf '%s' "$STEP_RESULTS" | jq -r 'to_entries[] | select(.value.outcome == "failure") | "- ❌ " + .key' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Nenhuma falha registrada." >> "$GITHUB_STEP_SUMMARY"
  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    name: "🧪 Integration · database and browser"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Código"
        continue-on-error: true
        id: notify_observed_018
        uses: actions/checkout@v4
      - name: "🧰 Config"
        continue-on-error: true
        id: notify_observed_019
        uses: astral-sh/setup-uv@v6
        with: {version: '0.12.23'}
      - name: "▶ ️  Execute command"
        continue-on-error: true
        id: notify_observed_020
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv python install 3.12" uv python install 3.12
      - name: "▶ ️  Execute command"
        continue-on-error: true
        id: notify_observed_021
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv sync --frozen --group ingest" uv sync --frozen --group ingest
      - name: "🧰 Código"
        continue-on-error: true
        id: notify_observed_022
        uses: docker/setup-buildx-action@v3
      - name: "🧰 Código"
        continue-on-error: true
        id: notify_observed_023
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/minio.Dockerfile
          tags: photointel-minio:ci
          load: true
          push: false
          cache-from: type=gha,scope=photointel-minio
          cache-to: type=gha,mode=max,scope=photointel-minio,ignore-error=true
      - name: "⚙ ️  Start private local obje"
        continue-on-error: true
        id: notify_observed_024
        run: |
          docker run -d --name photointel-ci-minio -p 127.0.0.1:9000:9000 -e MINIO_ROOT_USER=ci-access -e MINIO_ROOT_PASSWORD=ci-only-not-a-production-secret photointel-minio:ci server /data
      - name: "⚙ ️  Wait for storage and cre"
        continue-on-error: true
        id: notify_observed_025
        run: |
          uv run python infra/scripts/init-private-bucket.py
      - name: "▶ ️  Execute command"
        continue-on-error: true
        id: notify_observed_026
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv run alembic -c infra/migrations/alembic.ini upgrade head" uv run alembic -c infra/migrations/alembic.ini upgrade head
      - name: "🗃 ️  Verify dump and restore "
        continue-on-error: true
        id: notify_observed_027
        run: uv run python infra/scripts/restore-ci.py --postgres-container "${{ job.services.postgres.id }}"
      - name: "🗃 Imagem"
        continue-on-error: true
        id: notify_observed_028
        run: uv run python infra/scripts/backup-restore-ci.py --postgres-container "${{ job.services.postgres.id }}"
      - name: "▶ ️  Execute command"
        continue-on-error: true
        id: notify_observed_029
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uv run pytest -m integration --junitxml=reports/integration.xml" uv run pytest -m integration --junitxml=reports/integration.xml
      - name: "🧰 Config"
        continue-on-error: true
        id: notify_observed_030
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - name: "▶ ️  Execute command"
        continue-on-error: true
        id: notify_observed_031
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "npm --prefix apps/web ci" npm --prefix apps/web ci
      - name: "▶ ️  Execute command"
        continue-on-error: true
        id: notify_observed_032
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "npx --prefix apps/web playwright install --with-deps chromium" npx --prefix apps/web playwright install --with-deps chromium
      - name: "⚙ ️  Browser E2E against real"
        continue-on-error: true
        id: notify_observed_033
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "bash infra/scripts/run-e2e.sh" bash infra/scripts/run-e2e.sh
        env:
          APP_ENV: test
          INFERENCE_BACKEND: test
          FRONTEND_ORIGIN: http://127.0.0.1:4173
          API_ORIGIN: http://127.0.0.1:8000
          GPU_ENABLED: 'true'
          JOYTAG_MODEL_REVISION: '1111111111111111111111111111111111111111'
          SIGLIP_MODEL_REVISION: '2222222222222222222222222222222222222222'
      - name: "📦 Testes"
        continue-on-error: true
        id: notify_observed_034
        uses: actions/upload-artifact@v4
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || steps.notify_observed_029.outcome == 'failure') }}
        with:
          name: integration-results
          path: reports/integration.xml
          if-no-files-found: ignore
          retention-days: 3
      - name: "📦 Testes"
        continue-on-error: true
        id: notify_observed_035
        uses: actions/upload-artifact@v4
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || steps.notify_observed_033.outcome == 'failure') }}
        with:
          name: browser-results
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 3
      - name: "📋 Consolidar falhas · integration"
        if: ${{ always() }}
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          printf '%s' "$STEP_RESULTS" | jq -r '
            to_entries[]
            | select(.value.outcome == "failure")
            | "::error title=Etapa falhou::" + .key
          '
          count=$(printf '%s' "$STEP_RESULTS" | jq '[.[] | select(.outcome == "failure")] | length')
          echo "### Resultado das verificações" >> "$GITHUB_STEP_SUMMARY"
          echo "Etapas com falha: $count" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            printf '%s' "$STEP_RESULTS" | jq -r 'to_entries[] | select(.value.outcome == "failure") | "- ❌ " + .key' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Nenhuma falha registrada." >> "$GITHUB_STEP_SUMMARY"
  containers:
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    name: "🐳 Containers · architectures"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Código"
        continue-on-error: true
        id: notify_observed_036
        uses: actions/checkout@v4
      - name: "🧰 Build"
        continue-on-error: true
        id: notify_observed_037
        uses: docker/setup-qemu-action@v3
      - name: "🧰 Build"
        continue-on-error: true
        id: notify_observed_038
        uses: docker/setup-buildx-action@v3
      - name: "🏗 Build"
        continue-on-error: true
        id: notify_observed_039
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
      - name: "🏗 Build"
        continue-on-error: true
        id: notify_observed_040
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
      - name: "📋 Consolidar falhas · containers"
        if: ${{ always() }}
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          printf '%s' "$STEP_RESULTS" | jq -r '
            to_entries[]
            | select(.value.outcome == "failure")
            | "::error title=Etapa falhou::" + .key
          '
          count=$(printf '%s' "$STEP_RESULTS" | jq '[.[] | select(.outcome == "failure")] | length')
          echo "### Resultado das verificações" >> "$GITHUB_STEP_SUMMARY"
          echo "Etapas com falha: $count" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            printf '%s' "$STEP_RESULTS" | jq -r 'to_entries[] | select(.value.outcome == "failure") | "- ❌ " + .key' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Nenhuma falha registrada." >> "$GITHUB_STEP_SUMMARY"
  security:
    needs: changes
    if: needs.changes.outputs.security == 'true'
    name: "🔐 Security · dependency and secret audit"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Código"
        continue-on-error: true
        id: notify_observed_041
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "🧰 Config"
        continue-on-error: true
        id: notify_observed_042
        uses: astral-sh/setup-uv@v6
        with: {version: '0.12.23'}
      - name: "▶ ️  Execute command"
        continue-on-error: true
        id: notify_observed_043
        run: uv export --frozen --no-dev --group ingest --no-emit-project --no-emit-package photointel-icloudpd-source > /tmp/runtime-requirements.txt
      - name: "▶ ️  Execute command"
        continue-on-error: true
        id: notify_observed_044
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "uvx pip-audit -r /tmp/runtime-requirements.txt --disable-pip" uvx pip-audit -r /tmp/runtime-requirements.txt --disable-pip
      - name: "🧰 Setup"
        continue-on-error: true
        id: notify_observed_045
        run: |
          uv export --frozen --no-dev --group gpu --no-emit-project > /tmp/gpu-requirements.txt
          uvx pip-audit -r /tmp/gpu-requirements.txt --disable-pip
      - name: "🔐 Secrets"
        id: notify_observed_046
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
      - name: "📋 Consolidar falhas · security"
        if: ${{ always() }}
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          printf '%s' "$STEP_RESULTS" | jq -r '
            to_entries[]
            | select(.value.outcome == "failure")
            | "::error title=Etapa falhou::" + .key
          '
          count=$(printf '%s' "$STEP_RESULTS" | jq '[.[] | select(.outcome == "failure")] | length')
          echo "### Resultado das verificações" >> "$GITHUB_STEP_SUMMARY"
          echo "Etapas com falha: $count" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            printf '%s' "$STEP_RESULTS" | jq -r 'to_entries[] | select(.value.outcome == "failure") | "- ❌ " + .key' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Nenhuma falha registrada." >> "$GITHUB_STEP_SUMMARY"
