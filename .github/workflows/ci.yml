name: "🧪 [CI] Validate application"
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  locks:
    name: "🧪 [CI] locks"
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: "📥 [SOURCE] Checkout repository"
        id: notify_observed_001
        uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: "🔔 [NOTIFY] 📥 [SOURCE] Checkout repository"
        if: ${{ always() && (steps.notify_observed_001.outcome == 'success' || steps.notify_observed_001.outcome == 'failure' || steps.notify_observed_001.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "📥 [SOURCE] Checkout repository"
          outcome: ${{ steps.notify_observed_001.outcome }}
      - id: check
        name: Require actual generated locks before frozen validation
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          python_lock = Path("uv.lock")
          node_lock = Path("apps/web/package-lock.json")
          try:
              node_ready = bool(json.loads(node_lock.read_text()).get("packages", {}).get("", {}).get("dependencies"))
          except (OSError, ValueError):
              node_ready = False
          ready = python_lock.is_file() and python_lock.stat().st_size > 0 and node_ready
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"ready={'true' if ready else 'false'}\n")
          if not ready:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("Frozen validation deferred: run Bootstrap and validate, retrieve its generated-locks-contracts artifact, and commit the locks. No tests were executed by this workflow.\n")
          PY
      - name: "🔔 [NOTIFY] Step check"
        if: ${{ always() && (steps.check.outcome == 'success' || steps.check.outcome == 'failure' || steps.check.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "Step check"
          outcome: ${{ steps.check.outcome }}
  python:
    name: "🧪 [CI] python"
    needs: locks
    if: needs.locks.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "📥 [SOURCE] Checkout repository"
        id: notify_observed_002
        uses: actions/checkout@v4
      - name: "🔔 [NOTIFY] 📥 [SOURCE] Checkout repository"
        if: ${{ always() && (steps.notify_observed_002.outcome == 'success' || steps.notify_observed_002.outcome == 'failure' || steps.notify_observed_002.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
