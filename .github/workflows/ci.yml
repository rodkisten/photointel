name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  locks:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - id: check
        name: Require actual generated locks before frozen validation
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          python_lock = Path("uv.lock")
          node_lock = Path("apps/web/package-lock.json")
          try:
              node_ready = bool(json.loads(node_lock.read_text()).get("packages", {}).get("", {}).get("dependencies"))
          except (OSError, ValueError):
              node_ready = False
          ready = python_lock.is_file() and python_lock.stat().st_size > 0 and node_ready
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"ready={'true' if ready else 'false'}\n")
          if not ready:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("Frozen validation deferred: run Bootstrap and validate, retrieve its generated-locks-contracts artifact, and commit the locks. No tests were executed by this workflow.\n")
          PY
  python:
    needs: locks
    if: needs.locks.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.23', enable-cache: true}
      - run: uv python install 3.12
      - run: uv sync --frozen --group ingest
      - run: uv run ruff check .
      - run: uv run mypy apps/api/src gpu bridges
      - run: uv run pytest -m 'not integration and not gpu and not e2e' --junitxml=reports/unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: unit-results, path: reports/unit.xml}
  frontend:
    needs: locks
    if: needs.locks.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web test
      - run: npm --prefix apps/web run build
      - run: npm --prefix apps/web audit --audit-level=high
  integration:
    needs: locks
    if: needs.locks.outputs.ready == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: photointel, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: photointel}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U photointel"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://photointel:ci-only@localhost:5432/photointel
      STORAGE_BACKEND: s3
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: photointel-ci-private
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: ci-access
      STORAGE_SECRET_KEY: ci-only-not-a-production-secret
      INFERENCE_BACKEND: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.23'}
      - run: uv python install 3.12
      - run: uv sync --frozen --group ingest
      - name: Set up cached source builds for local object storage
        uses: docker/setup-buildx-action@v3
      - name: Build real MinIO from pinned upstream source with CI cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/minio.Dockerfile
          tags: photointel-minio:ci
          load: true
          push: false
          cache-from: type=gha,scope=photointel-minio
          cache-to: type=gha,mode=max,scope=photointel-minio,ignore-error=true
      - name: Start private local object storage
        run: |
          docker run -d --name photointel-ci-minio -p 127.0.0.1:9000:9000 -e MINIO_ROOT_USER=ci-access -e MINIO_ROOT_PASSWORD=ci-only-not-a-production-secret photointel-minio:ci server /data
      - name: Wait for storage and create private bucket
        run: |
          uv run python infra/scripts/init-private-bucket.py
      - run: uv run alembic -c infra/migrations/alembic.ini upgrade head
      - name: Verify dump and restore using isolated synthetic databases
        run: uv run python infra/scripts/restore-ci.py --postgres-container "${{ job.services.postgres.id }}"
      - name: Verify encrypted PostgreSQL and private image-content restore
        run: uv run python infra/scripts/backup-restore-ci.py --postgres-container "${{ job.services.postgres.id }}"
      - run: uv run pytest -m integration --junitxml=reports/integration.xml
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm --prefix apps/web ci
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - name: Browser E2E against real API and synthetic media
        run: bash infra/scripts/run-e2e.sh
        env:
          APP_ENV: test
          INFERENCE_BACKEND: test
          FRONTEND_ORIGIN: http://127.0.0.1:4173
          API_ORIGIN: http://127.0.0.1:8000
          GPU_ENABLED: 'true'
          JOYTAG_MODEL_REVISION: '1111111111111111111111111111111111111111'
          SIGLIP_MODEL_REVISION: '2222222222222222222222222222222222222222'
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: integration-results, path: reports/integration.xml}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-results, path: apps/web/playwright-report}
  images:
    needs: locks
    if: needs.locks.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
  security:
    needs: locks
    if: needs.locks.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.23'}
      - run: uv export --frozen --no-dev --no-emit-project > /tmp/runtime-requirements.txt
      - run: uvx pip-audit -r /tmp/runtime-requirements.txt --disable-pip
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
