name: "TF · Validate"
run-name: "TF · Validate · ${{ github.ref_name }}"
on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/tf-*.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/tf-*.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photointel-tf-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (github.actor != 'renovate[bot]' && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'renovate[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.head_commit.author.username != 'renovate[bot]' && github.event.head_commit.author.username != 'dependabot[bot]' && !contains(github.event.head_commit.message, 'dependabot[bot]') && !contains(github.event.head_commit.message, 'renovate[bot]')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [production, cloudflare]
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - name: "TF · Format"
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "Terraform format" terraform fmt -recursive infra/terraform
      - name: "TF · Init without remote backend"
        working-directory: infra/terraform/environments/${{ matrix.root }}
        run: |
          source "$GITHUB_WORKSPACE/scripts/ci/pretty-logs.sh"
          ci_run "Terraform init · ${{ matrix.root }}" terraform init -backend=false -input=false
      - name: "TF · Generate offline Cloudflare schema fixture"
        if: matrix.root == 'cloudflare'
        env:
          TF_OFFLINE_FIXTURE: 'true'
        run: python3 -m infra.terraform.cloudflare_release fixture
      - name: "TF · Validate"
        working-directory: infra/terraform/environments/${{ matrix.root }}
        run: |
          source "$GITHUB_WORKSPACE/scripts/ci/pretty-logs.sh"
          ci_run "Terraform validate · ${{ matrix.root }}" terraform validate -no-color
      - name: "TF · Test Job configuration with mocked providers"
        working-directory: infra/terraform/environments/${{ matrix.root }}
        run: |
          source "$GITHUB_WORKSPACE/scripts/ci/pretty-logs.sh"
          ci_run "Terraform test · ${{ matrix.root }}" terraform test -no-color
      - name: "TF · Test adoption, release retention and plan safety"
        run: |
          source scripts/ci/pretty-logs.sh
          ci_run "Terraform offline contracts" python3 -m unittest discover -s infra/gcp/tests -v
