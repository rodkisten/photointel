name: "🎞️ Media · Build & Jobs"
run-name: "🎞️ Media · ${{ inputs.action }} · ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Preview, build immutable media images, or deploy existing Cloud Run Jobs"
        type: choice
        required: true
        default: plan
        options: [plan, build, jobs-deploy, build-and-deploy]
      image_sha:
        description: "Published media SHA; blank preserves Terraform release (no build for plan/jobs-deploy)"
        type: string
        required: false
        default: ''
      confirm_charges:
        description: "Authorize build or deployment charges (not required for plan)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: photointel-media-production
  cancel-in-progress: false

jobs:
  media:
    name: "🎞️ Media · ${{ inputs.action }}"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "🔎 Select traceable media image commit"
        id: images
        env:
          REQUESTED_SHA: ${{ inputs.image_sha }}
          ACTION: ${{ inputs.action }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_SHA" && "$ACTION" != jobs-deploy && "$ACTION" != plan ]]; then
            echo "::error::image_sha is only accepted for plan or jobs-deploy."
            exit 1
          fi
          sha="$WORKFLOW_SHA"
          if [[ "$ACTION" == jobs-deploy || "$ACTION" == plan ]]; then
            sha="$REQUESTED_SHA"
          fi
          if [[ -n "$sha" && ! "$sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::A full lowercase Git commit SHA is required."
            exit 1
          fi
          if [[ -n "$sha" ]]; then
            git cat-file -e "${sha}^{commit}"
            git merge-base --is-ancestor "$sha" "$WORKFLOW_SHA"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Workflow commit: $WORKFLOW_SHA; media image source commit: ${sha:-preserve Terraform release}"
      - name: "🧪 Validate media deployment commands (offline)"
        run: python3 -m unittest infra.gcp.tests.test_media infra.gcp.tests.test_cloud_cli -v
      - name: "🧰 Node.js 22 for media validation"
        if: inputs.action == 'build' || inputs.action == 'build-and-deploy'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: "🧪 Validate media image and video once before publishing"
        if: inputs.action == 'build' || inputs.action == 'build-and-deploy'
        run: |
          set -euo pipefail
          for component in image video; do
            echo "::group::🧪 media-${component}: npm test"
            (
              cd "services/media/${component}"
              npm install --no-audit --no-fund
              npm run build
              npm test
            )
            echo "::endgroup::"
          done
      - name: "⚙️ Prepare production configuration"
        id: config
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: photointel
          release-sha: ${{ github.sha }}
      - name: "🛡 Require explicit charge authorization"
        if: inputs.action != 'plan'
        env:
          CONFIRM: ${{ inputs.confirm_charges }}
        run: |
          test "$CONFIRM" = "true" || { echo "::error::Check the authorization checkbox to build or deploy media."; exit 1; }
      - name: "🔐 Authenticate with existing GCP WIF"
        if: inputs.action == 'build' || inputs.action == 'build-and-deploy'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.service_account }}
      - name: "🧰 Set up gcloud"
        if: inputs.action == 'build' || inputs.action == 'build-and-deploy'
        uses: google-github-actions/setup-gcloud@v3
      - name: "🔐 Diagnose effective Cloud Build identity and quota project"
        if: inputs.action == 'build' || inputs.action == 'build-and-deploy'
        env:
          EXPECTED_ACCOUNT: ${{ steps.config.outputs.service_account }}
        run: |
          set -euo pipefail
          echo "::group::Cloud Build authentication preflight"
          if [[ "$EXPECTED_ACCOUNT" != "photointel-deployer@photointel.iam.gserviceaccount.com" ]]; then
            echo "::error::Unexpected WIF deployer identity. Check GCP_CONFIG_ENV service_account."
            exit 1
          fi
          echo "Expected WIF service account: $EXPECTED_ACCOUNT"
          gcloud auth list --filter='status:ACTIVE' --format='value(account)'
          echo "gcloud project: $(gcloud config get-value project 2>/dev/null)"
          echo "gcloud billing/quota_project: $(gcloud config get-value billing/quota_project)"
          echo "GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-unset}"
          echo "::endgroup::"
          echo "::group::Cloud Build API preflight"
          if ! gcloud services list --enabled --project photointel --filter='config.name:cloudbuild.googleapis.com' --format='value(config.name)' >/dev/null; then
            echo "::error::Unable to list enabled APIs as the WIF deployer. Check the effective principal, quota project and serviceusage.services.use before attempting a build."
            exit 1
          fi
          echo "Service Usage API read succeeded. This does not prove builds.create or services.use."
          echo "::endgroup::"
      - name: "🏗️ Build media images only"
        if: inputs.action == 'build' || inputs.action == 'build-and-deploy'
        run: |
          python3 -m infra.gcp.manage media-build --git-sha "${{ github.sha }}" --apply --authorize-charges --confirm-project photointel
      # TF Production remains the single WIF-authorized infrastructure writer.
      # Dispatch and wait rather than adding Media to privileged WIF trust.
      - name: "TF · Plan or apply existing media images and verify Jobs"
        if: inputs.action != 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_SHA: ${{ steps.images.outputs.sha }}
          MEDIA_ACTION: ${{ inputs.action }}
        run: python3 -m infra.terraform.dispatch_media
      - name: "🧹 Remove temporary production config"
        if: always()
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup
