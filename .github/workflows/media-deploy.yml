name: "🎞️ Media · Build & Jobs"
run-name: "🎞️ Media · ${{ inputs.action }} · ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Preview, build immutable media images, or deploy existing Cloud Run Jobs"
        type: choice
        required: true
        default: plan
        options: [plan, build, jobs-deploy]
      confirm_charges:
        description: "Authorize build or deployment charges (not required for plan)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: photointel-media-production
  cancel-in-progress: false

jobs:
  media:
    name: "🎞️ Media · ${{ inputs.action }}"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "🧪 Validate media deployment commands (offline)"
        run: python3 -m unittest infra.gcp.tests.test_media -v
      - name: "⚙️ Prepare production configuration"
        id: config
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: photointel
          release-sha: ${{ github.sha }}
      - name: "🛡 Require explicit charge authorization"
        if: inputs.action != 'plan'
        env:
          CONFIRM: ${{ inputs.confirm_charges }}
        run: |
          test "$CONFIRM" = "true" || { echo "::error::Check the authorization checkbox to build or deploy media."; exit 1; }
      - name: "🔐 Authenticate with existing GCP WIF"
        if: inputs.action != 'plan'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.service_account }}
      - name: "🧰 Set up gcloud"
        if: inputs.action != 'plan'
        uses: google-github-actions/setup-gcloud@v3
      - name: "🔎 Plan media build and jobs (no changes)"
        if: inputs.action == 'plan'
        run: |
          python3 -m infra.gcp.manage media-build --git-sha "${{ github.sha }}"
          python3 -m infra.gcp.manage media-jobs-deploy --git-sha "${{ github.sha }}"
      - name: "🏗️ Build media images only"
        if: inputs.action == 'build'
        run: |
          python3 -m infra.gcp.manage media-build --git-sha "${{ github.sha }}" --apply --authorize-charges --confirm-project photointel
      - name: "🚀 Deploy private media Cloud Run Jobs only"
        if: inputs.action == 'jobs-deploy'
        run: |
          python3 -m infra.gcp.manage media-jobs-deploy --git-sha "${{ github.sha }}" --apply --authorize-charges --confirm-project photointel
      - name: "🧹 Remove temporary production config"
        if: always()
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup
