name: "🧹 One-time Job Controls Format"
on:
  push:
    branches: [feat/jobs-global-pause-cancel-progress]
    paths:
      - ".github/workflows/temporary-job-controls-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: "📦 Install locked root Prettier"
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: "🎨 Format only touched frontend files"
        run: |
          npx prettier --write \
            apps/web/src/components/job-controls.tsx \
            apps/web/src/components/jobs-drawer.tsx \
            apps/web/src/components/queue-controls.tsx \
            apps/web/src/jobs-control.css \
            apps/web/src/pages/jobs.tsx
      - name: "💾 Commit formatted files"
        run: |
          git add apps/web/src/components/job-controls.tsx \
            apps/web/src/components/jobs-drawer.tsx \
            apps/web/src/components/queue-controls.tsx \
            apps/web/src/jobs-control.css \
            apps/web/src/pages/jobs.tsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(web): format queue controls and jobs drawer"
          git push origin HEAD:feat/jobs-global-pause-cancel-progress
