name: "Temporary formatter for Manage deep links"
on:
  push:
    branches: [feat/manage-deep-links-log-investigation]
    paths:
      - ".github/workflows/temporary-format-manage-links.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format affected frontend sources
        run: |
          npx prettier --write \
            apps/web/src/components/error-boundary.tsx \
            apps/web/src/components/push-notifications.tsx \
            apps/web/src/lib/diagnostics.ts \
            apps/web/src/pages/jobs.tsx
      - name: Commit formatted sources
        run: |
          git add -- apps/web/src/components/error-boundary.tsx apps/web/src/components/push-notifications.tsx apps/web/src/lib/diagnostics.ts apps/web/src/pages/jobs.tsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(web): format affected Manage links and notification component"
          git push origin HEAD:refs/heads/feat/manage-deep-links-log-investigation
