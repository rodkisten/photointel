name: "📦 Preview Filter · One-time API Release"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-preview-filter-api-release.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: "🚀 Dispatch audited GCP API release"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: "🚀 Dispatch production API release"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GH_REPO/actions/workflows/gcp-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[action]=release' \
            -f 'inputs[migration_mode]=plan' \
            -f 'inputs[migration_database]=unselected'
          echo "Dispatched audited API release for the merged has_preview search filter."
