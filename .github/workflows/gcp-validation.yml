name: "☁️ [GCP VALIDATE] Validate deployment definitions"
on:
  pull_request:
    paths:
      - infra/gcp/**
      - .github/actions/gcp-config/**
      - '!infra/gcp/artifact-registry-cleanup.json'
      - '!infra/gcp/staging-bucket-lifecycle.json'
      - infra/docker/api*.Dockerfile
      - infra/docker/compose.dev.yml
      - infra/scripts/zip-patch-policy*.cjs
      - apps/api/src/photointel/services/cloud_dispatch.py
      - cloudbuild.yaml
      - .github/workflows/gcp*.yml
      - .github/workflows/zip.yml
  push:
    branches: [main]
    paths:
      - infra/gcp/**
      - .github/actions/gcp-config/**
      - '!infra/gcp/artifact-registry-cleanup.json'
      - '!infra/gcp/staging-bucket-lifecycle.json'
      - infra/docker/api*.Dockerfile
      - infra/docker/compose.dev.yml
      - infra/scripts/zip-patch-policy*.cjs
      - apps/api/src/photointel/services/cloud_dispatch.py
      - cloudbuild.yaml
      - .github/workflows/gcp*.yml
      - .github/workflows/zip.yml
  workflow_dispatch:
    inputs:
      upload_evidence:
        description: 'Upload optional plan artifacts (may consume GitHub storage quota)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  offline:
    name: "☁️ [GCP VALIDATE] offline"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 [SOURCE] Checkout repository"
        uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: "🧰 [SETUP] Configure actions/setup-python"
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: "🔐 [AUTH] Validate finite resources and command authorization without cloud credentials"
        run: |
          python -m unittest discover -s infra/gcp/tests -v
          python infra/gcp/manage.py render --config infra/gcp/config.example.json --output reports/gcp-rendered
          python infra/gcp/manage.py bootstrap --config infra/gcp/config.example.json > reports/gcp-bootstrap-plan.txt
          python infra/gcp/manage.py scheduler --config infra/gcp/config.example.json > reports/gcp-scheduler-plan.txt
      - name: "🧩 [CONFIG] Audit shared config action and cleanup references"
        run: |
          python3 - <<'PY'
          from pathlib import Path
          action = Path(".github/actions/gcp-config/action.yml").read_text()
          assert "inputs.mode == 'prepare'" in action
          assert "inputs.mode == 'cleanup'" in action
          assert "GCP_CONFIG_ENV:" in action
          assert "rm -f infra/gcp/config.local.json" in action
          for workflow in ("gcp-bootstrap.yml", "gcp-deploy.yml"):
              source = (Path(".github/workflows") / workflow).read_text()
              assert source.count("uses: ./.github/actions/gcp-config") == 2
              expected = "config-env: " + "$" + "{{ vars.GCP_CONFIG_ENV }}"
              assert expected in source
              assert "mode: cleanup" in source
              assert "if: always()" in source
              assert "environment: production" in source
          PY
      - name: "🧪 [TEST] Validate standalone bootstrap shell and idempotency"
        run: |
          bash -n infra/gcp/bootstrap.sh
          bash -n infra/gcp/tests/test-bootstrap.sh
          bash infra/gcp/tests/test-bootstrap.sh
      - name: "🧪 [TEST] Validate fixed-origin Cloudflare relay"
        run: node --test infra/cloudflare/cloud-run-proxy/worker.test.mjs
      - name: "🧩 [PATCH] Reject private data in source ZIP imports"
        run: node --test infra/scripts/zip-patch-policy.test.cjs
      # Successful push/PR validation is already visible in the Actions log.
      # Only keep the generated plans when useful for manual review or failures.
      - name: "📦 [EVIDENCE] Upload test artifacts"
        uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_evidence == true }}
        with:
          name: gcp-offline-definitions
          path: reports/gcp-*
          if-no-files-found: ignore
          retention-days: 3
