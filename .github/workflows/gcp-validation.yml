name: "☁️ GCP Check"
on:
  pull_request:
    paths:
      - infra/gcp/**
      - .github/actions/gcp-config/**
      - .github/actions/notify/**
      - infra/notify/**
      - '!infra/gcp/artifact-registry-cleanup.json'
      - '!infra/gcp/staging-bucket-lifecycle.json'
      - infra/docker/api*.Dockerfile
      - infra/docker/compose.dev.yml
      - infra/scripts/zip-patch-policy*.cjs
      - apps/api/src/photointel/services/cloud_dispatch.py
      - cloudbuild.yaml
      - .github/workflows/gcp*.yml
      - .github/workflows/zip.yml
      - infra/scripts/prepare_workflow_env.py
      - infra/scripts/cloudflare_setup.py
      - infra/cloudflare/cloud-run-proxy/**
      - .github/workflows/deploy-worker.yml
  push:
    branches: [main]
    paths:
      - infra/gcp/**
      - .github/actions/gcp-config/**
      - .github/actions/notify/**
      - infra/notify/**
      - '!infra/gcp/artifact-registry-cleanup.json'
      - '!infra/gcp/staging-bucket-lifecycle.json'
      - infra/docker/api*.Dockerfile
      - infra/docker/compose.dev.yml
      - infra/scripts/zip-patch-policy*.cjs
      - apps/api/src/photointel/services/cloud_dispatch.py
      - cloudbuild.yaml
      - .github/workflows/gcp*.yml
      - .github/workflows/zip.yml
      - infra/scripts/prepare_workflow_env.py
      - infra/scripts/cloudflare_setup.py
      - infra/cloudflare/cloud-run-proxy/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:
    inputs:
      upload_evidence:
        description: 'Upload optional plan artifacts (may consume GitHub storage quota)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  offline:
    name: "☁️ Check"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Código"
        id: notify_observed_001
        uses: actions/checkout@v7
        with: {persist-credentials: false}
      - name: "🧰 Config"
        id: notify_observed_002
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: "🔐 Código"
        id: notify_observed_003
        run: |
          python -m unittest discover -s infra/gcp/tests -v
          python -m infra.gcp.manage render --config infra/gcp/config.example.json --output reports/gcp-rendered
          python -m infra.gcp.manage bootstrap --config infra/gcp/config.example.json > reports/gcp-bootstrap-plan.txt
          python -m infra.gcp.manage scheduler --config infra/gcp/config.example.json > reports/gcp-scheduler-plan.txt
      - name: "🧩 Limpeza"
        id: notify_observed_004
        run: |
          python3 - <<'PY'
          from pathlib import Path
          action = Path(".github/actions/gcp-config/action.yml").read_text()
          assert "inputs.mode == 'prepare'" in action
          assert "inputs.mode == 'cleanup'" in action
          assert "GCP_CONFIG_ENV:" in action
          assert "rm -f infra/gcp/config.local.json" in action
          for workflow in ("gcp-bootstrap.yml", "gcp-deploy.yml", "gcp-migrate.yml"):
              source = (Path(".github/workflows") / workflow).read_text()
              assert source.count("uses: ./.github/actions/gcp-config") == 2
              assert 'name: "⚙ Env"' in source
              expected = "config-env: " + "$" + "{{ vars.GCP_CONFIG_ENV }}"
              assert expected in source
              assert "mode: cleanup" in source
              assert "if: always()" in source
              assert "environment: production" in source
          PY
      - name: "🧪 Bootstrap"
        id: notify_observed_005
        run: |
          bash -n infra/gcp/bootstrap.sh
          bash -n infra/gcp/release.sh
          bash -n infra/gcp/tests/test-bootstrap.sh
          bash infra/gcp/tests/test-bootstrap.sh
      - name: "🗃 Neon runtime"
        run: bash infra/gcp/tests/test_migration_runtime.sh
      - name: "🧪 Testes"
        id: notify_observed_006
        run: node --test infra/cloudflare/cloud-run-proxy/worker.test.mjs
      - name: "🧩 Código"
        id: notify_observed_007
        run: node --test infra/scripts/zip-patch-policy.test.cjs
      # Successful push/PR validation is already visible in the Actions log.
      # Only keep the generated plans when useful for manual review or failures.
      - name: "📦 Testes"
        id: notify_observed_008
        uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_evidence == true }}
        with:
          name: gcp-offline-definitions
          path: reports/gcp-*
          if-no-files-found: ignore
          retention-days: 3

