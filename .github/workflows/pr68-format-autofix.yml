name: "🎨 PR #68 One-shot Prettier Fix"
on:
  push:
    branches:
      - fix/mobile-logs-carbon-preview-20261103
    paths:
      - .github/workflows/pr68-format-autofix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Install pinned formatter"
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: "Format changed web source"
        run: ./node_modules/.bin/prettier --write apps/web/src/pages/library.tsx apps/web/src/styles.css
      - name: "Commit formatted files"
        run: |
          git add apps/web/src/pages/library.tsx apps/web/src/styles.css
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(web): apply pinned Prettier to mobile UI"
          git push origin HEAD:refs/heads/fix/mobile-logs-carbon-preview-20261103
