name: "📱 GCP Terminal"
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Provision/update, power on/off, inspect or plan"
        required: true
        type: choice
        default: status
        options: [plan, build, provision, start, stop, status]
permissions:
  contents: read
concurrency:
  group: photointel-gcp-terminal
  cancel-in-progress: false
jobs:
  terminal:
    name: "📱 ${{ inputs.action }}"
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "📥 Código"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "⚙ GCP Config"
        id: config
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: photointel
          release-sha: ${{ github.sha }}
      - name: "🧪 Validate terminal configuration"
        run: python3 infra/terminal/terminal.py plan
      - name: "🛡️ Check bootstrap identity"
        if: inputs.action == 'provision' || inputs.action == 'build'
        env:
          BOOTSTRAP_ACCOUNT: ${{ steps.config.outputs.bootstrap_service_account }}
          BOOTSTRAP_PROVIDER: ${{ steps.config.outputs.bootstrap_workload_identity_provider }}
        run: |
          test -n "$BOOTSTRAP_PROVIDER"
          test "$BOOTSTRAP_ACCOUNT" = 'photointel-bootstrap@photointel.iam.gserviceaccount.com'
      - name: "🔐 GCP Login"
        if: inputs.action != 'plan'
        uses: google-github-actions/auth@v3
        with:
          project_id: photointel
          workload_identity_provider: ${{ (inputs.action == 'provision' || inputs.action == 'build') && steps.config.outputs.bootstrap_workload_identity_provider || steps.config.outputs.workload_identity_provider }}
          service_account: ${{ (inputs.action == 'provision' || inputs.action == 'build') && steps.config.outputs.bootstrap_service_account || steps.config.outputs.service_account }}
      - name: "🧰 Gcloud"
        if: inputs.action != 'plan'
        uses: google-github-actions/setup-gcloud@v3
      - name: "🖥️ Terminal operation"
        id: terminal_operation
        if: inputs.action != 'plan'
        env:
          TERMINAL_ACTION: ${{ inputs.action }}
          TERMINAL_DEPLOYER: ${{ steps.config.outputs.service_account }}
        run: |
          python3 infra/terminal/terminal.py "$TERMINAL_ACTION" --apply --confirm-project photointel
      - name: "📋 VM boot logs + Tailscale readiness"
        if: inputs.action == 'provision' && steps.terminal_operation.outcome == 'success'
        timeout-minutes: 5
        run: |
          python3 infra/terminal/boot_logs.py --name photointel-terminal --zone us-central1-a --timeout-seconds 210
      - name: "🧹 GCP Config"
        if: always()
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup

