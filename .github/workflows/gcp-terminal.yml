name: "📱 GCP Terminal"
run-name: "📱 Terminal · ${{ inputs.action || 'plan' }}"
on:
  push:
    branches: [main]
    paths:
      - 'infra/terminal/**'
      - '.github/actions/gcp-config/**'
      - '.github/workflows/gcp-terminal.yml'
  workflow_dispatch:
    inputs:
      action:
        description: "Provision/update, power on/off, inspect or plan"
        required: true
        type: choice
        default: status
        options: [plan, build, provision, start, stop, status, logs]
permissions:
  contents: read
concurrency:
  group: photointel-gcp-terminal
  cancel-in-progress: false
jobs:
  push-check:
    name: "🧪 Terminal plan (offline)"
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          bash -n infra/terminal/startup.sh
          python3 -m unittest discover -s infra/terminal -p 'test_*.py' -v
  terminal:
    name: "📱 ${{ inputs.action }}"
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "📥 Código"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "⚙ GCP Config"
        id: config
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: photointel
          release-sha: ${{ github.sha }}
      - name: "🧪 Validate terminal configuration"
        run: python3 -m infra.terminal.terminal plan
      - name: "🛡️ Check bootstrap identity"
        if: inputs.action == 'provision' || inputs.action == 'build' || inputs.action == 'logs'
        env:
          BOOTSTRAP_ACCOUNT: ${{ steps.config.outputs.bootstrap_service_account }}
          BOOTSTRAP_PROVIDER: ${{ steps.config.outputs.bootstrap_workload_identity_provider }}
        run: |
          test -n "$BOOTSTRAP_PROVIDER"
          test "$BOOTSTRAP_ACCOUNT" = 'photointel-bootstrap@photointel.iam.gserviceaccount.com'
      - name: "🔐 GCP Login"
        if: inputs.action != 'plan'
        uses: google-github-actions/auth@v3
        with:
          project_id: photointel
          workload_identity_provider: ${{ (inputs.action == 'provision' || inputs.action == 'build' || inputs.action == 'logs') && steps.config.outputs.bootstrap_workload_identity_provider || steps.config.outputs.workload_identity_provider }}
          service_account: ${{ (inputs.action == 'provision' || inputs.action == 'build' || inputs.action == 'logs') && steps.config.outputs.bootstrap_service_account || steps.config.outputs.service_account }}
      - name: "🧰 Gcloud"
        if: inputs.action != 'plan'
        uses: google-github-actions/setup-gcloud@v3
      - name: "🖥️ Terminal operation"
        id: terminal_operation
        if: inputs.action != 'plan' && inputs.action != 'logs'
        env:
          TERMINAL_ACTION: ${{ inputs.action }}
          TERMINAL_DEPLOYER: ${{ steps.config.outputs.service_account }}
        run: |
          python3 -m infra.terminal.terminal "$TERMINAL_ACTION" --apply --confirm-project photointel
      - name: "📋 VM boot logs + Tailscale readiness"
        if: (inputs.action == 'provision' && steps.terminal_operation.outcome == 'success') || inputs.action == 'logs'
        timeout-minutes: 14
        continue-on-error: ${{ inputs.action == 'logs' }}
        env:
          TERMINAL_LOG_TIMEOUT: ${{ inputs.action == 'logs' && '15' || '720' }}
        run: |
          python3 -m infra.terminal.boot_logs --name photointel-terminal --zone us-central1-a --timeout-seconds "$TERMINAL_LOG_TIMEOUT"
      - name: "🧹 GCP Config"
        if: always()
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup

