name: "🧪 Cloudflare · PR Previews"
run-name: "🧪 Previews · PR #${{ github.event.pull_request.number }} · ${{ github.head_ref }}"
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - "apps/web/**"
      - "apps/manage/**"
      - "infra/cloudflare/cloud-run-proxy/**"
      - ".github/workflows/cloudflare-pr-previews.yml"
permissions:
  contents: read
concurrency:
  group: photointel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  previews:
    name: "🌐 Manage + Fotos · isolated preview"
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository && (github.actor != 'renovate[bot]' && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'renovate[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.head_commit.author.username != 'renovate[bot]' && github.event.head_commit.author.username != 'dependabot[bot]' && !contains(github.event.head_commit.message, 'dependabot[bot]') && !contains(github.event.head_commit.message, 'renovate[bot]') }}
    runs-on: ubuntu-latest
    environment: preview
    if: github.event.action != 'closed'
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/manage/package-lock.json
      - name: "🔑 Verify dedicated preview credentials"
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the GitHub preview Environment. Production secrets are intentionally not reused."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: "📦 Install both apps"
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/manage ci
      - name: "🏗 Build static Photos and Manage"
        run: |
          npm --prefix apps/web run build
          npm --prefix apps/manage run build
      - name: "🖼 Photos static preview, no production API"
        if: steps.credentials.outputs.ready == 'true'
        working-directory: apps/web
        run: npx --yes wrangler@4.135.0 preview --config wrangler.preview.jsonc --name "pr-${{ github.event.pull_request.number }}"
      - name: "🛡 Manage preview · isolated static assets"
        if: steps.credentials.outputs.ready == 'true'
        working-directory: apps/manage
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Static-only preview: never deploy the privileged Manage Worker or its production bindings.
          cat > wrangler.pr-preview.jsonc <<EOF
          {
            "name": "photointel-manage-pr-${PR_NUMBER}",
            "compatibility_date": "2026-11-01",
            "workers_dev": true,
            "preview_urls": false,
            "assets": {
              "directory": "./dist",
              "not_found_handling": "single-page-application"
            }
          }
          EOF
          npx --yes wrangler@4.135.0 deploy --config wrangler.pr-preview.jsonc
          echo "### Manage PR #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "Static preview deployed to the isolated Worker photointel-manage-pr-${PR_NUMBER}." >> "$GITHUB_STEP_SUMMARY"
          echo "Admin API and production credentials are intentionally unavailable." >> "$GITHUB_STEP_SUMMARY"
      - name: "📝 Preview configuration"
        if: steps.credentials.outputs.ready != 'true'
        run: |
          echo "### Previews not deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Create GitHub Environment preview and set CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID scoped for Preview Workers." >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: "🧹 Delete closed PR preview"
    if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: "🧹 Remove isolated preview"
        working-directory: apps/manage
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Missing preview credentials"
            exit 1
          fi
          cat > wrangler.pr-preview.jsonc <<EOF
          {"name":"photointel-manage-pr-${{ github.event.pull_request.number }}","compatibility_date":"2026-11-01","workers_dev":true}
          EOF
          npx --yes wrangler@4.135.0 delete --config wrangler.pr-preview.jsonc --force
