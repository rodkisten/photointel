name: "🧪 Cloudflare · PR Previews"
run-name: "Cloudflare PR preview"
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número do PR aberto para publicar o preview"
        required: true
        type: number
  pull_request:
    types: [opened, reopened, synchronize, closed]
permissions:
  contents: read
concurrency:
  group: photointel-preview-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  eligibility:
    name: "🛡 Check preview eligibility"
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: "🔎 Check bot identity and [skip ci] in latest commit"
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_AUTHOR: ${{ github.event.pull_request.head.user.login }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          echo "allowed=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for identity in "$PR_AUTHOR" "$HEAD_AUTHOR" "$ACTOR"; do
            case "${identity,,}" in
              dependabot|'dependabot[bot]'|renovate|'renovate[bot]'|renovate-bot)
                echo "reason=automation bot: $identity" >> "$GITHUB_OUTPUT"
                echo "⏭️ Preview skipped for $identity" >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
            esac
          done
          sha="${{ github.event.pull_request.head.sha }}"
          message="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.commit.message')"
          if grep -Eiq '\[skip[[:space:]]+ci\]' <<< "$message"; then
            echo "reason=latest commit contains [skip ci]" >> "$GITHUB_OUTPUT"
            echo "⏭️ Preview skipped: latest commit contains [skip ci]" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "reason=eligible pull request" >> "$GITHUB_OUTPUT"
          echo "✅ Preview eligible" >> "$GITHUB_STEP_SUMMARY"

  previews:
    name: "Manage and Photos Wrangler previews"
    needs: eligibility
    if: ${{ needs.eligibility.outputs.allowed == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: "🔎 Validate manually selected PR"
        if: github.event_name == 'workflow_dispatch'
        id: selected_pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg repo "$GITHUB_REPOSITORY" '(.state == "open") and (.head.repo.full_name == $repo)' <<< "$pr" >/dev/null || { echo "::error::PR must be open and from this repository"; exit 1; }
          echo "sha=$(jq -r '.head.sha' <<< "$pr")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ steps.selected_pr.outputs.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/manage/package-lock.json
      - name: "🔑 Verify dedicated preview credentials"
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the GitHub production Environment. Preview Workers remain isolated from production routes."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: "🧩 Validate TypeScript environment contract (read-only)"
        env:
          GCP_CONFIG_ENV: ${{ vars.GCP_CONFIG_ENV }}
        run: |
          set -euo pipefail
          node --experimental-strip-types packages/env/src/deploy.ts diagnose > "$RUNNER_TEMP/manage-env-diagnostic.json"
          jq -e '.terminalError == ""' "$RUNNER_TEMP/manage-env-diagnostic.json" >/dev/null
          {
            echo "### 🧩 TypeScript environment diagnostics"
            echo
            echo "- Source: GitHub production Environment GCP_CONFIG_ENV"
            echo "- Terminal catalog present: $(jq -r '.terminalPresent' "$RUNNER_TEMP/manage-env-diagnostic.json")"
            echo "- Terminal catalog valid: $(jq -r '.terminalValid' "$RUNNER_TEMP/manage-env-diagnostic.json")"
            echo "- Gateway configured: $(jq -r '.gatewayPresent' "$RUNNER_TEMP/manage-env-diagnostic.json")"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "🛡 Preview isolation · no GCP production identity"
        run: |
          echo "### 🛡 Isolated PR preview" >> "$GITHUB_STEP_SUMMARY"
          echo "No GCP Workload Identity Federation or Secret Manager access is used by this preview." >> "$GITHUB_STEP_SUMMARY"
          echo "Production deployment configuration is not rendered into preview builds." >> "$GITHUB_STEP_SUMMARY"
      - name: "📦 Install both apps"
        id: install
        run: |
          set -euo pipefail
          for app in web manage; do
            if npm --prefix "apps/$app" ci > "$RUNNER_TEMP/npm-$app.log" 2>&1; then
              echo "✅ apps/$app installed"
            else
              echo "failed_app=$app" >> "$GITHUB_OUTPUT"
              echo "::error title=Dependency install failed::npm ci failed for apps/$app"
              grep -E 'npm error (code|Invalid:|Missing:|.*not in sync|.*can only install)' "$RUNNER_TEMP/npm-$app.log" | head -n 18 || true
              echo "::group::npm ci log tail"
              tail -n 30 "$RUNNER_TEMP/npm-$app.log"
              echo "::endgroup::"
              exit 1
            fi
          done
      - name: "🏗 Build static Photos and Manage"
        run: |
          npm --prefix apps/web run build
          npm --prefix apps/manage run build
      - name: "🖼 Photos static preview, no production API"
        if: steps.credentials.outputs.ready == 'true'
        working-directory: apps/web
        run: |
          set -euo pipefail
          npx --yes wrangler@4.135.0 preview --config wrangler.preview.jsonc --name "pr-${{ inputs.pr_number || github.event.pull_request.number }}" --json > "$RUNNER_TEMP/photos-preview.json"
          echo "### Photos Preview" >> "$GITHUB_STEP_SUMMARY"
          jq -er '.preview.urls[0]' "$RUNNER_TEMP/photos-preview.json" >> "$GITHUB_STEP_SUMMARY"
      - name: "🛡 Manage · Wrangler native preview"
        if: steps.credentials.outputs.ready == 'true'
        working-directory: apps/manage
        run: |
          set -euo pipefail
          npx --yes wrangler@4.135.0 preview --config wrangler.jsonc --name "pr-${{ inputs.pr_number || github.event.pull_request.number }}" --json > "$RUNNER_TEMP/manage-preview.json"
          url="$(jq -er '.preview.urls[0]' "$RUNNER_TEMP/manage-preview.json")"
          echo "### Manage native Wrangler preview · PR #${{ inputs.pr_number || github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: "📝 Preview configuration"
        if: steps.credentials.outputs.ready != 'true'
        run: |
          echo "### Previews not deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Configure CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID in GitHub Environment production. Preview Workers remain isolated." >> "$GITHUB_STEP_SUMMARY"

      - name: "📋 Preview diagnostic summary"
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          FAILED_APP: ${{ steps.install.outputs.failed_app }}
          PREVIEW_READY: ${{ steps.credentials.outputs.ready }}
          HEAD_SHA: ${{ steps.selected_pr.outputs.sha || github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          {
            echo "## 🧪 Cloudflare preview · diagnostic"
            echo
            echo "| Field | Value |"
            echo "|:--|:--|"
            echo "| PR | #$PR_NUMBER |"
            echo "| SHA | [${HEAD_SHA:0:12}](https://github.com/$GITHUB_REPOSITORY/commit/$HEAD_SHA) |"
            echo "| Dependencies | $INSTALL |"
            echo "| Preview credentials | ${PREVIEW_READY:-not-checked} |"
            echo "| Run | [Open logs](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |"
            echo
            if [[ "$INSTALL" == failure ]]; then
              echo "### ❌ Dependency installation failed"
              echo "Affected application: apps/${FAILED_APP:-unknown}"
              echo "Check package.json / package-lock.json consistency."
              echo "Run: npm --prefix apps/${FAILED_APP:-web} install --package-lock-only"
              echo "Then: npm --prefix apps/${FAILED_APP:-web} ci"
            elif [[ "$PREVIEW_READY" != true ]]; then
              echo "### ⚠️ Preview credentials unavailable or not checked"
            else
              echo "### 🔎 Inspect build and publication steps for preview URLs"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: "Closed PR preview cleanup"
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: "🧹 Delete native Wrangler previews"
        run: |
          set -euo pipefail
          npx --yes wrangler@4.135.0 preview delete --config apps/manage/wrangler.jsonc --name "pr-${{ inputs.pr_number || github.event.pull_request.number }}" --skip-confirmation
          npx --yes wrangler@4.135.0 preview delete --config apps/web/wrangler.preview.jsonc --name "pr-${{ inputs.pr_number || github.event.pull_request.number }}" --skip-confirmation
