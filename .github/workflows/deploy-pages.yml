name: "🌐 [PAGES] Deploy frontend manually"
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  deploy:
    name: "🌐 [PAGES] deploy"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: "📥 [SOURCE] Checkout repository"
        uses: actions/checkout@v4
      - name: "🧰 [SETUP] Configure actions/setup-node"
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - name: "▶️ [RUN] Execute command"
        run: npm --prefix apps/web ci
      - name: "▶️ [RUN] Execute command"
        run: npm --prefix apps/web run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_RELEASE_ID: ${{ github.sha }}
      - name: "▶️ [RUN] Execute command"
        run: cp infra/cloudflare/pages-headers apps/web/dist/_headers
      - name: "▶️ [RUN] Execute command"
        run: npx --yes wrangler@4 pages deploy apps/web/dist --project-name "$PAGES_PROJECT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
