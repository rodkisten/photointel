name: "🧭 Manage · Router migration validation"

on:
  push:
    branches: ["feat/manage-tanstack-router"]
    paths:
      - "apps/manage/package.json"

permissions:
  contents: write

concurrency:
  group: manage-router-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "📦 Generate deterministic npm lockfile"
        run: npm --prefix apps/manage install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: "🎨 Format modified Manage frontend"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx prettier --write \
            apps/manage/src/App.tsx \
            apps/manage/src/main.tsx \
            apps/manage/src/router.tsx \
            apps/manage/src/pages/Overview.tsx \
            apps/manage/src/pages/Deploys.tsx \
            apps/manage/src/pages/LogViewer.tsx \
            apps/manage/src/pages/SystemInfo.tsx \
            apps/manage/src/pages/ICloudDiagnostics.tsx \
            apps/manage/src/components/runs.tsx \
            apps/manage/src/log-deeplink.ts \
            apps/manage/src/log-deeplink.test.ts
      - name: "📝 Commit lock and formatting"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/manage/package-lock.json apps/manage/src
          if ! git diff --cached --quiet; then
            git commit -m "chore(manage): lock TanStack Router and format migration"
            git push
          fi
      - name: "🧪 Install, typecheck, test and build"
        run: |
          npm --prefix apps/manage ci
          npm --prefix apps/manage run typecheck
          npm --prefix apps/manage test
          npm --prefix apps/manage run build
