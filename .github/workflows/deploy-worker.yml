name: "🔮 RV · Legacy frontend dispatch"
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Ação"
        type: choice
        options: [build, build-and-deploy]
        default: build-and-deploy
      app:
        description: "App"
        type: choice
        options: [all, web, manage]
        default: all
      sha:
        description: "SHA opcional"
        type: string
        default: ''
      request_id:
        description: "ID"
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  release:
    uses: ./.github/workflows/frontend-release.yml
    with:
      action: ${{ inputs.action }}
      app: ${{ inputs.app }}
      sha: ${{ inputs.sha }}
      request_id: ${{ inputs.request_id }}
    secrets: inherit
