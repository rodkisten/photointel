name: "🌐 Frontends · Cloudflare Workers"

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('🌐 {0} · {1} · {2}', inputs.action, inputs.app, inputs.request_id || 'manual') || github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || format('Push to {0} ({1})', github.ref_name, github.sha) }}

on:
  push:
    branches: [main]
    paths:
      - 'apps/manage/**'
      - 'apps/web/**'
      - '.prettierrc.json'
      - '.prettierignore'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/contracts/**'
      - 'packages/env/**'
      - 'infra/cloudflare/**'
      - 'infra/scripts/prepare_workflow_env.py'
      - 'infra/scripts/cloudflare_setup.py'
      - 'infra/scripts/diagnose_access.py'
      - 'infra/scripts/deploy_manage.py'
      - '.github/actions/notify/**'
      - '.github/actions/gcp-config/**'
      - '.github/actions/frontend-source/**'
      - '.github/workflows/deploy-worker.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.prettierrc.json'
      - '.prettierignore'
      - 'apps/web/**'
      - 'apps/manage/**'
      - 'packages/contracts/**'
      - 'packages/env/**'
      - 'infra/cloudflare/**'
      - 'infra/scripts/prepare_workflow_env.py'
      - 'infra/scripts/cloudflare_setup.py'
      - 'infra/scripts/diagnose_access.py'
      - 'infra/scripts/deploy_manage.py'
      - '.github/actions/notify/**'
      - '.github/actions/gcp-config/**'
      - '.github/actions/frontend-source/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:
    inputs:
      action:
        description: "Ação"
        type: choice
        options: [build, build-and-deploy]
        default: build-and-deploy
      app:
        description: "App"
        type: choice
        options: [all, web, manage]
        default: all
      sha:
        description: "SHA opcional"
        type: string
        default: ''
      request_id:
        description: "ID"
        type: string
        default: ''

permissions: {contents: read}

concurrency:
  group: photointel-frontends-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: "🔍 Detectar Alterações"
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set-matrix.outputs.apps }}
    steps:
      - name: "📥 Checkout completo"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: "🗳️ Selecionar aplicações"
        id: set-matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_APP: ${{ inputs.app || 'all' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$REQUESTED_APP" in
              all) apps='["web","manage"]' ;;
              web|manage) apps="$(jq -cn --arg app "$REQUESTED_APP" '[$app]')" ;;
              *) echo '::error::App inválido'; exit 1 ;;
            esac
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$(git merge-base "$BASE_SHA" HEAD)"
            elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              base="$BEFORE_SHA"
            else
              base=""
            fi
            if [[ -z "$base" ]]; then
              apps='["web","manage"]'
            else
              files="$(git diff --name-only "$base" HEAD)"
              global='^(package(-lock)?\.json|\.prettier(rc\.json|ignore)|packages/|infra/|\.github/(actions/(gcp-config|frontend-source)/|workflows/deploy-worker\.yml))'
              if grep -Eq "$global" <<< "$files"; then
                apps='["web","manage"]'
              else
                apps='[]'
                if grep -q '^apps/web/' <<< "$files"; then apps="$(jq -c '. + ["web"]' <<< "$apps")"; fi
                if grep -q '^apps/manage/' <<< "$files"; then apps="$(jq -c '. + ["manage"]' <<< "$apps")"; fi
              fi
            fi
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Selected: $apps"

  preflight:
    name: "🧪 Build & Test · ${{ matrix.app }}"
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.apps != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.apps) }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - name: "📌 Fonte"
        uses: ./.github/actions/frontend-source
        with:
          sha: ${{ inputs.sha }}


      - name: "🧰 Node.js (${{ matrix.app }})"
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: "📦 Install dependencies (${{ matrix.app }})"
        run: npm ci
        working-directory: apps/${{ matrix.app }}

      - name: "🧹 ESLint (${{ matrix.app }})"
        continue-on-error: true
        if: matrix.app == 'web'
        run: npm run lint
        working-directory: apps/${{ matrix.app }}

      - name: "📐 TypeScript (${{ matrix.app }})"
        continue-on-error: true
        run: npm run typecheck
        working-directory: apps/${{ matrix.app }}

      - name: "🧪 Tests (${{ matrix.app }})"
        continue-on-error: true
        run: npm test
        working-directory: apps/${{ matrix.app }}

      - name: "🧪 PWA tests"
        continue-on-error: true
        if: matrix.app == 'web'
        run: npm run test:pwa
        working-directory: apps/web

      - name: "🏗 Production build"
        continue-on-error: true
        run: npm run build
        working-directory: apps/${{ matrix.app }}

      - name: "🧪 Cloudflare Worker tests"
        continue-on-error: true
        if: matrix.app == 'web'
        run: node --test infra/cloudflare/cloud-run-proxy/worker.test.mjs

      - name: "🐍 Validate Manage deployment script"
        continue-on-error: true
        if: matrix.app == 'manage'
        run: python3 -m py_compile infra/scripts/deploy_manage.py

      - name: "📋 Resultado consolidado"
        if: ${{ always() }}
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          failures=$(jq -c '[to_entries[] | select(.value.outcome == "failure") | .key]' <<< "$STEP_RESULTS")
          count=$(jq 'length' <<< "$failures")
          echo "### Verificações · ${{ matrix.app }}" >> "$GITHUB_STEP_SUMMARY"
          if (( count > 0 )); then
            jq -r '.[] | "- ❌ " + .' <<< "$failures" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$count verificação(ões) falharam."
            exit 1
          fi
          echo "✅ Sem falhas." >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    name: "🌐 Publish Photos Worker"
    runs-on: ubuntu-latest
    needs: [detect-changes, preflight]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.action != 'build' && needs.preflight.result == 'success' && contains(fromJSON(needs.detect-changes.outputs.apps), 'web') }}
    environment: production
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: "📥 Código"
        id: notify_observed_001
        uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - name: "📌 Fonte"
        uses: ./.github/actions/frontend-source
        with:
          sha: ${{ inputs.sha }}


      - name: "📱 Live · Início"
        id: notify_live_start
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: start
          total: "3"
          github-token: ${{ github.token }}
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}

      - name: "⚙ GCP Config"
        id: config
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: photointel
          release-sha: ${{ github.sha }}

      - name: "🔐 GCP Login"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.service_account }}

      - name: "🧰 Gcloud"
        uses: google-github-actions/setup-gcloud@v2

      - name: "⚙ Env"
        id: worker_env
        env:
          CONFIRM_PROJECT: photointel
        run: python3 -m infra.scripts.prepare_workflow_env worker

      - name: "🔎 Diagnose Access domain and application audience"
        continue-on-error: true
        env:
          CONFIRM_PROJECT: photointel
        run: python3 -m infra.scripts.diagnose_access

      - name: "🧰 Config"
        id: notify_observed_002
        uses: actions/setup-node@v7
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
        
      - name: "▶ ️ Execute command (Web install)"
        id: notify_observed_003
        run: npm ci
        working-directory: apps/web

      - name: "🏗 Build do frontend"
        id: notify_observed_004
        env:
          CONFIRM_PROJECT: photointel
        run: python3 -m infra.scripts.prepare_workflow_env worker-build
        
      - name: "📱 Build"
        if: ${{ always() && (steps.notify_observed_004.outcome == 'success' || steps.notify_observed_004.outcome == 'failure' || steps.notify_observed_004.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🏗 Build do frontend"
          label: "Build do frontend"
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "1"
          total: "3"
          outcome: ${{ steps.notify_observed_004.outcome }}
          
      - name: "🧪 API error diagnostics"
        run: npm test -- src/test/api-security.test.tsx
        working-directory: apps/web

      - name: "🧪 Worker relay + SPA"
        id: worker_tests
        run: node --test infra/cloudflare/cloud-run-proxy/worker.test.mjs
        
      - name: "📱 Testes"
        if: ${{ always() && (steps.worker_tests.outcome == 'success' || steps.worker_tests.outcome == 'failure' || steps.worker_tests.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧪 Worker relay + SPA"
          label: "Testes do Worker"
          outcome: ${{ steps.worker_tests.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "2"
          total: "3"

      - name: "▶ ️ Execute command (Headers copy)"
        id: notify_observed_005
        run: cp infra/cloudflare/worker-headers apps/web/dist/_headers
        
      - name: "🚀 Publicar Worker"
        id: notify_observed_006
        env:
          CONFIRM_PROJECT: photointel
        run: python3 -m infra.scripts.prepare_workflow_env worker-deploy

      - name: "📱 Publicação"
        if: ${{ always() && (steps.notify_observed_006.outcome == 'success' || steps.notify_observed_006.outcome == 'failure' || steps.notify_observed_006.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🚀 Publicar Worker"
          label: "Publicação"
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "3"
          total: "3"
          outcome: ${{ steps.notify_observed_006.outcome }}

      - name: "🧹 Config"
        if: ${{ always() && steps.notify_observed_001.outcome == 'success' }}
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup

      - name: "🔔 Resultado"
        if: ${{ always() && steps.notify_observed_001.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: end
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          outcome: ${{ job.status }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "3"
          total: "3"

  deploy-manage:
    name: "🧰 Publish Manage Worker"
    runs-on: ubuntu-latest
    needs: [detect-changes, preflight]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.action != 'build' && needs.preflight.result == 'success' && contains(fromJSON(needs.detect-changes.outputs.apps), 'manage') }}
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CONFIRM_PROJECT: photointel
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - name: "📌 Fonte"
        uses: ./.github/actions/frontend-source
        with:
          sha: ${{ inputs.sha }}


      - name: "🟢 Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/manage/package-lock.json

      - name: "⚙️ Prepare production configuration"
        id: config
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: photointel
          release-sha: ${{ github.sha }}

      - name: "🔐 Authenticate GCP WIF"
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.service_account }}

      - name: "🧰 Setup gcloud"
        uses: google-github-actions/setup-gcloud@v3

      - name: "📦 Install Manage"
        run: npm --prefix apps/manage ci

      - name: "🔎 Configure Sentry browser DSN"
        run: python3 -m infra.scripts.deploy_manage browser-env

      - name: "🏗 Build Manage"
        run: npm --prefix apps/manage run build

      - name: "🚀 Deploy Manage Worker, Access and domain"
        run: python3 -m infra.scripts.deploy_manage apply

      - name: "🧹 Remove temporary production config"
        if: always()
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup
