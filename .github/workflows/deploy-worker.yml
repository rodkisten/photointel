name: "🌐 Cloudflare Worker"
on:
  push:
    branches: [main]
    paths:
      - 'apps/manage/**'
      - 'apps/web/**'
      - '.prettierrc.json'
      - '.prettierignore'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/contracts/**'
      - 'infra/cloudflare/**'
      - 'infra/scripts/prepare_workflow_env.py'
      - 'infra/scripts/cloudflare_setup.py'
      - 'infra/scripts/diagnose_access.py'
      - '.github/actions/gcp-config/**'
      - '.github/workflows/deploy-worker.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/manage/**'
      - 'packages/contracts/**'
      - 'infra/cloudflare/**'
      - 'infra/scripts/prepare_workflow_env.py'
      - 'infra/scripts/cloudflare_setup.py'
      - 'infra/scripts/diagnose_access.py'
      - '.github/actions/gcp-config/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: photointel-cloudflare-worker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    name: "🧪 Frontend · lint, types, tests, production build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed_apps: ${{ steps.path-check.outputs.changed_apps }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with: {persist-credentials: false}
        
      - name: 🗳️ Get triggered folders
        id: path-check
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            COMMAND="git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }}"
          else
            if [ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]; then
              COMMAND="git diff --name-only HEAD~1 ${{ github.sha }}"
            else
              COMMAND="git diff --name-only ${{ github.event.before }} ${{ github.sha }}"
            fi
          fi

          CHANGED_FILES=$($COMMAND)
          CHANGED_FOLDERS=$(echo "$CHANGED_FILES" | xargs -I {} dirname {} | sort -u)
          
          APPS=""
          if echo "$CHANGED_FOLDERS" | grep -q "^apps/web"; then
            APPS="${APPS}web "
          fi
          if echo "$CHANGED_FOLDERS" | grep -q "^apps/manage"; then
            APPS="${APPS}manage "
          fi
          
          # Se mudou infra ou package global, roda ambos por segurança
          if [ -z "$APPS" ]; then
            APPS="web manage"
          fi

          echo "Apps detectados para build/test: $APPS"
          echo "changed_apps=$APPS" >> $GITHUB_OUTPUT

      - name: "🧰 Node.js (Web)"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: "📦 Install locked dependencies (Web)"
        run: npm ci
        working-directory: apps/web

      - name: "🧹 ESLint (Web)"
        run: npm run lint
        working-directory: apps/web

      - name: "📐 TypeScript (Web)"
        run: npm run typecheck
        working-directory: apps/web

      - name: "🧪 All frontend tests (Web)"
        run: npm test
        working-directory: apps/web

      - name: "🧪 Offline service worker tests (Web)"
        run: npm run test:pwa
        working-directory: apps/web

      - name: "🧰 Node.js (Manage)"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/manage/package-lock.json
        continue-on-error: true

      - name: "📦 Install locked dependencies (Manage)"
        run: npm ci
        working-directory: apps/manage
        continue-on-error: true

      - name: "🧪 Cloudflare Worker tests"
        run: node --test infra/cloudflare/cloud-run-proxy/worker.test.mjs

      - name: "🏗 Production Vite build + PWA precache (Web)"
        run: npm run build
        working-directory: apps/web

  deploy:
    name: "🌐 Publish unified Worker"
    runs-on: ubuntu-latest
    needs: preflight
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: "📥 Código"
        id: notify_observed_001
        uses: actions/checkout@v4
      - name: "📱 Live · Início"
        id: notify_live_start
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: start
          total: "3"
          github-token: ${{ github.token }}
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
      - name: "⚙ GCP Config"
        id: config
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: photointel
          release-sha: ${{ github.sha }}

      - name: "🔐 GCP Login"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.service_account }}

      - name: "🧰 Gcloud"
        uses: google-github-actions/setup-gcloud@v2

      - name: "⚙ Env"
        id: worker_env
        env:
          CONFIRM_PROJECT: photointel
        run: python3 -m infra.scripts.prepare_workflow_env worker

      - name: "🔎 Diagnose Access domain and application audience"
        continue-on-error: true
        env:
          CONFIRM_PROJECT: photointel
        run: python3 -m infra.scripts.diagnose_access

      - name: "🧰 Config"
        id: notify_observed_002
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
        
      - name: "▶ ️ Execute command (Web install)"
        id: notify_observed_003
        run: npm ci
        working-directory: apps/web

      - name: "🏗 Build do frontend"
        id: notify_observed_004
        env:
          CONFIRM_PROJECT: photointel
        run: python3 -m infra.scripts.prepare_workflow_env worker-build
        
      - name: "📱 Build"
        if: ${{ always() && (steps.notify_observed_004.outcome == 'success' || steps.notify_observed_004.outcome == 'failure' || steps.notify_observed_004.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🏗 Build do frontend"
          label: "Build do frontend"
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "1"
          total: "3"
          outcome: ${{ steps.notify_observed_004.outcome }}
          
      - name: "🧪 API error diagnostics"
        run: npm test -- src/test/api-security.test.tsx
        working-directory: apps/web

      - name: "🧪 Worker relay + SPA"
        id: worker_tests
        run: node --test infra/cloudflare/cloud-run-proxy/worker.test.mjs
        
      - name: "📱 Testes"
        if: ${{ always() && (steps.worker_tests.outcome == 'success' || steps.worker_tests.outcome == 'failure' || steps.worker_tests.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧪 Worker relay + SPA"
          label: "Testes do Worker"
          outcome: ${{ steps.worker_tests.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "2"
          total: "3"

      - name: "▶ ️ Execute command (Headers copy)"
        id: notify_observed_005
        run: cp infra/cloudflare/worker-headers apps/web/dist/_headers
        
      - name: "🚀 Publicar Worker"
        id: notify_observed_006
        env:
          CONFIRM_PROJECT: photointel
        run: python3 -m infra.scripts.prepare_workflow_env worker-deploy

      - name: "📱 Publicação"
        if: ${{ always() && (steps.notify_observed_006.outcome == 'success' || steps.notify_observed_006.outcome == 'failure' || steps.notify_observed_006.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🚀 Publicar Worker"
          label: "Publicação"
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "3"
          total: "3"
          outcome: ${{ steps.notify_observed_006.outcome }}

      - name: "🧹 Config"
        if: ${{ always() && steps.notify_observed_001.outcome == 'success' }}
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup

      - name: "🔔 Resultado"
        if: ${{ always() && steps.notify_observed_001.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: end
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          outcome: ${{ job.status }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "3"
          total: "3"
