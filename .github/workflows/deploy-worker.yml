name: "🌐 Worker · Front + API"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-worker.yml']
permissions: {contents: read}
jobs:
  deploy:
    name: "🌐 Publish unified Worker"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: "📥 Código"
        id: notify_observed_001
        uses: actions/checkout@v4
      - name: "⚙ GCP Config"
        id: config
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: photointel
          release-sha: ${{ github.sha }}

      - name: "🔐 GCP Login"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.service_account }}

      - name: "🧰 Gcloud"
        uses: google-github-actions/setup-gcloud@v2

      - name: "⚙ Env"
        id: worker_env
        env:
          CONFIRM_PROJECT: photointel
        run: python3 infra/scripts/prepare_workflow_env.py worker

      - name: "🔎 Diagnose Access domain and application audience"
        continue-on-error: true
        env:
          CONFIRM_PROJECT: photointel
        run: python3 infra/scripts/diagnose_access.py

      - name: "🧰 Config"
        id: notify_observed_002
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - name: "▶ ️  Execute command"
        id: notify_observed_003
        run: npm --prefix apps/web ci
      - name: "▶ ️  Execute command"
        id: notify_observed_004
        run: npm --prefix apps/web run build
      - name: "🔔 [NOTIFY] ▶ ️  Execute command"
        if: ${{ always() && (steps.notify_observed_004.outcome == 'success' || steps.notify_observed_004.outcome == 'failure' || steps.notify_observed_004.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "▶ ️  Execute command"
          outcome: ${{ steps.notify_observed_004.outcome }}
      - name: "🧪 API error diagnostics"
        run: npm --prefix apps/web test -- src/test/api-security.test.tsx

      - name: "🧪 Worker relay + SPA"
        run: node --test infra/cloudflare/cloud-run-proxy/worker.test.mjs

      - name: "▶ ️  Execute command"
        id: notify_observed_005
        run: cp infra/cloudflare/worker-headers apps/web/dist/_headers
      - name: "▶ ️  Execute command"
        id: notify_observed_006
        env:
          CONFIRM_PROJECT: photointel
        run: python3 infra/scripts/prepare_workflow_env.py worker-deploy

      - name: "🔔 [NOTIFY] ▶ ️  Execute command"
        if: ${{ always() && (steps.notify_observed_006.outcome == 'success' || steps.notify_observed_006.outcome == 'failure' || steps.notify_observed_006.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "▶ ️  Execute command"
          outcome: ${{ steps.notify_observed_006.outcome }}

      - name: "🧹 Config"
        if: ${{ always() && steps.notify_observed_001.outcome == 'success' }}
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup

      - name: "🔔 Resultado"
        if: ${{ always() && steps.notify_observed_001.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: end
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          outcome: ${{ job.status }}
          completed: "1"
          total: "1"


