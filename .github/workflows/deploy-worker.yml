name: "🌐 Cloudflare Worker"

run-name: >-
  ${{ github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || format('Push to {0} ({1})', github.ref_name, github.sha) }}

on:
  push:
    branches: [main]
    paths:
      - 'apps/manage/**'
      - 'apps/web/**'
      - '.prettierrc.json'
      - '.prettierignore'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/contracts/**'
      - 'infra/cloudflare/**'
      - 'infra/scripts/prepare_workflow_env.py'
      - 'infra/scripts/cloudflare_setup.py'
      - 'infra/scripts/diagnose_access.py'
      - '.github/actions/gcp-config/**'
      - '.github/workflows/deploy-worker.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/manage/**'
      - 'packages/contracts/**'
      - 'infra/cloudflare/**'
      - 'infra/scripts/prepare_workflow_env.py'
      - 'infra/scripts/cloudflare_setup.py'
      - 'infra/scripts/diagnose_access.py'
      - '.github/actions/gcp-config/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions: {contents: read}

concurrency:
  group: photointel-cloudflare-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: "🔍 Detectar Alterações"
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set-matrix.outputs.apps }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with: {persist-credentials: false}
        
      - name: 🗳️ Filtrar Pastas Modificadas
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            COMMAND="git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }}"
          else
            if [ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]; then
              COMMAND="git diff --name-only HEAD~1 ${{ github.sha }}"
            else
              COMMAND="git diff --name-only ${{ github.event.before }} ${{ github.sha }}"
            fi
          fi

          CHANGED_FILES=$($COMMAND)
          CHANGED_FOLDERS=$(echo "$CHANGED_FILES" | xargs -I {} dirname {} | sort -u)
          
          APPS="[]"
          
          # Verifica se web mudou ou se mudou algo global/infra
          if echo "$CHANGED_FOLDERS" | grep -q "^apps/web" || [ -z "$CHANGED_FOLDERS" ] || echo "$CHANGED_FOLDERS" | grep -qE "^(infra|packages|\.)"; then
            APPS=$(echo $APPS | jq '. + ["web"]')
          fi

          # Verifica se manage mudou ou se mudou algo global/infra
          if echo "$CHANGED_FOLDERS" | grep -q "^apps/manage" || [ -z "$CHANGED_FOLDERS" ] || echo "$CHANGED_FOLDERS" | grep -qE "^(infra|packages|\.)"; then
            APPS=$(echo $APPS | jq '. + ["manage"]')
          fi

          echo "Apps selecionados para execução: $APPS"
          echo "apps=$APPS" >> $GITHUB_OUTPUT

  preflight:
    name: "🧪 Build & Test · ${{ matrix.app }}"
    needs: detect-changes
    if: ${{fromJson(needs.detect-changes.outputs.apps)[0] != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.apps) }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with: {persist-credentials: false}

      - name: "🧰 Node.js (${{ matrix.app }})"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: "📦 Install dependencies (${{ matrix.app }})"
        run: npm ci
        working-directory: apps/${{ matrix.app }}

      - name: "🧹 ESLint (${{ matrix.app }})"
        if: matrix.app == 'web'
        run: npm run lint
        working-directory: apps/${{ matrix.app }}

      - name: "📐 TypeScript (${{ matrix.app }})"
        if: matrix.app == 'web'
        run: npm run typecheck
        working-directory: apps/${{ matrix.app }}

      - name: "🧪 Tests (${{ matrix.app }})"
        run: npm test
        working-directory: apps/${{ matrix.app }}
        continue-on-error: ${{ matrix.app == 'manage' }}

      - name: "🧪 PWA tests"
        if: matrix.app == 'web'
        run: npm run test:pwa
        working-directory: apps/web

      - name: "🏗 Production Vite build"
        if: matrix.app == 'web'
        run: npm run build
        working-directory: apps/web

      - name: "🧪 Cloudflare Worker tests"
        if: matrix.app == 'manage'
        run: node --test infra/cloudflare/cloud-run-proxy/worker.test.mjs

  deploy:
    name: "🌐 Publish unified Worker"
    runs-on: ubuntu-latest
    needs: preflight
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: "📥 Código"
        id: notify_observed_001
        uses: actions/checkout@v4

      - name: "📱 Live · Início"
        id: notify_live_start
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: start
          total: "3"
          github-token: ${{ github.token }}
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}

      - name: "⚙ GCP Config"
        id: config
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: photointel
          release-sha: ${{ github.sha }}

      - name: "🔐 GCP Login"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.service_account }}

      - name: "🧰 Gcloud"
        uses: google-github-actions/setup-gcloud@v2

      - name: "⚙ Env"
        id: worker_env
        env:
          CONFIRM_PROJECT: photointel
        run: python3 -m infra.scripts.prepare_workflow_env worker

      - name: "🔎 Diagnose Access domain and application audience"
        continue-on-error: true
        env:
          CONFIRM_PROJECT: photointel
        run: python3 -m infra.scripts.diagnose_access

      - name: "🧰 Config"
        id: notify_observed_002
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
        
      - name: "▶ ️ Execute command (Web install)"
        id: notify_observed_003
        run: npm ci
        working-directory: apps/web

      - name: "🏗 Build do frontend"
        id: notify_observed_004
        env:
          CONFIRM_PROJECT: photointel
        run: python3 -m infra.scripts.prepare_workflow_env worker-build
        
      - name: "📱 Build"
        if: ${{ always() && (steps.notify_observed_004.outcome == 'success' || steps.notify_observed_004.outcome == 'failure' || steps.notify_observed_004.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🏗 Build do frontend"
          label: "Build do frontend"
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "1"
          total: "3"
          outcome: ${{ steps.notify_observed_004.outcome }}
          
      - name: "🧪 API error diagnostics"
        run: npm test -- src/test/api-security.test.tsx
        working-directory: apps/web

      - name: "🧪 Worker relay + SPA"
        id: worker_tests
        run: node --test infra/cloudflare/cloud-run-proxy/worker.test.mjs
        
      - name: "📱 Testes"
        if: ${{ always() && (steps.worker_tests.outcome == 'success' || steps.worker_tests.outcome == 'failure' || steps.worker_tests.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧪 Worker relay + SPA"
          label: "Testes do Worker"
          outcome: ${{ worker_tests.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "2"
          total: "3"

      - name: "▶ ️ Execute command (Headers copy)"
        id: notify_observed_005
        run: cp infra/cloudflare/worker-headers apps/web/dist/_headers
        
      - name: "🚀 Publicar Worker"
        id: notify_observed_006
        env:
          CONFIRM_PROJECT: photointel
        run: python3 -m infra.scripts.prepare_workflow_env worker-deploy

      - name: "📱 Publicação"
        if: ${{ always() && (steps.notify_observed_006.outcome == 'success' || steps.notify_observed_006.outcome == 'failure' || steps.notify_observed_006.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🚀 Publicar Worker"
          label: "Publicação"
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "3"
          total: "3"
          outcome: ${{ steps.notify_observed_006.outcome }}

      - name: "🧹 Config"
        if: ${{ always() && steps.notify_observed_001.outcome == 'success' }}
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup

      - name: "🔔 Resultado"
        if: ${{ always() && steps.notify_observed_001.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: end
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          outcome: ${{ job.status }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "3"
          total: "3"
