name: "🔮 RV · 🌐 Cloudflare · Frontends"

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('🌐 Cloudflare · {0} · {1} · {2}', inputs.action, inputs.app, inputs.request_id || 'manual') || github.event_name == 'pull_request' && format('🌐 Cloudflare · PR #{0}', github.event.pull_request.number) || format('🌐 Cloudflare · Push · {0}', github.ref_name) }}

on:
  push:
    branches: [main]
    paths:
      - 'apps/manage/**'
      - 'apps/web/**'
      - '.prettierrc.json'
      - '.prettierignore'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/contracts/**'
      - 'packages/env/**'
      - 'infra/cloudflare/**'
      - 'infra/scripts/prepare_workflow_env.py'
      - 'infra/scripts/cloudflare_setup.py'
      - 'infra/scripts/diagnose_access.py'
      - 'infra/scripts/deploy_manage.py'
      - '.github/actions/notify/**'
      - '.github/actions/gcp-config/**'
      - '.github/actions/frontend-source/**'
      - '.github/workflows/deploy-worker.yml'

  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.prettierrc.json'
      - '.prettierignore'
      - 'apps/web/**'
      - 'apps/manage/**'
      - 'packages/contracts/**'
      - 'packages/env/**'
      - 'infra/cloudflare/**'
      - 'infra/scripts/prepare_workflow_env.py'
      - 'infra/scripts/cloudflare_setup.py'
      - 'infra/scripts/diagnose_access.py'
      - 'infra/scripts/deploy_manage.py'
      - '.github/actions/notify/**'
      - '.github/actions/gcp-config/**'
      - '.github/actions/frontend-source/**'
      - '.github/workflows/deploy-worker.yml'

  workflow_dispatch:
    inputs:
      action:
        description: "Ação"
        type: choice
        options: [build, build-and-deploy]
        default: build-and-deploy
      app:
        description: "App"
        type: choice
        options: [all, web, manage]
        default: all
      sha:
        description: "SHA opcional"
        type: string
        default: ''
      request_id:
        description: "ID"
        type: string
        default: ''

permissions:
  contents: read

env:
  BASH_ENV: ${{ github.workspace }}/scripts/ci/pretty-logs.sh

defaults:
  run:
    shell: bash -eo pipefail {0}

concurrency:
  # PR previews são descartáveis; deploys de produção devem concluir com segurança.
  group: ${{ github.event_name == 'pull_request' && format('photointel-frontends-pr-{0}', github.event.pull_request.number) || 'photointel-frontends-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================================
  # 1. Detecção de Alterações & Seleção de Apps
  # ============================================================================
  detect-changes:
    name: "🔍 Detectar alterações"
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.actor != 'renovate[bot]' &&
           github.actor != 'dependabot[bot]' &&
           github.event.pull_request.user.login != 'renovate[bot]' &&
           github.event.pull_request.user.login != 'dependabot[bot]' &&
           github.event.head_commit.author.username != 'renovate[bot]' &&
           github.event.head_commit.author.username != 'dependabot[bot]' &&
           !contains(github.event.head_commit.message, 'dependabot[bot]') &&
           !contains(github.event.head_commit.message, 'renovate[bot]')) }}
    outputs:
      apps: ${{ steps.set-matrix.outputs.apps }}
    steps:
      - name: "📥 Baixar histórico completo do repositório"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: "🗳️ Selecionar aplicações afetadas"
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_APP: ${{ inputs.app || 'all' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$REQUESTED_APP" in
              all) apps='["web","manage"]' ;;
              web|manage) apps="$(jq -cn --arg app "$REQUESTED_APP" '[$app]')" ;;
              *) echo '::error::App inválido'; exit 1 ;;
            esac
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$(git merge-base "$BASE_SHA" HEAD)"
            elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              base="$BEFORE_SHA"
            else
              base=""
            fi
            if [[ -z "$base" ]]; then
              apps='["web","manage"]'
            else
              files="$(git diff --name-only "$base" HEAD)"
              global='^(package(-lock)?\.json|\.prettier(rc\.json|ignore)|packages/|infra/|\.github/(actions/(gcp-config|frontend-source)/|workflows/deploy-worker\.yml))'
              if grep -Eq "$global" <<< "$files"; then
                apps='["web","manage"]'
              else
                apps='[]'
                if grep -q '^apps/web/' <<< "$files"; then apps="$(jq -c '. + ["web"]' <<< "$apps")"; fi
                if grep -q '^apps/manage/' <<< "$files"; then apps="$(jq -c '. + ["manage"]' <<< "$apps")"; fi
              fi
            fi
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Selected: $apps"

  # ============================================================================
  # 2. Validação & Build (Preflight por App)
  # ============================================================================
  preflight:
    name: "🧪 Build & Test · ${{ matrix.app }}"
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.apps != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.apps) }}
    steps:
      - name: "📥 Baixar código"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: "📌 Resolver SHA de origem"
        uses: ./.github/actions/frontend-source
        with:
          sha: ${{ inputs.sha }}

      - name: "🧰 Configurar Node.js 26 (${{ matrix.app }})"
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: "📦 Instalar dependências (${{ matrix.app }})"
        working-directory: apps/${{ matrix.app }}
        run: |
          npm ci

      - name: "🧹 Verificar lint · ESLint (${{ matrix.app }})"
        if: matrix.app == 'web'
        id: check_1
        continue-on-error: true
        working-directory: apps/${{ matrix.app }}
        run: |
          npm run lint

      - name: "🔎 Verificar tipagem · TypeScript (${{ matrix.app }})"
        id: check_2
        continue-on-error: true
        working-directory: apps/${{ matrix.app }}
        run: |
          npm run typecheck

      - name: "🧪 Executar testes unitários (${{ matrix.app }})"
        id: check_3
        continue-on-error: true
        working-directory: apps/${{ matrix.app }}
        run: |
          npm test

      - name: "📱 Executar testes de PWA (web)"
        if: matrix.app == 'web'
        id: check_4
        continue-on-error: true
        working-directory: apps/web
        run: |
          npm run test:pwa

      - name: "🏗️ Gerar build de produção (${{ matrix.app }})"
        if: ${{ !(matrix.app == 'manage' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action != 'build') }}
        id: check_5
        continue-on-error: true
        working-directory: apps/${{ matrix.app }}
        run: |
          npm run build

      - name: "⚡ Executar testes do Cloudflare Worker"
        if: matrix.app == 'web'
        id: check_6
        continue-on-error: true
        run: |
          ci_run "Cloudflare: node --test infra/cloudflare/cloud-run-proxy/worker.test.mjs" \
            node --test infra/cloudflare/cloud-run-proxy/worker.test.mjs

      - name: "🐍 Validar sintaxe do script de deploy (manage)"
        if: matrix.app == 'manage'
        id: check_7
        continue-on-error: true
        run: |
          python3 -m py_compile infra/scripts/deploy_manage.py

      - name: "📋 Consolidar resultado · ${{ matrix.app }}"
        if: ${{ always() }}
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          failures=$(jq -c '[to_entries[] | select(.value.outcome == "failure") | .key]' <<< "$STEP_RESULTS")
          count=$(jq 'length' <<< "$failures")
          echo "### Verificações · ${{ matrix.app }}" >> "$GITHUB_STEP_SUMMARY"
          if (( count > 0 )); then
            jq -r '.[] | "- ❌ " + .' <<< "$failures" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$count verificação(ões) falharam."
            exit 1
          fi
          echo "✅ Sem falhas." >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # 3. Deploy em Produção · Photos Web Worker (apps/web)
  # ============================================================================
  deploy-web:
    name: "🌐 Publish Photos Worker"
    needs: [detect-changes, preflight]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.action != 'build' && needs.preflight.result == 'success' && contains(fromJSON(needs.detect-changes.outputs.apps), 'web') }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: "📥 Baixar código"
        id: notify_observed_001
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: "📌 Resolver SHA de origem"
        uses: ./.github/actions/frontend-source
        with:
          sha: ${{ inputs.sha }}

      - name: "📱 Notificar início do deploy (Live)"
        id: notify_live_start
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: start
          total: "3"
          github-token: ${{ github.token }}
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}

      - name: "⚙️ Preparar configuração de produção (GCP)"
        id: config
        uses: ./.github/actions/gcp-config
        with:
          mode: prepare
          config-env: ${{ vars.GCP_CONFIG_ENV }}
          confirm-project: photointel
          release-sha: ${{ github.sha }}

      - name: "🔐 Autenticar no GCP via Workload Identity"
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account: ${{ steps.config.outputs.service_account }}

      - name: "🧰 Configurar Google Cloud SDK (gcloud)"
        uses: google-github-actions/setup-gcloud@v3

      - name: "⚙️ Gerar variáveis de ambiente do Worker"
        id: worker_env
        env:
          CONFIRM_PROJECT: photointel
        run: |
          ci_run "Cloudflare: python3 -m infra.scripts.prepare_workflow_env worker" \
            python3 -m infra.scripts.prepare_workflow_env worker

      - name: "🔎 Diagnosticar domínio e audience do Cloudflare Access"
        continue-on-error: true
        env:
          CONFIRM_PROJECT: photointel
        run: |
          ci_run "Cloudflare: python3 -m infra.scripts.diagnose_access" \
            python3 -m infra.scripts.diagnose_access

      - name: "🧰 Configurar Node.js 26"
        id: notify_observed_002
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: "📦 Instalar dependências do frontend (web)"
        id: notify_observed_003
        working-directory: apps/web
        run: |
          npm ci

      - name: "🏗️ Gerar build do frontend (web)"
        id: notify_observed_004
        env:
          CONFIRM_PROJECT: photointel
        run: |
          ci_run "Cloudflare: python3 -m infra.scripts.prepare_workflow_env worker" \
            python3 -m infra.scripts.prepare_workflow_env worker-build

      - name: "📱 Notificar etapa 1/3 · Build"
        if: ${{ always() && (steps.notify_observed_004.outcome == 'success' || steps.notify_observed_004.outcome == 'failure' || steps.notify_observed_004.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🏗 Build do frontend"
          label: "Build do frontend"
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "1"
          total: "3"
          outcome: ${{ steps.notify_observed_004.outcome }}

      - name: "🛡️ Testar diagnóstico de erros da API"
        working-directory: apps/web
        run: |
          npm test -- src/test/api-security.test.tsx

      - name: "🧪 Testar proxy relay e SPA do Worker"
        id: worker_tests
        run: |
          ci_run "Cloudflare: node --test infra/cloudflare/cloud-run-proxy/worker.test.mjs" \
            node --test infra/cloudflare/cloud-run-proxy/worker.test.mjs

      - name: "📱 Notificar etapa 2/3 · Testes"
        if: ${{ always() && (steps.worker_tests.outcome == 'success' || steps.worker_tests.outcome == 'failure' || steps.worker_tests.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🧪 Worker relay + SPA"
          label: "Testes do Worker"
          outcome: ${{ steps.worker_tests.outcome }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "2"
          total: "3"

      - name: "📄 Copiar regras de headers para dist/_headers"
        id: notify_observed_005
        run: |
          cp infra/cloudflare/worker-headers apps/web/dist/_headers

      - name: "🚀 Publicar Photos Worker no Cloudflare"
        id: notify_observed_006
        env:
          CONFIRM_PROJECT: photointel
        run: |
          ci_run "Cloudflare: python3 -m infra.scripts.prepare_workflow_env worker" \
            python3 -m infra.scripts.prepare_workflow_env worker-deploy

      - name: "📱 Notificar etapa 3/3 · Publicação"
        if: ${{ always() && (steps.notify_observed_006.outcome == 'success' || steps.notify_observed_006.outcome == 'failure' || steps.notify_observed_006.outcome == 'cancelled') }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: step
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          step: "🚀 Publicar Worker"
          label: "Publicação"
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "3"
          total: "3"
          outcome: ${{ steps.notify_observed_006.outcome }}

      - name: "🧹 Limpar configuração temporária (GCP)"
        if: ${{ always() && steps.notify_observed_001.outcome == 'success' }}
        uses: ./.github/actions/gcp-config
        with:
          mode: cleanup

      - name: "🔔 Notificar resultado final do deploy"
        if: ${{ always() && steps.notify_observed_001.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          action: end
          device-id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_TOKEN }}
          workflow: ${{ github.workflow }}
          job: ${{ github.job }}
          outcome: ${{ job.status }}
          activity-id: ${{ steps.notify_live_start.outputs.activity_id }}
          completed: "3"
          total: "3"

  # ============================================================================
  # 4. Deploy em Produção · Manage Worker (apps/manage)
  # ============================================================================
  deploy-manage:
    name: "🛠️ Publish Manage Worker"
    needs: [detect-changes, preflight]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.action != 'build' && needs.preflight.result == 'success' && contains(fromJSON(needs.detect-changes.outputs.apps), 'manage') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CONFIRM_PROJECT: photointel
    steps:
      - name: "📥 Baixar código"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: "📌 Resolver SHA de origem"
        uses: ./.github/actions/frontend-source
        with:
          sha: ${{ inputs.sha }}

      - name: "🧰 Configurar Node.js 26"
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/manage/package-lock.json

      - name: "🟦 Renderizar configuração TypeScript"
        env:
          GCP_CONFIG_ENV: ${{ vars.GCP_CONFIG_ENV }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          umask 077
          node --experimental-strip-types packages/env/src/deploy.ts render-config infra/gcp/config.local.json

      - name: "📦 Instalar dependências do frontend (manage)"
        run: |
          npm --prefix apps/manage ci

      - name: "🔎 Configurar Sentry browser DSN"
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node --experimental-strip-types scripts/ci/manage-browser-env.ts

      - name: "🏗️ Gerar build de produção (manage)"
        run: |
          ci_run "Cloudflare: npm --prefix apps/manage run build" \
            npm --prefix apps/manage run build

      - name: "🚀 Publicar Manage Worker, Access e domínio"
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          WORKFLOW_SECRET_SOURCE: github
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MANAGE_GITHUB_API_TOKEN: ${{ secrets.MANAGE_GITHUB_API_TOKEN }}
          MANAGE_CLOUDFLARE_API_TOKEN: ${{ secrets.MANAGE_CLOUDFLARE_API_TOKEN }}
          MANAGE_SENTRY_API_TOKEN: ${{ secrets.MANAGE_SENTRY_API_TOKEN }}
          MANAGE_GITHUB_WEBHOOK_SECRET: ${{ secrets.MANAGE_GITHUB_WEBHOOK_SECRET }}
          MANAGE_GCP_BUILD_RELEASE_URL: ${{ secrets.MANAGE_GCP_BUILD_RELEASE_URL }}
          MANAGE_GCP_BUILD_PROVISION_URL: ${{ secrets.MANAGE_GCP_BUILD_PROVISION_URL }}
          MANAGE_GCP_BUILD_CALLBACK_SECRET: ${{ secrets.MANAGE_GCP_BUILD_CALLBACK_SECRET }}
          MANAGE_XRELAY_NOTIFICATION_URL: ${{ secrets.MANAGE_XRELAY_NOTIFICATION_URL }}
          MANAGE_XRELAY_NOTIFICATION_TOKEN: ${{ secrets.MANAGE_XRELAY_NOTIFICATION_TOKEN }}
          MANAGE_TERMINAL_GATEWAY_SECRET: ${{ secrets.MANAGE_TERMINAL_GATEWAY_SECRET }}
          MANAGE_MODAL_BILLING_TOKEN: ${{ secrets.MANAGE_MODAL_BILLING_TOKEN }}
        run: |
          ci_run "Cloudflare: python3 -m infra.scripts.deploy_manage apply" \
            python3 -m infra.scripts.deploy_manage apply

      - name: "🧹 Limpar configuração temporária"
        if: always()
        run: rm -f infra/gcp/config.local.json
