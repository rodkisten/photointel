name: ${COMPOSE_PROJECT_NAME:-photointel}
x-runtime: &runtime
  image: ${PHOTOINTEL_IMAGE:-photointel-api:local}
  build:
    context: ../..
    dockerfile: infra/docker/api.Dockerfile
    secrets: [build_ca]
  env_file: ../../.env
  environment: &runtime-env
    APP_ENV: development
    AUTH_MODE: local
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-photointel}:${POSTGRES_PASSWORD:?run make setup}@postgres:5432/${POSTGRES_DB:-photointel}
    STORAGE_ENDPOINT: http://minio:9000
    STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-photointel-local}
    STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?run make setup}
    TEMP_DIRECTORY: /data/processing
    ICLOUD_SESSION_DIRECTORY: /data/icloud-session
    ICLOUD_DOWNLOAD_DIRECTORY: /data/icloud-downloads
  volumes:
    - processing:/data/processing
    - icloud-session:/data/icloud-session
    - icloud-downloads:/data/icloud-downloads
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  stop_grace_period: 90s
  logging: &logs
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-photointel}
      POSTGRES_USER: ${POSTGRES_USER:-photointel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make setup}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 90s
    logging: *logs
  minio:
    image: ${PHOTOINTEL_MINIO_IMAGE:-photointel-minio:local}
    build:
      context: ../..
      dockerfile: infra/docker/minio.Dockerfile
      secrets: [build_ca]
    command: server /data --console-address :9001
    depends_on: {permissions: {condition: service_completed_successfully}}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-photointel-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run make setup}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:9000/minio/health/ready]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    logging: *logs
  bucket:
    <<: *runtime
    depends_on: {minio: {condition: service_healthy}}
    command: [python, infra/scripts/init-private-bucket.py]
    restart: "no"
  permissions:
    image: busybox:1.37
    user: "0:0"
    volumes: [processing:/data/processing, icloud-session:/data/icloud-session, icloud-downloads:/data/icloud-downloads, minio-data:/data/minio]
    command: [sh, -ec, "chown 10001:10001 /data/processing /data/icloud-session /data/icloud-downloads /data/minio; chmod 0700 /data/processing /data/icloud-session /data/icloud-downloads /data/minio"]
    restart: "no"
  migrate:
    <<: *runtime
    command: [alembic, -c, infra/migrations/alembic.ini, upgrade, head]
    depends_on: {postgres: {condition: service_healthy}, permissions: {condition: service_completed_successfully}}
    restart: "no"
  api:
    <<: *runtime
    ports: ["127.0.0.1:8000:8000"]
    depends_on: {migrate: {condition: service_completed_successfully}, bucket: {condition: service_completed_successfully}}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    cpus: 1
  worker:
    <<: *runtime
    command: [python, -m, photointel.services.worker]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python, infra/scripts/heartbeat-health.py, --role, worker]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 1g
    cpus: 1
  ingestion:
    <<: *runtime
    command: [python, -m, photointel.services.ingestion]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python, infra/scripts/heartbeat-health.py, --role, ingestion]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 768m
    cpus: 1
  frontend:
    image: ${PHOTOINTEL_WEB_IMAGE:-photointel-web:local}
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      secrets: [build_ca]
    ports: ["127.0.0.1:5173:8080"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health/web]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    restart: unless-stopped
    logging: *logs
volumes:
  postgres-data:
  minio-data:
  processing:
  icloud-session:
  icloud-downloads:
secrets:
  build_ca:
    file: ${BUILD_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}
