name: ${COMPOSE_PROJECT_NAME:-photointel}
x-runtime: &runtime
  image: ${PHOTOINTEL_IMAGE:?set a versioned API image}
  env_file: ../../.env.runtime
  environment: &runtime-env
    APP_ENV: production
    AUTH_MODE: cloudflare
    DATABASE_URL: ${APP_DATABASE_URL:?configure the limited application role}
    MIGRATION_DATABASE_URL: ""
    TEMP_DIRECTORY: /data/processing
    ICLOUD_SESSION_DIRECTORY: /data/icloud-session
    ICLOUD_DOWNLOAD_DIRECTORY: /data/icloud-downloads
  volumes:
    - ../../var/processing:/data/processing
    - ../../var/icloud-session:/data/icloud-session
    - ../../var/icloud-downloads:/data/icloud-downloads
  read_only: true
  tmpfs: [/tmp:rw,noexec,nosuid,size=256m]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  stop_grace_period: 120s
  logging: &logs
    driver: json-file
    options: {max-size: "10m", max-file: "5"}
  networks: [backend]
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-photointel}
      POSTGRES_USER: ${POSTGRES_USER:-photointel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-photointel_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?required}
    volumes: [../../var/postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    shm_size: 512m
    mem_limit: 4g
    cpus: 2
    stop_grace_period: 120s
    logging: *logs
    networks: [backend]
  migrate:
    <<: *runtime
    command: [alembic, -c, infra/migrations/alembic.ini, upgrade, head]
    environment:
      <<: *runtime-env
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?configure the migration role}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?configure the migration role}
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"
  api:
    <<: *runtime
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    cpus: 1
  worker:
    <<: *runtime
    command: [python, -m, photointel.services.worker]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python, infra/scripts/heartbeat-health.py, --role, worker]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 2g
    cpus: 1
  ingestion:
    <<: *runtime
    command: [python, -m, photointel.services.ingestion]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python, infra/scripts/heartbeat-health.py, --role, ingestion]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 1g
    cpus: 1
  gateway:
    image: ${PHOTOINTEL_WEB_IMAGE:?set a versioned web image}
    depends_on: {api: {condition: service_healthy}}
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=64m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:8080/health/web]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logs
    networks: [backend, tunnel]
  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    command: tunnel --no-autoupdate run
    environment: {TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?required}"}
    depends_on: {gateway: {condition: service_healthy}}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 128m
    logging: *logs
    networks: [tunnel]
networks:
  backend:
  tunnel:
