name = "photointel-api-relay"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

# Replace with the actual deployed Service URL and your same-site Pages hostname.
[vars]
CLOUD_RUN_ORIGIN = "https://photointel-api.run.app"
FRONTEND_ORIGIN = "https://photos.migos.club"

# Attach a custom domain in your own Cloudflare zone; protect it with Access.
[[routes]]
pattern = "api.photos.migos.club"
custom_domain = true
