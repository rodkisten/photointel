# Administrative Cloud Build webhook source: connected private main repository.
# Trigger substitution _RUN_ID=$(body.run_id) enables signed status callbacks.
# _MODE defaults to permissions; never grant an unauthenticated public IAM build.
substitutions:
  _RUN_ID: ""
  _EVENT_SHA: ""
  _MODE: permissions
  _AUTHORIZE_CHARGES: "false"
steps:
  - id: configuration
    name: python:3.12-slim
    entrypoint: bash
    secretEnv: [GCP_CONFIG_ENV]
    args:
      - -ceu
      - |
        if [[ "$COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]] &&
           [[ "$COMMIT_SHA" == "${_EVENT_SHA}" ]] &&
           python3 -m pip install --quiet --disable-pip-version-check python-dotenv==1.2.4 &&
           CONFIRM_PROJECT=photointel RELEASE_SHA="$COMMIT_SHA" python3 infra/gcp/gcp-env.py; then
          touch /workspace/.manage-config-ok
        else
          echo "configuration FAILED" >&2
        fi
  - id: provision
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ ! -f /workspace/.manage-config-ok ]]; then
          echo "provision skipped: configuration failed" >&2
        else
          export CONFIRM_PROJECT=photointel
          export BOOTSTRAP_MODE="${_MODE}"
          export AUTHORIZE_CHARGES="${_AUTHORIZE_CHARGES}"
          if [[ "$BOOTSTRAP_MODE" == permissions ]] &&
             apt-get update -qq &&
             apt-get install -y -qq jq curl ca-certificates >/dev/null &&
             bash infra/gcp/bootstrap.sh; then
            touch /workspace/.manage-provision-ok
          else
            echo "Permission-only provision failed or unsupported mode" >&2
          fi
        fi
  - id: callback
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    secretEnv: [CALLBACK_SECRET]
    args:
      - -ceu
      - |
        status=failed
        if [[ -f /workspace/.manage-provision-ok ]]; then status=success; fi
        if [[ "${_RUN_ID}" =~ ^[a-f0-9-]{36}$ ]]; then
          curl -fsS --max-time 10 \
            -H "Authorization: Bearer $$CALLBACK_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"run_id":"${_RUN_ID}","status":"'"$$status"'","build_id":"$BUILD_ID"}' \
            https://photos-hooks.migos.club/hooks/cloud-build ||
            echo "Manage callback failed; consult Cloud Build directly" >&2
        fi
        if [[ "$$status" == failed ]]; then exit 1; fi
availableSecrets:
  secretManager:
    - versionName: projects/photointel/secrets/photointel-gcp-config/versions/latest
      env: GCP_CONFIG_ENV
    - versionName: projects/photointel/secrets/photointel-gcp-build-callback/versions/latest
      env: CALLBACK_SECRET
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 2700s
