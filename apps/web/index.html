<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090909" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="no-referrer" />

    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="PhotoIntel" />
    <link rel="apple-touch-startup-image" href="/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <title>PhotoIntel · Private Photo Cloud</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        background: #090909;
        color: #f5f5f5;
        font:
          500 17px/1.5 Geist,
          system-ui,
          sans-serif;
        letter-spacing: -0.02em;
      }
      #boot-splash .splash-mark {
        width: 120px;
        height: 120px;
        display: grid;
        place-items: center;
        margin-bottom: 12px;
      }
      #boot-splash .splash-mark img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #boot-splash .splash-caption {
        font-size: 10px;
        color: #777;
        letter-spacing: 0.22em;
      }
      #boot-splash .splash-loader {
        width: 108px;
        height: 2px;
        overflow: hidden;
        background: #303030;
        border-radius: 10px;
        margin-top: 16px;
        position: relative;
      }
      #boot-splash .splash-loader:before {
        content: '';
        position: absolute;
        inset: 0;
        width: 38%;
        background: #eee;
        animation: splash-progress 1.5s ease-in-out infinite;
      }
      @keyframes splash-progress {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(370%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .splash-loader:before {
          animation: none;
          width: 65%;
        }
      }
    </style>

    <script>
      // Runs before Vite/Firebase modules, so even a failed JS bundle can show a diagnosis.
      (() => {
        let bootstrapFailure = false;
        window.addEventListener(
          'error',
          (event) => {
            if (event.target instanceof HTMLScriptElement || event.target instanceof HTMLLinkElement) {
              bootstrapFailure = true;
            }
          },
          true,
        );

        window.addEventListener('load', () => {
          setTimeout(() => {
            const root = document.getElementById('root');
            if (!root || root.children.length > 0) return;

            const id = crypto.randomUUID();
            const code = bootstrapFailure ? 'RESOURCE_LOAD_FAILURE' : 'BOOT_FAILURE';
            document.getElementById('boot-splash')?.remove();
            const panel = document.createElement('section');
            panel.setAttribute('role', 'alert');
            panel.setAttribute('data-photointel-error', '');
            panel.style.cssText =
              'min-height:100dvh;padding:48px 20px;background:#101112;color:#eceeed;' +
              'font:15px/1.65 system-ui,sans-serif;display:grid;place-items:center';
            panel.innerHTML = `
              <div style="max-width:570px;width:100%;padding:30px;border:1px solid #343936;
                          border-radius:20px;background:#181a19">
                <h1 style="font-size:24px;margin:0 0 14px">O PhotoIntel não conseguiu iniciar</h1>
                <p>O carregamento do aplicativo falhou. Nenhum dado original foi alterado.</p>
                <p>Correlation ID: <code id="photointel-boot-id"></code></p>
                <p id="photointel-boot-code" style="opacity:.75"></p>
                <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:22px">
                  <button type="button" id="photointel-boot-reload">Tentar novamente</button>
                  <button type="button" id="photointel-boot-copy">Copiar ID</button>
                  <a href="https://dash.cloudflare.com/?to=/:account/workers-and-pages"
                     target="_blank" rel="noopener noreferrer">Ver logs no Cloudflare</a>
                </div>
              </div>`;
            if (root) {
              root.replaceChildren(panel);
            } else {
              document.body.appendChild(panel);
            }
            document.getElementById('photointel-boot-id').textContent = id;
            document.getElementById('photointel-boot-code').textContent = 'Tipo: ' + code;
            document.getElementById('photointel-boot-reload').onclick = () => {
              const url = new URL(location.href);
              url.searchParams.set('__refresh', String(Date.now()));
              location.replace(url.href);
            };
            document.getElementById('photointel-boot-copy').onclick = () => {
              void navigator.clipboard.writeText(id).catch(() => undefined);
            };
            // Only a minimal whitelisted event reaches Cloudflare logs.
            void fetch('/__diagnostics/client-errors', {
              method: 'POST',
              credentials: 'same-origin',
              cache: 'no-store',
              keepalive: true,
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id, phase: 'bootstrap', code }),
            }).catch(() => undefined);
          }, 5000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="Iniciando PhotoIntel">
      <div class="splash-mark" aria-hidden="true">
        <img src="/mark.svg" alt="" width="120" height="120" />
      </div>
      <strong>PhotoIntel</strong><span class="splash-caption">PRIVATE INTELLIGENT PHOTOS</span>
      <span class="splash-loader" aria-hidden="true"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/fcm.js"></script>
  </body>
</html>
